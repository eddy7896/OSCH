connectorId: erp-connector
generate:
  # Admin Node SDK (ADR-0008): typed wrappers over firebase-admin's Data Connect executeQuery/executeMutation.
  # Used only by the gateway through packages/database. Never ship this to a browser or mobile app.
  adminNodeSdk:
    - outputDir: ../../packages/database/generated/erp-admin-sdk
      package: "@oruschools/erp-admin-sdk"
