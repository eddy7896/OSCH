# ---- Attendance (P3-4)
query GetAttendanceDay($schoolId: UUID!, $classroomId: UUID!, $date: Date!) @auth(level: NO_ACCESS) {
  attendanceDays(where: {schoolId: {eq: $schoolId}, classroomId: {eq: $classroomId}, date: {eq: $date}}, limit: 1) {
    id date locked submittedAt submissionId submittedBy { id displayName email }
    marks: attendanceMarks_on_day(limit: 1000) { id status note student { id } }
  }
}

query ListAttendanceDays($schoolId: UUID!, $classroomId: UUID!, $from: Date!, $to: Date!, $updatedSince: Timestamp) @auth(level: NO_ACCESS) {
  attendanceDays(where: {schoolId: {eq: $schoolId}, classroomId: {eq: $classroomId}, date: {ge: $from, le: $to}, updatedAt: {ge: $updatedSince}}, orderBy: [{date: DESC}], limit: 400) {
    id date locked updatedAt marks: attendanceMarks_on_day(limit: 1000) { status }
  }
}

query AttendanceDaysOn($schoolId: UUID!, $date: Date!) @auth(level: NO_ACCESS) {
  attendanceDays(where: {schoolId: {eq: $schoolId}, date: {eq: $date}}, limit: 2000) { id classroomId locked }
}

query AttendanceOfStudent($schoolId: UUID!, $studentId: UUID!, $from: Date!, $to: Date!) @auth(level: NO_ACCESS) {
  attendanceMarks(where: {schoolId: {eq: $schoolId}, studentId: {eq: $studentId}, day: {date: {ge: $from, le: $to}}}, limit: 1000) { status note day { date classroomId } }
}

query DaysOfClass($schoolId: UUID!, $classroomId: UUID!, $from: Date!, $to: Date!) @auth(level: NO_ACCESS) {
  attendanceDays(where: {schoolId: {eq: $schoolId}, classroomId: {eq: $classroomId}, date: {ge: $from, le: $to}}, limit: 400) { date }
}

query ListAttendanceStatusLabels($schoolId: UUID!) @auth(level: NO_ACCESS) {
  attendanceStatusLabels(where: {schoolId: {eq: $schoolId}}, limit: 20) { status label }
}

query ClassRoster($schoolId: UUID!, $academicYearId: UUID!, $classroomId: UUID!) @auth(level: NO_ACCESS) {
  studentEnrollments(where: {_and: [{schoolId: {eq: $schoolId}}, {academicYearId: {eq: $academicYearId}}, {classroomId: {eq: $classroomId}}, {student: {status: {eq: ACTIVE}}}]}, orderBy: [{createdAt: ASC}], limit: 1000) {
    student { id enrollmentId firstName lastName }
  }
}

query GetStaffAttendance($schoolId: UUID!, $staffId: UUID!, $date: Date!) @auth(level: NO_ACCESS) {
  staffAttendances(where: {schoolId: {eq: $schoolId}, staffId: {eq: $staffId}, date: {eq: $date}}, limit: 1) { id date checkIn checkOut checkInStamp checkInDistanceM checkInReason checkInDeviceTime needsConfirm confirmedAt checkOutStamp checkOutDistanceM checkOutReason checkOutDeviceTime }
}

query StaffAttendanceOn($schoolId: UUID!, $date: Date!) @auth(level: NO_ACCESS) {
  staffAttendances(where: {schoolId: {eq: $schoolId}, date: {eq: $date}}, limit: 2000) { id staffId checkIn checkOut checkInStamp checkInDistanceM checkInReason checkInDeviceTime needsConfirm confirmedAt checkOutStamp checkOutDistanceM checkOutReason checkOutDeviceTime }
}

query StaffAttendanceOfStaff($schoolId: UUID!, $staffId: UUID!, $from: Date!, $to: Date!) @auth(level: NO_ACCESS) {
  staffAttendances(where: {schoolId: {eq: $schoolId}, staffId: {eq: $staffId}, date: {ge: $from, le: $to}}, orderBy: [{date: DESC}], limit: 400) { date checkIn checkOut checkInStamp checkInDistanceM checkInReason checkInDeviceTime needsConfirm confirmedAt checkOutStamp checkOutDistanceM checkOutReason checkOutDeviceTime }
}

# ---- Exams and marks (P3-5)
query SchoolGradeBands($schoolId: UUID!) @auth(level: NO_ACCESS) {
  school(id: $schoolId) { gradeBands }
}

query ListAssessmentTerms($schoolId: UUID!, $academicYearId: UUID) @auth(level: NO_ACCESS) {
  assessmentTerms(where: {schoolId: {eq: $schoolId}, academicYearId: {eq: $academicYearId}}, orderBy: [{createdAt: ASC}], limit: 200) { id name academicYearId }
}

query ListExams($schoolId: UUID!, $termId: UUID, $classroomId: UUID, $subjectId: UUID) @auth(level: NO_ACCESS) {
  exams(where: {schoolId: {eq: $schoolId}, termId: {eq: $termId}, classroomId: {eq: $classroomId}, subjectId: {eq: $subjectId}}, orderBy: [{examDate: DESC}, {title: ASC}], limit: 1000) {
    id title examDate maxTenths termId term { id name academicYearId } classroom { id name } subject { id name code }
  }
}

query GetExam($schoolId: UUID!, $id: UUID!) @auth(level: NO_ACCESS) {
  exams(where: {schoolId: {eq: $schoolId}, id: {eq: $id}}, limit: 1) {
    id title examDate maxTenths lastSubmissionId termId term { id name academicYearId } classroom { id name } subject { id name code }
    marks: marks_on_exam(limit: 1000) { id tenths absent studentId updatedAt }
  }
}

query CountMarksOfExam($schoolId: UUID!, $examId: UUID!) @auth(level: NO_ACCESS) {
  marks(where: {schoolId: {eq: $schoolId}, examId: {eq: $examId}}) { _count }
}

query CountExamsOfTerm($schoolId: UUID!, $termId: UUID!) @auth(level: NO_ACCESS) {
  exams(where: {schoolId: {eq: $schoolId}, termId: {eq: $termId}}) { _count }
}

query MarksOfStudentInTerm($schoolId: UUID!, $studentId: UUID!, $termId: UUID!) @auth(level: NO_ACCESS) {
  marks(where: {schoolId: {eq: $schoolId}, studentId: {eq: $studentId}, exam: {termId: {eq: $termId}}}, limit: 500) { examId tenths absent }
}

# ---- Leave (P3-6)
query ListLeaveTypes($schoolId: UUID!) @auth(level: NO_ACCESS) {
  leaveTypes(where: {schoolId: {eq: $schoolId}}, orderBy: [{name: ASC}], limit: 100) { id name paid quotaHalfDays }
}

query CountLeaveOfType($schoolId: UUID!, $leaveTypeId: UUID!) @auth(level: NO_ACCESS) {
  leaveRequests(where: {schoolId: {eq: $schoolId}, leaveTypeId: {eq: $leaveTypeId}}) { _count }
}

query ListLeaveBalances($schoolId: UUID!, $staffId: UUID, $academicYearId: UUID) @auth(level: NO_ACCESS) {
  leaveBalances(where: {schoolId: {eq: $schoolId}, staffId: {eq: $staffId}, academicYearId: {eq: $academicYearId}}, limit: 1000) {
    id staffId academicYearId allowedHalfDays remainingHalfDays leaveType { id name paid }
  }
}

query ListLeaveRequests($schoolId: UUID!, $staffId: UUID, $status: LeaveRequestStatus, $from: Date, $to: Date, $updatedSince: Timestamp) @auth(level: NO_ACCESS) {
  leaveRequests(where: {schoolId: {eq: $schoolId}, staffId: {eq: $staffId}, status: {eq: $status}, startDate: {le: $to}, endDate: {ge: $from}, updatedAt: {ge: $updatedSince}}, orderBy: [{startDate: DESC}, {createdAt: DESC}], limit: 500) {
    id startDate endDate half halfDays reason status decisionNote decidedAt createdAt updatedAt
    staff { id employeeId firstName lastName userId } leaveType { id name paid } decidedBy { id displayName email }
  }
}

query GetLeaveRequest($schoolId: UUID!, $id: UUID!) @auth(level: NO_ACCESS) {
  leaveRequests(where: {schoolId: {eq: $schoolId}, id: {eq: $id}}, limit: 1) {
    id startDate endDate half halfDays reason status decisionNote decidedAt createdAt
    staff { id employeeId firstName lastName userId } leaveType { id name paid quotaHalfDays } decidedBy { id displayName email }
  }
}

# ---- Substitution (P3-7)
query ListSubstitutions($schoolId: UUID!, $from: Date!, $to: Date!, $substituteId: UUID) @auth(level: NO_ACCESS) {
  substitutions(where: {schoolId: {eq: $schoolId}, date: {ge: $from, le: $to}, substituteId: {eq: $substituteId}}, orderBy: [{date: ASC}], limit: 5000) {
    id date periodId timetableEntryId leaveRequestId substitute { id employeeId firstName lastName status }
    timetableEntry { id day classroom { id name } subject { id name code } staffId }
  }
}

# ---- Notifications (P3-9) and sync groundwork (P3-10)
query ListNotifications($schoolId: UUID!, $userId: String!, $role: SchoolRole!, $limit: Int!, $updatedSince: Timestamp) @auth(level: NO_ACCESS) {
  notifications(where: {_and: [{schoolId: {eq: $schoolId}}, {createdAt: {ge: $updatedSince}}, {_or: [{recipientStaff: {userId: {eq: $userId}}}, {recipientUser: {id: {eq: $userId}}}, {audienceRole: {eq: $role}}]}]}, orderBy: [{createdAt: DESC}], limit: $limit) {
    id kind params entityType entityId createdAt
    reads: notificationReads_on_notification(where: {userId: {eq: $userId}}) { readAt }
  }
}

query ListNotificationMutes($schoolId: UUID!, $userId: String!) @auth(level: NO_ACCESS) {
  notificationMutes(where: {schoolId: {eq: $schoolId}, userId: {eq: $userId}}, limit: 50) { category }
}

query ListTombstones($schoolId: UUID!, $since: Timestamp!, $entityType: String, $limit: Int!) @auth(level: NO_ACCESS) {
  tombstones(where: {schoolId: {eq: $schoolId}, deletedAt: {gt: $since}, entityType: {eq: $entityType}}, orderBy: [{deletedAt: ASC}, {id: ASC}], limit: $limit) { id entityType entityId classroomId staffId deletedAt }
}

query LeaveRequestByClientId($schoolId: UUID!, $staffId: UUID!, $clientId: String!) @auth(level: NO_ACCESS) {
  leaveRequests(where: {schoolId: {eq: $schoolId}, staffId: {eq: $staffId}, clientId: {eq: $clientId}}, limit: 1) { id }
}

query GetSubstitution($schoolId: UUID!, $id: UUID!) @auth(level: NO_ACCESS) {
  substitutions(where: {schoolId: {eq: $schoolId}, id: {eq: $id}}, limit: 1) {
    id date periodId substituteId
    timetableEntry { id classroomId day classroom { name } subject { name } staff { firstName lastName } }
  }
}

query GetTimetableEntry($schoolId: UUID!, $id: UUID!) @auth(level: NO_ACCESS) {
  timetableEntries(where: {schoolId: {eq: $schoolId}, id: {eq: $id}}, limit: 1) { id classroomId staffId }
}

# ---- Devices and push (P4-S2)
query ListUnpushedNotifications($schoolId: UUID!, $since: Timestamp!, $limit: Int!) @auth(level: NO_ACCESS) {
  notifications(where: {schoolId: {eq: $schoolId}, pushedAt: {isNull: true}, createdAt: {ge: $since}}, orderBy: [{createdAt: ASC}], limit: $limit) {
    id kind audienceRole recipientStaff { userId } recipientUser { id }
  }
}

# Only members of this school: a device of someone who has left is never sent this school's notices.
query ListDevicesForUsers($schoolId: UUID!, $userIds: [String!]!) @auth(level: NO_ACCESS) {
  deviceTokens(where: {userId: {in: $userIds}, user: {schoolMembers_on_user: {exist: {schoolId: {eq: $schoolId}, status: {eq: ACTIVE}}}}}, limit: 2000) {
    id token platform userId
  }
}

query ListDevicesOfUser($userId: String!) @auth(level: NO_ACCESS) {
  deviceTokens(where: {userId: {eq: $userId}}, limit: 100) { id platform lastSeenAt }
}

query GetSchoolGeofence($schoolId: UUID!) @auth(level: NO_ACCESS) {
  school(id: $schoolId) { geoLatMicro geoLngMicro geoRadiusM geoMarginM }
}

# ---- Announcements (P4-S4)
query ListAnnouncements($schoolId: UUID!, $updatedSince: Timestamp) @auth(level: NO_ACCESS) {
  announcements(where: {schoolId: {eq: $schoolId}, updatedAt: {ge: $updatedSince}}, orderBy: [{createdAt: DESC}], limit: 200) {
    id title body createdAt updatedAt withdrawnAt author { id displayName email }
  }
}

query GetAnnouncement($schoolId: UUID!, $id: UUID!) @auth(level: NO_ACCESS) {
  announcements(where: {schoolId: {eq: $schoolId}, id: {eq: $id}}, limit: 1) {
    id title body createdAt updatedAt withdrawnAt author { id displayName email }
  }
}

# ---- Transport (P5-4a)
query ListVehicles($schoolId: UUID!) @auth(level: NO_ACCESS) {
  vehicles(where: {schoolId: {eq: $schoolId}}, orderBy: [{label: ASC}]) { id registration label capacity status }
}

query ListTransportRoutes($schoolId: UUID!) @auth(level: NO_ACCESS) {
  transportRoutes(where: {schoolId: {eq: $schoolId}}, orderBy: [{name: ASC}]) {
    id name direction startTime
    vehicle { id registration label capacity status }
    driver { id employeeId firstName lastName userId }
    routeStops_on_route(orderBy: [{sequence: ASC}]) { id sequence name latMicro lngMicro arrivalTime }
  }
}

query GetTransportRoute($schoolId: UUID!, $id: UUID!) @auth(level: NO_ACCESS) {
  transportRoutes(where: {schoolId: {eq: $schoolId}, id: {eq: $id}}) {
    id name direction startTime
    vehicle { id registration label capacity status }
    driver { id employeeId firstName lastName userId }
    routeStops_on_route(orderBy: [{sequence: ASC}]) { id sequence name latMicro lngMicro arrivalTime }
  }
}

# ---- Student assignment and manifests (P5-4b)
query StudentRoutesOfRoute($schoolId: UUID!, $routeId: UUID!) @auth(level: NO_ACCESS) {
  studentRoutes(where: {schoolId: {eq: $schoolId}, routeId: {eq: $routeId}}, limit: 1000) {
    id stopId
    student { id firstName lastName enrollmentId status placements: studentEnrollments_on_student(orderBy: [{createdAt: DESC}], limit: 1) { classroom { name } } }
  }
}

query StudentRoutesOfStudents($schoolId: UUID!, $studentIds: [UUID!]!) @auth(level: NO_ACCESS) {
  studentRoutes(where: {schoolId: {eq: $schoolId}, studentId: {in: $studentIds}}, limit: 1000) {
    id studentId direction
    route { id name direction startTime vehicle { registration label } driver { firstName lastName } }
    stop { id name sequence arrivalTime }
  }
}

# Active members of staff who have a sign-in account: the candidates for a route's driver (the gateway keeps those whose role is DRIVER).
query StaffWithAccounts($schoolId: UUID!) @auth(level: NO_ACCESS) {
  staffProfiles(where: {schoolId: {eq: $schoolId}, status: {eq: ACTIVE}, userId: {isNull: false}}, orderBy: [{firstName: ASC}], limit: 1000) { id employeeId firstName lastName userId }
}

# ---- Student leave (P5-10)
query StudentLeaveByClientId($schoolId: UUID!, $studentId: UUID!, $clientId: String!) @auth(level: NO_ACCESS) {
  studentLeaves(where: {schoolId: {eq: $schoolId}, studentId: {eq: $studentId}, clientId: {eq: $clientId}}, limit: 1) { id }
}

query GetStudentLeave($schoolId: UUID!, $id: UUID!) @auth(level: NO_ACCESS) {
  studentLeaves(where: {schoolId: {eq: $schoolId}, id: {eq: $id}}, limit: 1) {
    id clientId startDate endDate half reason status decisionNote decidedAt createdAt updatedAt
    student { id firstName lastName enrollmentId placements: studentEnrollments_on_student(orderBy: [{createdAt: DESC}], limit: 1) { classroom { id name } } }
    requestedBy { id displayName email }
    decidedBy { id displayName email }
  }
}

query ListStudentLeaves($schoolId: UUID!, $status: StudentLeaveStatus, $limit: Int!) @auth(level: NO_ACCESS) {
  studentLeaves(where: {schoolId: {eq: $schoolId}, status: {eq: $status}}, orderBy: [{createdAt: DESC}], limit: $limit) {
    id startDate endDate half reason status decisionNote decidedAt createdAt updatedAt
    student { id firstName lastName enrollmentId placements: studentEnrollments_on_student(orderBy: [{createdAt: DESC}], limit: 1) { classroom { id name } } }
    requestedBy { id displayName email }
    decidedBy { id displayName email }
  }
}

query ListStudentLeavesOfStudents($schoolId: UUID!, $studentIds: [UUID!]!, $limit: Int!) @auth(level: NO_ACCESS) {
  studentLeaves(where: {schoolId: {eq: $schoolId}, studentId: {in: $studentIds}}, orderBy: [{createdAt: DESC}], limit: $limit) {
    id startDate endDate half reason status decisionNote decidedAt createdAt updatedAt
    student { id firstName lastName enrollmentId placements: studentEnrollments_on_student(orderBy: [{createdAt: DESC}], limit: 1) { classroom { id name } } }
    requestedBy { id displayName email }
    decidedBy { id displayName email }
  }
}

# Students of these ids whose approved leave covers a date: the class roster starts them as Leave until the day is taken.
query ApprovedStudentLeaveOn($schoolId: UUID!, $studentIds: [UUID!]!, $date: Date!) @auth(level: NO_ACCESS) {
  studentLeaves(where: {schoolId: {eq: $schoolId}, studentId: {in: $studentIds}, status: {eq: APPROVED}, startDate: {le: $date}, endDate: {ge: $date}}, limit: 2000) { studentId half }
}


# Learning resources still shown (not removed) in one academic year: all of the school's, or those of some classes.
query ListLearningResources($schoolId: UUID!, $academicYearId: UUID!, $limit: Int!) @auth(level: NO_ACCESS) {
  learningResources(where: {schoolId: {eq: $schoolId}, academicYearId: {eq: $academicYearId}, removedAt: {isNull: true}}, orderBy: [{createdAt: DESC}], limit: $limit) {
    id title note fileKey fileName contentType sizeBytes createdAt updatedAt classroom { id name } subject { id name } uploadedBy { id displayName email }
  }
}

query ListLearningResourcesOfClasses($schoolId: UUID!, $academicYearId: UUID!, $classIds: [UUID!]!, $limit: Int!) @auth(level: NO_ACCESS) {
  learningResources(where: {schoolId: {eq: $schoolId}, academicYearId: {eq: $academicYearId}, classroomId: {in: $classIds}, removedAt: {isNull: true}}, orderBy: [{createdAt: DESC}], limit: $limit) {
    id title note fileKey fileName contentType sizeBytes createdAt updatedAt classroom { id name } subject { id name } uploadedBy { id displayName email }
  }
}

query GetLearningResource($schoolId: UUID!, $id: UUID!) @auth(level: NO_ACCESS) {
  learningResources(where: {id: {eq: $id}, schoolId: {eq: $schoolId}, removedAt: {isNull: true}}, limit: 1) {
    id title note fileKey fileName contentType sizeBytes createdAt updatedAt classroom { id name } subject { id name } uploadedBy { id displayName email }
  }
}

# Every comment under a resource, oldest first (deleted ones included: the gateway leaves them out and uses the rest to know who has already commented).
query ListResourceComments($schoolId: UUID!, $resourceId: UUID!, $limit: Int!) @auth(level: NO_ACCESS) {
  resourceComments(where: {schoolId: {eq: $schoolId}, resourceId: {eq: $resourceId}}, orderBy: [{createdAt: ASC}], limit: $limit) {
    id resourceId clientId authorRole authorName body originalBody editedAt deletedAt hiddenAt createdAt updatedAt author { id } hiddenBy { id } replyTo { id }
  }
}

query GetResourceComment($schoolId: UUID!, $id: UUID!) @auth(level: NO_ACCESS) {
  resourceComments(where: {id: {eq: $id}, schoolId: {eq: $schoolId}}, limit: 1) {
    id resourceId clientId authorRole authorName body originalBody editedAt deletedAt hiddenAt createdAt updatedAt author { id } hiddenBy { id } replyTo { id }
  }
}

query ResourceCommentByClientId($schoolId: UUID!, $resourceId: UUID!, $authorId: String!, $clientId: String!) @auth(level: NO_ACCESS) {
  resourceComments(where: {schoolId: {eq: $schoolId}, resourceId: {eq: $resourceId}, authorId: {eq: $authorId}, clientId: {eq: $clientId}}, limit: 1) {
    id resourceId clientId authorRole authorName body originalBody editedAt deletedAt hiddenAt createdAt updatedAt author { id } hiddenBy { id } replyTo { id }
  }
}
