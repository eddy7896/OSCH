# HR: Get all Staff (SchoolMembers) for a School
query ListStaff($schoolId: UUID!) @auth(level: NO_ACCESS) {
  schoolMembers(where: {schoolId: {eq: $schoolId}}) {
    schoolRole
    user {
      id
      email
      phoneNumber
      globalRole
    }
  }
}

# ---- Phase 1: identity, tenancy, platform and audit reads. Gateway-only (NO_ACCESS). ----

# Identity sync / profile. $id is the Firebase UID from the VERIFIED token. Users are global, so this has no school.
query GetUser($id: String!) @auth(level: NO_ACCESS) {
  user(key: {id: $id}) { id email phoneNumber displayName language globalRole }
}

# The membership the TenantGuard checks on every request: ACTIVE, role, and the school's subscription status.
query GetMembership($schoolId: UUID!, $userId: String!) @auth(level: NO_ACCESS) {
  schoolMembers(where: {schoolId: {eq: $schoolId}, userId: {eq: $userId}}) {
    schoolRole
    status
    school { id name subscriptionStatus defaultLanguage }
  }
}

# All schools a user belongs to (for /me and the school picker). Keyed by the user, not by a school.
query ListMembershipsForUser($userId: String!) @auth(level: NO_ACCESS) {
  schoolMembers(where: {userId: {eq: $userId}}) {
    schoolRole
    status
    school { id name subDomain subscriptionStatus defaultLanguage }
  }
}

query GetSchool($schoolId: UUID!) @auth(level: NO_ACCESS) {
  school(id: $schoolId) { id name subDomain subscriptionStatus currency locale defaultLanguage createdAt administrators: schoolMembers_on_school(where: {schoolRole: {eq: SYSTEM_ADMIN}, status: {eq: ACTIVE}}) { userId } }
}

# Public school lookup for the web apps (minimal fields only; the gateway rate-limits it).
query GetSchoolBySubDomain($subDomain: String!) @auth(level: NO_ACCESS) {
  schools(where: {subDomain: {eq: $subDomain}}, limit: 1) { id name subDomain subscriptionStatus defaultLanguage }
}

# Platform (SUPER_ADMIN) only: every school.
query ListSchools($limit: Int!, $offset: Int!) @auth(level: NO_ACCESS) {
  schools(orderBy: [{createdAt: DESC}], limit: $limit, offset: $offset) { id name subDomain subscriptionStatus defaultLanguage createdAt administrators: schoolMembers_on_school(where: {schoolRole: {eq: SYSTEM_ADMIN}, status: {eq: ACTIVE}}) { userId } }
}

query ListMemberships($schoolId: UUID!) @auth(level: NO_ACCESS) {
  schoolMembers(where: {schoolId: {eq: $schoolId}}, orderBy: [{createdAt: ASC}]) {
    schoolRole
    status
    createdAt
    user { id email displayName phoneNumber }
  }
}

query ListInvitations($schoolId: UUID!) @auth(level: NO_ACCESS) {
  invitations(where: {schoolId: {eq: $schoolId}}, orderBy: [{createdAt: DESC}]) {
    id email phoneNumber schoolRole status expiresAt createdAt acceptedAt
    createdBy { id displayName }
  }
}

# Accept flow: the invitee does not know the school id, only the secret token. Lookup is by hash.
query GetInvitationByTokenHash($tokenHash: String!) @auth(level: NO_ACCESS) {
  invitations(where: {tokenHash: {eq: $tokenHash}}, limit: 1) {
    id schoolRole status expiresAt email school { id name subscriptionStatus }
  }
}

query ListAuditLog($schoolId: UUID!, $limit: Int!, $offset: Int!) @auth(level: NO_ACCESS) {
  auditLogs(where: {schoolId: {eq: $schoolId}}, orderBy: [{createdAt: DESC}], limit: $limit, offset: $offset) {
    id action entityType entityId details createdAt
    actor { id email displayName }
  }
}

# School setup (P2-1). Every read is scoped by $schoolId.
query GetSchoolProfile($schoolId: UUID!) @auth(level: NO_ACCESS) {
  school(id: $schoolId) { id name subDomain defaultLanguage currency locale address contactPhone contactEmail primaryColor logoKey activeAcademicYear { id name endDate } }
}

query ListGradeLevels($schoolId: UUID!) @auth(level: NO_ACCESS) {
  gradeLevels(where: {schoolId: {eq: $schoolId}}, orderBy: [{position: ASC}, {name: ASC}]) {
    id name position
    classrooms: classrooms_on_gradeLevel(orderBy: [{section: ASC}]) { id section name capacity }
  }
}

query ListClassrooms($schoolId: UUID!) @auth(level: NO_ACCESS) {
  classrooms(where: {schoolId: {eq: $schoolId}}, orderBy: [{name: ASC}]) { id name section capacity gradeLevel { id name position } }
}

query ListSubjects($schoolId: UUID!) @auth(level: NO_ACCESS) {
  subjects(where: {schoolId: {eq: $schoolId}}, orderBy: [{name: ASC}]) { id name code }
}

query ListAcademicYears($schoolId: UUID!) @auth(level: NO_ACCESS) {
  academicYears(where: {schoolId: {eq: $schoolId}}, orderBy: [{startDate: DESC}]) { id name startDate endDate status receiptSeq }
}

# ---- Students (P2-2). `search` is a LIKE pattern the gateway builds (%text%) matched against name or enrolment id; a null filter is skipped.
query SchoolSeq($schoolId: UUID!) @auth(level: NO_ACCESS) {
  school(id: $schoolId) { id studentSeq enrollmentPrefix }
}

query ListStudents($schoolId: UUID!, $search: String, $status: StudentStatus, $limit: Int!, $offset: Int!) @auth(level: NO_ACCESS) {
  students(
    where: {_and: [{schoolId: {eq: $schoolId}}, {status: {eq: $status}}, {_or: [{firstName: {pattern: {like: $search, ignoreCase: true}}}, {lastName: {pattern: {like: $search, ignoreCase: true}}}, {enrollmentId: {pattern: {like: $search, ignoreCase: true}}}]}]}
    orderBy: [{lastName: ASC}, {firstName: ASC}, {serial: ASC}], limit: $limit, offset: $offset
  ) {
    id firstName lastName enrollmentId serial status gender dateOfBirth
    placements: studentEnrollments_on_student(orderBy: [{createdAt: DESC}], limit: 1) { academicYear { id name } classroom { id name } }
  }
}

query CountStudents($schoolId: UUID!, $search: String, $status: StudentStatus) @auth(level: NO_ACCESS) {
  students(where: {_and: [{schoolId: {eq: $schoolId}}, {status: {eq: $status}}, {_or: [{firstName: {pattern: {like: $search, ignoreCase: true}}}, {lastName: {pattern: {like: $search, ignoreCase: true}}}, {enrollmentId: {pattern: {like: $search, ignoreCase: true}}}]}]}) { _count }
}

query GetStudent($schoolId: UUID!, $id: UUID!) @auth(level: NO_ACCESS) {
  students(where: {schoolId: {eq: $schoolId}, id: {eq: $id}}, limit: 1) {
    id firstName lastName enrollmentId serial status gender dateOfBirth admissionDate address photoKey createdAt
    placements: studentEnrollments_on_student(orderBy: [{createdAt: DESC}]) { academicYear { id name } classroom { id name } }
    guardians: guardians_on_student(orderBy: [{isPrimary: DESC}, {createdAt: ASC}]) { id name relationship phone email isPrimary }
    documents: studentDocuments_on_student(orderBy: [{createdAt: DESC}]) { id kind fileKey fileName contentType sizeBytes createdAt }
  }
}

# ---- Staff (P2-4). `search` is a LIKE pattern the gateway builds; a null filter is skipped.
query StaffSeqInfo($schoolId: UUID!) @auth(level: NO_ACCESS) {
  school(id: $schoolId) { id staffSeq }
}

query ListStaffProfiles($schoolId: UUID!, $search: String, $status: StaffStatus, $department: String, $limit: Int!, $offset: Int!) @auth(level: NO_ACCESS) {
  staffProfiles(where: {_and: [{schoolId: {eq: $schoolId}}, {status: {eq: $status}}, {department: {eq: $department}}, {_or: [{firstName: {pattern: {like: $search, ignoreCase: true}}}, {lastName: {pattern: {like: $search, ignoreCase: true}}}, {employeeId: {pattern: {like: $search, ignoreCase: true}}}]}]}, orderBy: [{lastName: ASC}, {firstName: ASC}, {serial: ASC}], limit: $limit, offset: $offset) {
    id employeeId firstName lastName department designation status userId
  }
}

query CountStaffProfiles($schoolId: UUID!, $search: String, $status: StaffStatus, $department: String) @auth(level: NO_ACCESS) {
  staffProfiles(where: {_and: [{schoolId: {eq: $schoolId}}, {status: {eq: $status}}, {department: {eq: $department}}, {_or: [{firstName: {pattern: {like: $search, ignoreCase: true}}}, {lastName: {pattern: {like: $search, ignoreCase: true}}}, {employeeId: {pattern: {like: $search, ignoreCase: true}}}]}]}) { _count }
}

query GetStaffProfile($schoolId: UUID!, $id: UUID!) @auth(level: NO_ACCESS) {
  staffProfiles(where: {schoolId: {eq: $schoolId}, id: {eq: $id}}, limit: 1) {
    id employeeId firstName lastName department designation phone email dateOfBirth gender dateOfJoining address emergencyContactName emergencyContactPhone status photoKey createdAt userId
    documents: staffDocuments_on_staff(orderBy: [{createdAt: DESC}]) { id kind fileKey fileName contentType sizeBytes createdAt }
  }
}

query ListStaffDepartments($schoolId: UUID!) @auth(level: NO_ACCESS) {
  staffProfiles(where: {schoolId: {eq: $schoolId}, department: {isNull: false}}, orderBy: [{department: ASC}]) { department }
}

# ---- Admissions (P2-3). `search` is a LIKE pattern the gateway builds; a null filter is skipped.
query ApplicationSeqInfo($schoolId: UUID!) @auth(level: NO_ACCESS) {
  school(id: $schoolId) { id applicationSeq studentSeq enrollmentPrefix }
}

query ListApplications($schoolId: UUID!, $search: String, $status: ApplicationStatus, $academicYearId: UUID, $limit: Int!, $offset: Int!) @auth(level: NO_ACCESS) {
  applications(where: {_and: [{schoolId: {eq: $schoolId}}, {status: {eq: $status}}, {academicYearId: {eq: $academicYearId}}, {_or: [{firstName: {pattern: {like: $search, ignoreCase: true}}}, {lastName: {pattern: {like: $search, ignoreCase: true}}}, {applicationNo: {pattern: {like: $search, ignoreCase: true}}}, {guardianName: {pattern: {like: $search, ignoreCase: true}}}]}]}, orderBy: [{createdAt: DESC}, {serial: DESC}], limit: $limit, offset: $offset) {
    id applicationNo status firstName lastName guardianName createdAt
    gradeLevel { id name }
    academicYear { id name }
  }
}

query CountApplications($schoolId: UUID!, $search: String, $status: ApplicationStatus, $academicYearId: UUID) @auth(level: NO_ACCESS) {
  applications(where: {_and: [{schoolId: {eq: $schoolId}}, {status: {eq: $status}}, {academicYearId: {eq: $academicYearId}}, {_or: [{firstName: {pattern: {like: $search, ignoreCase: true}}}, {lastName: {pattern: {like: $search, ignoreCase: true}}}, {applicationNo: {pattern: {like: $search, ignoreCase: true}}}, {guardianName: {pattern: {like: $search, ignoreCase: true}}}]}]}) { _count }
}

query GetApplication($schoolId: UUID!, $id: UUID!) @auth(level: NO_ACCESS) {
  applications(where: {schoolId: {eq: $schoolId}, id: {eq: $id}}, limit: 1) {
    id applicationNo status firstName lastName dateOfBirth gender address guardianName guardianRelationship guardianPhone guardianEmail previousSchool notes decisionNote createdAt studentId
    gradeLevel { id name }
    academicYear { id name }
  }
}

# ---- Fees (P2-7a). A null filter is skipped.
query ListFeeStructures($schoolId: UUID!, $academicYearId: UUID, $gradeLevelId: UUID) @auth(level: NO_ACCESS) {
  feeStructures(where: {schoolId: {eq: $schoolId}, academicYearId: {eq: $academicYearId}, gradeLevelId: {eq: $gradeLevelId}}, orderBy: [{createdAt: ASC}]) {
    id name createdAt
    academicYear { id name }
    gradeLevel { id name position }
    items: feeItems_on_structure(orderBy: [{createdAt: ASC}]) {
      id name
      instalments: feeInstalments_on_item(orderBy: [{sequence: ASC}]) { id sequence label amountMinor dueDate }
    }
  }
}

query GetFeeStructure($schoolId: UUID!, $id: UUID!) @auth(level: NO_ACCESS) {
  feeStructures(where: {schoolId: {eq: $schoolId}, id: {eq: $id}}, limit: 1) {
    id name createdAt
    academicYear { id name }
    gradeLevel { id name position }
    items: feeItems_on_structure(orderBy: [{createdAt: ASC}]) {
      id name
      instalments: feeInstalments_on_item(orderBy: [{sequence: ASC}]) { id sequence label amountMinor dueDate }
    }
  }
}

# Finds a fee item or an instalment (with the structure it belongs to) inside this school.
query GetFeeItem($schoolId: UUID!, $id: UUID!) @auth(level: NO_ACCESS) {
  feeItems(where: {schoolId: {eq: $schoolId}, id: {eq: $id}}, limit: 1) { id name structure { id } instalments: feeInstalments_on_item(orderBy: [{sequence: ASC}]) { id sequence } }
}
query GetFeeInstalment($schoolId: UUID!, $id: UUID!) @auth(level: NO_ACCESS) {
  feeInstalments(where: {schoolId: {eq: $schoolId}, id: {eq: $id}}, limit: 1) { id sequence label amountMinor dueDate item { id name structure { id } } }
}

query ListConcessions($schoolId: UUID!, $studentId: UUID, $academicYearId: UUID) @auth(level: NO_ACCESS) {
  concessions(where: {schoolId: {eq: $schoolId}, studentId: {eq: $studentId}, academicYearId: {eq: $academicYearId}}, orderBy: [{createdAt: ASC}]) {
    id name kind basisPoints amountMinor createdAt
    student { id enrollmentId firstName lastName }
    academicYear { id name }
    targetItem { id name }
  }
}

# The class level a student is placed in, for one academic year (what decides which fee structure applies).
query GetStudentLevel($schoolId: UUID!, $studentId: UUID!, $academicYearId: UUID!) @auth(level: NO_ACCESS) {
  studentEnrollments(where: {schoolId: {eq: $schoolId}, studentId: {eq: $studentId}, academicYearId: {eq: $academicYearId}}, limit: 1) {
    classroom { id name gradeLevel { id name } }
  }
}

# ---- Bulk import (P2-5)
query FindImportBatch($schoolId: UUID!, $kind: String!, $fileHash: String!) @auth(level: NO_ACCESS) {
  importBatches(where: {schoolId: {eq: $schoolId}, kind: {eq: $kind}, fileHash: {eq: $fileHash}}, limit: 1) { id status rowCount createdCount failedCount createdAt }
}

query StudentsByEnrollmentIds($schoolId: UUID!, $ids: [String!]!) @auth(level: NO_ACCESS) {
  students(where: {schoolId: {eq: $schoolId}, enrollmentId: {in: $ids}}, limit: 1000) { id enrollmentId firstName lastName }
}

# First name, last name and birth date of every student, for "may already exist" warnings.
query StudentIdentities($schoolId: UUID!, $limit: Int!, $offset: Int!) @auth(level: NO_ACCESS) {
  students(where: {schoolId: {eq: $schoolId}}, orderBy: [{serial: ASC}], limit: $limit, offset: $offset) { firstName lastName dateOfBirth }
}

query StaffIdentities($schoolId: UUID!, $limit: Int!, $offset: Int!) @auth(level: NO_ACCESS) {
  staffProfiles(where: {schoolId: {eq: $schoolId}}, orderBy: [{serial: ASC}], limit: $limit, offset: $offset) { firstName lastName dateOfBirth }
}

# ---- Invoices and payments (P2-7b). A null filter is skipped.
query ListInvoices($schoolId: UUID!, $studentId: UUID, $academicYearId: UUID, $status: InvoiceStatus, $dueOnOrBefore: Date, $dueOnOrAfter: Date, $limit: Int!, $offset: Int!) @auth(level: NO_ACCESS) {
  invoices(where: {_and: [{schoolId: {eq: $schoolId}}, {studentId: {eq: $studentId}}, {academicYearId: {eq: $academicYearId}}, {status: {eq: $status}}, {dueDate: {le: $dueOnOrBefore}}, {dueDate: {ge: $dueOnOrAfter}}]}, orderBy: [{dueDate: ASC}, {createdAt: ASC}], limit: $limit, offset: $offset) {
    id title amountMinor paidMinor grossMinor discountMinor dueDate status createdAt student { id enrollmentId firstName lastName } academicYear { id name }
  }
}

query CountInvoices($schoolId: UUID!, $studentId: UUID, $academicYearId: UUID, $status: InvoiceStatus, $dueOnOrBefore: Date, $dueOnOrAfter: Date) @auth(level: NO_ACCESS) {
  invoices(where: {_and: [{schoolId: {eq: $schoolId}}, {studentId: {eq: $studentId}}, {academicYearId: {eq: $academicYearId}}, {status: {eq: $status}}, {dueDate: {le: $dueOnOrBefore}}, {dueDate: {ge: $dueOnOrAfter}}]}) { _count amountMinor_sum paidMinor_sum }
}

query GetInvoice($schoolId: UUID!, $id: UUID!) @auth(level: NO_ACCESS) {
  invoices(where: {schoolId: {eq: $schoolId}, id: {eq: $id}}, limit: 1) {
    id title amountMinor paidMinor grossMinor discountMinor dueDate status createdAt student { id enrollmentId firstName lastName } academicYear { id name }
    instalmentId
    payments: payments_on_invoice(orderBy: [{createdAt: ASC}]) { id amountMinor method reference paidOn reversedAt reversalReason createdAt recordedBy { id displayName email } receipt: receipt_on_payment { id number cancelledAt } }
  }
}

# Every instalment invoice of a year, to tell what an invoice run has already made. Paged.
query InvoicedForYear($schoolId: UUID!, $academicYearId: UUID!, $limit: Int!, $offset: Int!) @auth(level: NO_ACCESS) {
  invoices(where: {schoolId: {eq: $schoolId}, academicYearId: {eq: $academicYearId}, instalmentId: {isNull: false}}, orderBy: [{createdAt: ASC}], limit: $limit, offset: $offset) { studentId instalmentId }
}

# How many invoices stand on these fee instalments (a fee that has been billed cannot be deleted).
query CountInvoicesForInstalments($schoolId: UUID!, $ids: [UUID!]!) @auth(level: NO_ACCESS) {
  invoices(where: {schoolId: {eq: $schoolId}, instalmentId: {in: $ids}}) { _count }
}

query GetPayment($schoolId: UUID!, $id: UUID!) @auth(level: NO_ACCESS) {
  payments(where: {schoolId: {eq: $schoolId}, id: {eq: $id}}, limit: 1) { id amountMinor reversedAt invoice { id amountMinor paidMinor status } }
}

# Totals of what is still unpaid and due in a date window; the gateway runs one per ageing band. Exact Int64 sums, computed in the database.
query UnpaidTotals($schoolId: UUID!, $dueOnOrBefore: Date, $dueOnOrAfter: Date) @auth(level: NO_ACCESS) {
  invoices(where: {_and: [{schoolId: {eq: $schoolId}}, {status: {eq: PENDING}}, {dueDate: {le: $dueOnOrBefore}}, {dueDate: {ge: $dueOnOrAfter}}]}) { _count amountMinor_sum paidMinor_sum }
}

# The students placed in a class level (or one class) for a year: who an invoice run is for.
query PlacedStudents($schoolId: UUID!, $academicYearId: UUID!, $gradeLevelId: UUID, $classroomId: UUID, $limit: Int!, $offset: Int!) @auth(level: NO_ACCESS) {
  studentEnrollments(where: {_and: [{schoolId: {eq: $schoolId}}, {academicYearId: {eq: $academicYearId}}, {classroomId: {eq: $classroomId}}, {classroom: {gradeLevelId: {eq: $gradeLevelId}}}, {student: {status: {eq: ACTIVE}}}]}, orderBy: [{createdAt: ASC}], limit: $limit, offset: $offset) {
    studentId
    classroom { id gradeLevelId }
  }
}

# ---- Receipts (P2-7c)
query ListReceipts($schoolId: UUID!, $studentId: UUID, $academicYearId: UUID, $limit: Int!, $offset: Int!) @auth(level: NO_ACCESS) {
  receipts(where: {schoolId: {eq: $schoolId}, studentId: {eq: $studentId}, academicYearId: {eq: $academicYearId}}, orderBy: [{createdAt: DESC}, {serial: DESC}], limit: $limit, offset: $offset) {
    id number serial amountMinor balanceAfterMinor cancelledAt cancelReason createdAt academicYear { id name } student { id enrollmentId firstName lastName } invoice { id title } payment { id method reference paidOn recordedBy { id displayName email } }
  }
}

query CountReceipts($schoolId: UUID!, $studentId: UUID, $academicYearId: UUID) @auth(level: NO_ACCESS) {
  receipts(where: {schoolId: {eq: $schoolId}, studentId: {eq: $studentId}, academicYearId: {eq: $academicYearId}}) { _count amountMinor_sum }
}

query GetReceipt($schoolId: UUID!, $id: UUID!) @auth(level: NO_ACCESS) {
  receipts(where: {schoolId: {eq: $schoolId}, id: {eq: $id}}, limit: 1) {
    id number serial amountMinor balanceAfterMinor cancelledAt cancelReason createdAt academicYear { id name } student { id enrollmentId firstName lastName } invoice { id title } payment { id method reference paidOn recordedBy { id displayName email } }
  }
}

query GetReceiptByPayment($schoolId: UUID!, $paymentId: UUID!) @auth(level: NO_ACCESS) {
  receipts(where: {schoolId: {eq: $schoolId}, paymentId: {eq: $paymentId}}, limit: 1) {
    id number serial amountMinor balanceAfterMinor cancelledAt cancelReason createdAt academicYear { id name } student { id enrollmentId firstName lastName } invoice { id title } payment { id method reference paidOn recordedBy { id displayName email } }
  }
}

# ---- Payroll (P2-8)
query ListSalaryLines($schoolId: UUID!, $staffId: UUID!) @auth(level: NO_ACCESS) {
  salaryLines(where: {schoolId: {eq: $schoolId}, staffId: {eq: $staffId}}, orderBy: [{kind: ASC}, {createdAt: ASC}]) { id kind name amountMinor }
}

# Everyone who could be on a payroll run: active staff with their salary lines.
query StaffForPayroll($schoolId: UUID!, $limit: Int!, $offset: Int!) @auth(level: NO_ACCESS) {
  staffProfiles(where: {schoolId: {eq: $schoolId}, status: {eq: ACTIVE}}, orderBy: [{serial: ASC}], limit: $limit, offset: $offset) {
    id employeeId firstName lastName
    lines: salaryLines_on_staff(orderBy: [{kind: ASC}, {createdAt: ASC}]) { kind name amountMinor }
  }
}

query ListPayrollRuns($schoolId: UUID!, $limit: Int!, $offset: Int!) @auth(level: NO_ACCESS) {
  payrollRuns(where: {schoolId: {eq: $schoolId}}, orderBy: [{year: DESC}, {month: DESC}], limit: $limit, offset: $offset) { id year month status createdAt approvedAt paidAt paidOn paymentReference preparedBy { id displayName email } approvedBy { id displayName email } paidBy { id displayName email } }
}

query FindPayrollRun($schoolId: UUID!, $year: Int!, $month: Int!) @auth(level: NO_ACCESS) {
  payrollRuns(where: {schoolId: {eq: $schoolId}, year: {eq: $year}, month: {eq: $month}}, limit: 1) { id status }
}

query GetPayrollRun($schoolId: UUID!, $id: UUID!) @auth(level: NO_ACCESS) {
  payrollRuns(where: {schoolId: {eq: $schoolId}, id: {eq: $id}}, limit: 1) {
    id year month status createdAt approvedAt paidAt paidOn paymentReference preparedBy { id displayName email } approvedBy { id displayName email } paidBy { id displayName email }
    payslips: payslips_on_run(orderBy: [{createdAt: ASC}], limit: 1000) {
      id
      staff { id employeeId firstName lastName department designation }
      lines: payslipLines_on_payslip(orderBy: [{kind: ASC}, {createdAt: ASC}]) { id kind name amountMinor manual }
    }
  }
}

query GetPayslip($schoolId: UUID!, $id: UUID!) @auth(level: NO_ACCESS) {
  payslips(where: {schoolId: {eq: $schoolId}, id: {eq: $id}}, limit: 1) {
    id
    run { id year month status createdAt approvedAt paidAt paidOn paymentReference preparedBy { id displayName email } approvedBy { id displayName email } paidBy { id displayName email } }
    staff { id employeeId firstName lastName department designation }
    lines: payslipLines_on_payslip(orderBy: [{kind: ASC}, {createdAt: ASC}]) { id kind name amountMinor manual }
  }
}

# Exact sums for one run and one kind of line, in the database.
query PayrollRunSum($schoolId: UUID!, $runId: UUID!, $kind: SalaryLineKind!) @auth(level: NO_ACCESS) {
  payslipLines(where: {schoolId: {eq: $schoolId}, runId: {eq: $runId}, kind: {eq: $kind}}) { _count amountMinor_sum }
}

query PayslipLine($schoolId: UUID!, $id: UUID!) @auth(level: NO_ACCESS) {
  payslipLines(where: {schoolId: {eq: $schoolId}, id: {eq: $id}}, limit: 1) { id kind name amountMinor manual run { id status } payslip { id } }
}

query SalaryLineById($schoolId: UUID!, $id: UUID!) @auth(level: NO_ACCESS) {
  salaryLines(where: {schoolId: {eq: $schoolId}, id: {eq: $id}}, limit: 1) { id kind name amountMinor staff { id } }
}

# ---- Reports (P2-9). Read-only; the gateway pages through them and totals in bigint, because Data Connect has no group-by.
# Every payment taken in a date window (reversed ones too: the day book shows both), oldest first.
query PaymentsInRange($schoolId: UUID!, $from: Date!, $to: Date!, $limit: Int!, $offset: Int!) @auth(level: NO_ACCESS) {
  payments(where: {_and: [{schoolId: {eq: $schoolId}}, {paidOn: {ge: $from}}, {paidOn: {le: $to}}]}, orderBy: [{paidOn: ASC}, {createdAt: ASC}], limit: $limit, offset: $offset) {
    id amountMinor method reference paidOn reversedAt reversalReason createdAt
    student { id enrollmentId firstName lastName }
    invoice { id title }
    recordedBy { id displayName email }
    receipt: receipt_on_payment { number }
  }
}

query CountPaymentsInRange($schoolId: UUID!, $from: Date!, $to: Date!) @auth(level: NO_ACCESS) {
  payments(where: {_and: [{schoolId: {eq: $schoolId}}, {paidOn: {ge: $from}}, {paidOn: {le: $to}}]}) { _count }
}

# Unpaid invoices due on or before a date, oldest due date first.
query DuesInvoices($schoolId: UUID!, $dueOnOrBefore: Date!, $academicYearId: UUID, $limit: Int!, $offset: Int!) @auth(level: NO_ACCESS) {
  invoices(where: {_and: [{schoolId: {eq: $schoolId}}, {status: {eq: PENDING}}, {dueDate: {le: $dueOnOrBefore}}, {academicYearId: {eq: $academicYearId}}]}, orderBy: [{dueDate: ASC}, {createdAt: ASC}], limit: $limit, offset: $offset) {
    id title amountMinor paidMinor dueDate student { id enrollmentId firstName lastName }
  }
}

query CountDuesInvoices($schoolId: UUID!, $dueOnOrBefore: Date!, $academicYearId: UUID) @auth(level: NO_ACCESS) {
  invoices(where: {_and: [{schoolId: {eq: $schoolId}}, {status: {eq: PENDING}}, {dueDate: {le: $dueOnOrBefore}}, {academicYearId: {eq: $academicYearId}}]}) { _count }
}

