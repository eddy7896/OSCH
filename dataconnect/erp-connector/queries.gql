}

query EnrollmentsOfStudents($schoolId: UUID!, $academicYearId: UUID!, $studentIds: [UUID!]!) @auth(level: NO_ACCESS) {
  studentEnrollments(where: {schoolId: {eq: $schoolId}, academicYearId: {eq: $academicYearId}, studentId: {in: $studentIds}}, limit: 1000) { studentId classroom { id name } }
}

# ---- Timetable (P3-3)
query ListTimetableForYear($schoolId: UUID!, $academicYearId: UUID!) @auth(level: NO_ACCESS) {
  timetableEntries(where: {schoolId: {eq: $schoolId}, academicYearId: {eq: $academicYearId}}, limit: 10000) { id day periodId classroomId staffId subjectId staff { id employeeId firstName lastName status } classroom { id name } subject { id name code } }
}

query ListTimetableForClass($schoolId: UUID!, $academicYearId: UUID!, $classroomId: UUID!) @auth(level: NO_ACCESS) {
  timetableEntries(where: {schoolId: {eq: $schoolId}, academicYearId: {eq: $academicYearId}, classroomId: {eq: $classroomId}}, limit: 1000) {
    id day periodId subject { id name code } staff { id employeeId firstName lastName }
  }
}

query ListTimetableForStaff($schoolId: UUID!, $academicYearId: UUID!, $staffId: UUID!, $updatedSince: Timestamp) @auth(level: NO_ACCESS) {
  timetableEntries(where: {schoolId: {eq: $schoolId}, academicYearId: {eq: $academicYearId}, staffId: {eq: $staffId}, updatedAt: {ge: $updatedSince}}, limit: 1000) {
    id day periodId updatedAt classroom { id name } subject { id name code }
  }
}

query CountTimetableForPeriod($schoolId: UUID!, $periodId: UUID!) @auth(level: NO_ACCESS) {
  timetableEntries(where: {schoolId: {eq: $schoolId}, periodId: {eq: $periodId}}) { _count }
