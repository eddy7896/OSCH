# Get all Invoices for a School (Requires joining through Student)
query ListInvoices($schoolId: UUID!) @auth(level: NO_ACCESS) {
  invoices(where: {schoolId: {eq: $schoolId}}, orderBy: [{dueDate: ASC}]) {
    id
    amountMinor
    dueDate
    status
    student {
      firstName
      lastName
      enrollmentId
    }
  }
}

# HR: Get all Staff (SchoolMembers) for a School
query ListStaff($schoolId: UUID!) @auth(level: NO_ACCESS) {
  schoolMembers(where: {schoolId: {eq: $schoolId}}) {
    schoolRole
    user {
      id
      email
      phoneNumber
      globalRole
    }
  }
}

# Finance: Get Payroll for a School
query ListPayroll($schoolId: UUID!) @auth(level: NO_ACCESS) {
  payrolls(where: {schoolId: {eq: $schoolId}}, orderBy: [{payDate: DESC}]) {
    id
    amountMinor
    payDate
    status
    user {
      id
      email
    }
  }
}

# Academic: Get Class Schedules
query ListSchedules($schoolId: UUID!) @auth(level: NO_ACCESS) {
  classSchedules(where: {schoolId: {eq: $schoolId}}) {
    id
    dayOfWeek
    startTime
    endTime
    classroom { name }
    subject { name }
    teacher { email }
  }
}

# Academic: Get Leave Requests
query ListLeaveRequests($schoolId: UUID!) @auth(level: NO_ACCESS) {
  leaveRequests(where: {schoolId: {eq: $schoolId}}) {
    id
    startDate
    endDate
    reason
    status
    user { email }
    substitute { email }
  }
}

# Academic: Get Exams
query ListExams($schoolId: UUID!) @auth(level: NO_ACCESS) {
  exams(where: {schoolId: {eq: $schoolId}}) {
    id
    title
    examDate
    maxScore
    classroom { name }
    subject { name }
  }
}

# ---- Phase 1: identity, tenancy, platform and audit reads. Gateway-only (NO_ACCESS). ----

# Identity sync / profile. $id is the Firebase UID from the VERIFIED token. Users are global, so this has no school.
query GetUser($id: String!) @auth(level: NO_ACCESS) {
  user(key: {id: $id}) { id email phoneNumber displayName language globalRole }
}

# The membership the TenantGuard checks on every request: ACTIVE, role, and the school's subscription status.
query GetMembership($schoolId: UUID!, $userId: String!) @auth(level: NO_ACCESS) {
  schoolMembers(where: {schoolId: {eq: $schoolId}, userId: {eq: $userId}}) {
    schoolRole
    status
    school { id name subscriptionStatus defaultLanguage }
  }
}

# All schools a user belongs to (for /me and the school picker). Keyed by the user, not by a school.
query ListMembershipsForUser($userId: String!) @auth(level: NO_ACCESS) {
  schoolMembers(where: {userId: {eq: $userId}}) {
    schoolRole
    status
    school { id name subDomain subscriptionStatus defaultLanguage }
  }
}

query GetSchool($schoolId: UUID!) @auth(level: NO_ACCESS) {
  school(id: $schoolId) { id name subDomain subscriptionStatus currency locale defaultLanguage createdAt administrators: schoolMembers_on_school(where: {schoolRole: {eq: SYSTEM_ADMIN}, status: {eq: ACTIVE}}) { userId } }
}

# Public school lookup for the web apps (minimal fields only; the gateway rate-limits it).
query GetSchoolBySubDomain($subDomain: String!) @auth(level: NO_ACCESS) {
  schools(where: {subDomain: {eq: $subDomain}}, limit: 1) { id name subDomain subscriptionStatus defaultLanguage }
}

# Platform (SUPER_ADMIN) only: every school.
query ListSchools($limit: Int!, $offset: Int!) @auth(level: NO_ACCESS) {
  schools(orderBy: [{createdAt: DESC}], limit: $limit, offset: $offset) { id name subDomain subscriptionStatus defaultLanguage createdAt administrators: schoolMembers_on_school(where: {schoolRole: {eq: SYSTEM_ADMIN}, status: {eq: ACTIVE}}) { userId } }
}

query ListMemberships($schoolId: UUID!) @auth(level: NO_ACCESS) {
  schoolMembers(where: {schoolId: {eq: $schoolId}}, orderBy: [{createdAt: ASC}]) {
    schoolRole
    status
    createdAt
    user { id email displayName phoneNumber }
  }
}

query ListInvitations($schoolId: UUID!) @auth(level: NO_ACCESS) {
  invitations(where: {schoolId: {eq: $schoolId}}, orderBy: [{createdAt: DESC}]) {
    id email phoneNumber schoolRole status expiresAt createdAt acceptedAt
    createdBy { id displayName }
  }
}

# Accept flow: the invitee does not know the school id, only the secret token. Lookup is by hash.
query GetInvitationByTokenHash($tokenHash: String!) @auth(level: NO_ACCESS) {
  invitations(where: {tokenHash: {eq: $tokenHash}}, limit: 1) {
    id schoolRole status expiresAt email school { id name subscriptionStatus }
  }
}

query ListAuditLog($schoolId: UUID!, $limit: Int!, $offset: Int!) @auth(level: NO_ACCESS) {
  auditLogs(where: {schoolId: {eq: $schoolId}}, orderBy: [{createdAt: DESC}], limit: $limit, offset: $offset) {
    id action entityType entityId details createdAt
    actor { id email displayName }
  }
}

# School setup (P2-1). Every read is scoped by $schoolId.
query GetSchoolProfile($schoolId: UUID!) @auth(level: NO_ACCESS) {
  school(id: $schoolId) { id name subDomain defaultLanguage currency locale address contactPhone contactEmail primaryColor logoKey activeAcademicYear { id name } }
}

query ListGradeLevels($schoolId: UUID!) @auth(level: NO_ACCESS) {
  gradeLevels(where: {schoolId: {eq: $schoolId}}, orderBy: [{position: ASC}, {name: ASC}]) {
    id name position
    classrooms: classrooms_on_gradeLevel(orderBy: [{section: ASC}]) { id section name capacity }
  }
}

query ListClassrooms($schoolId: UUID!) @auth(level: NO_ACCESS) {
  classrooms(where: {schoolId: {eq: $schoolId}}, orderBy: [{name: ASC}]) { id name section capacity gradeLevel { id name position } }
}

query ListSubjects($schoolId: UUID!) @auth(level: NO_ACCESS) {
  subjects(where: {schoolId: {eq: $schoolId}}, orderBy: [{name: ASC}]) { id name code }
}

query ListAcademicYears($schoolId: UUID!) @auth(level: NO_ACCESS) {
  academicYears(where: {schoolId: {eq: $schoolId}}, orderBy: [{startDate: DESC}]) { id name startDate endDate status }
}

# ---- Students (P2-2). `search` is a LIKE pattern the gateway builds (%text%) matched against name or enrolment id; a null filter is skipped.
query SchoolSeq($schoolId: UUID!) @auth(level: NO_ACCESS) {
  school(id: $schoolId) { id studentSeq enrollmentPrefix }
}

query ListStudents($schoolId: UUID!, $search: String, $status: StudentStatus, $limit: Int!, $offset: Int!) @auth(level: NO_ACCESS) {
  students(
    where: {_and: [{schoolId: {eq: $schoolId}}, {status: {eq: $status}}, {_or: [{firstName: {pattern: {like: $search, ignoreCase: true}}}, {lastName: {pattern: {like: $search, ignoreCase: true}}}, {enrollmentId: {pattern: {like: $search, ignoreCase: true}}}]}]}
    orderBy: [{lastName: ASC}, {firstName: ASC}, {serial: ASC}], limit: $limit, offset: $offset
  ) {
    id firstName lastName enrollmentId serial status gender dateOfBirth
    placements: studentEnrollments_on_student(orderBy: [{createdAt: DESC}], limit: 1) { academicYear { id name } classroom { id name } }
  }
}

query CountStudents($schoolId: UUID!, $search: String, $status: StudentStatus) @auth(level: NO_ACCESS) {
  students(where: {_and: [{schoolId: {eq: $schoolId}}, {status: {eq: $status}}, {_or: [{firstName: {pattern: {like: $search, ignoreCase: true}}}, {lastName: {pattern: {like: $search, ignoreCase: true}}}, {enrollmentId: {pattern: {like: $search, ignoreCase: true}}}]}]}) { _count }
}

query GetStudent($schoolId: UUID!, $id: UUID!) @auth(level: NO_ACCESS) {
  students(where: {schoolId: {eq: $schoolId}, id: {eq: $id}}, limit: 1) {
    id firstName lastName enrollmentId serial status gender dateOfBirth admissionDate address photoKey createdAt
    placements: studentEnrollments_on_student(orderBy: [{createdAt: DESC}]) { academicYear { id name } classroom { id name } }
    guardians: guardians_on_student(orderBy: [{isPrimary: DESC}, {createdAt: ASC}]) { id name relationship phone email isPrimary }
    documents: studentDocuments_on_student(orderBy: [{createdAt: DESC}]) { id kind fileKey fileName contentType sizeBytes createdAt }
  }
}

# ---- Staff (P2-4). `search` is a LIKE pattern the gateway builds; a null filter is skipped.
query StaffSeqInfo($schoolId: UUID!) @auth(level: NO_ACCESS) {
  school(id: $schoolId) { id staffSeq }
}

query ListStaffProfiles($schoolId: UUID!, $search: String, $status: StaffStatus, $department: String, $limit: Int!, $offset: Int!) @auth(level: NO_ACCESS) {
  staffProfiles(where: {_and: [{schoolId: {eq: $schoolId}}, {status: {eq: $status}}, {department: {eq: $department}}, {_or: [{firstName: {pattern: {like: $search, ignoreCase: true}}}, {lastName: {pattern: {like: $search, ignoreCase: true}}}, {employeeId: {pattern: {like: $search, ignoreCase: true}}}]}]}, orderBy: [{lastName: ASC}, {firstName: ASC}, {serial: ASC}], limit: $limit, offset: $offset) {
    id employeeId firstName lastName department designation status userId
  }
}

query CountStaffProfiles($schoolId: UUID!, $search: String, $status: StaffStatus, $department: String) @auth(level: NO_ACCESS) {
  staffProfiles(where: {_and: [{schoolId: {eq: $schoolId}}, {status: {eq: $status}}, {department: {eq: $department}}, {_or: [{firstName: {pattern: {like: $search, ignoreCase: true}}}, {lastName: {pattern: {like: $search, ignoreCase: true}}}, {employeeId: {pattern: {like: $search, ignoreCase: true}}}]}]}) { _count }
}

query GetStaffProfile($schoolId: UUID!, $id: UUID!) @auth(level: NO_ACCESS) {
  staffProfiles(where: {schoolId: {eq: $schoolId}, id: {eq: $id}}, limit: 1) {
    id employeeId firstName lastName department designation phone email dateOfBirth gender dateOfJoining address emergencyContactName emergencyContactPhone status photoKey createdAt userId
    documents: staffDocuments_on_staff(orderBy: [{createdAt: DESC}]) { id kind fileKey fileName contentType sizeBytes createdAt }
  }
}

query ListStaffDepartments($schoolId: UUID!) @auth(level: NO_ACCESS) {
  staffProfiles(where: {schoolId: {eq: $schoolId}, department: {isNull: false}}, orderBy: [{department: ASC}]) { department }
}
