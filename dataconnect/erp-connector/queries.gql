# Get all active Academic Years for a School
query ListAcademicYears($schoolId: UUID!) @auth(level: NO_ACCESS) {
  academicYears(where: {schoolId: {eq: $schoolId}}, orderBy: [{startDate: DESC}]) {
    id
    name
    startDate
    endDate
    status
  }
}

# Get all Classrooms for a School
query ListClassrooms($schoolId: UUID!) @auth(level: NO_ACCESS) {
  classrooms(where: {schoolId: {eq: $schoolId}}, orderBy: [{gradeLevel: ASC}, {name: ASC}]) {
    id
    name
    gradeLevel
    capacity
  }
}

# Get all Invoices for a School (Requires joining through Student)
query ListInvoices($schoolId: UUID!) @auth(level: NO_ACCESS) {
  invoices(where: {schoolId: {eq: $schoolId}}, orderBy: [{dueDate: ASC}]) {
    id
    amountMinor
    dueDate
    status
    student {
      firstName
      lastName
      enrollmentId
    }
  }
}

# HR: Get all Students for a School
query ListStudents($schoolId: UUID!) @auth(level: NO_ACCESS) {
  students(where: {schoolId: {eq: $schoolId}}, orderBy: [{lastName: ASC}, {firstName: ASC}]) {
    id
    firstName
    lastName
    enrollmentId
    gradeLevel
  }
}

# HR: Get all Staff (SchoolMembers) for a School
query ListStaff($schoolId: UUID!) @auth(level: NO_ACCESS) {
  schoolMembers(where: {schoolId: {eq: $schoolId}}) {
    schoolRole
    user {
      id
      email
      phoneNumber
      globalRole
    }
  }
}

# Finance: Get Payroll for a School
query ListPayroll($schoolId: UUID!) @auth(level: NO_ACCESS) {
  payrolls(where: {schoolId: {eq: $schoolId}}, orderBy: [{payDate: DESC}]) {
    id
    amountMinor
    payDate
    status
    user {
      id
      email
    }
  }
}

# Academic: Get Subjects
query ListSubjects($schoolId: UUID!) @auth(level: NO_ACCESS) {
  subjects(where: {schoolId: {eq: $schoolId}}) {
    id
    name
    code
  }
}

# Academic: Get Class Schedules
query ListSchedules($schoolId: UUID!) @auth(level: NO_ACCESS) {
  classSchedules(where: {schoolId: {eq: $schoolId}}) {
    id
    dayOfWeek
    startTime
    endTime
    classroom { name }
    subject { name }
    teacher { email }
  }
}

# Academic: Get Leave Requests
query ListLeaveRequests($schoolId: UUID!) @auth(level: NO_ACCESS) {
  leaveRequests(where: {schoolId: {eq: $schoolId}}) {
    id
    startDate
    endDate
    reason
    status
    user { email }
    substitute { email }
  }
}

# Academic: Get Exams
query ListExams($schoolId: UUID!) @auth(level: NO_ACCESS) {
  exams(where: {schoolId: {eq: $schoolId}}) {
    id
    title
    examDate
    maxScore
    classroom { name }
    subject { name }
  }
}

# ---- Phase 1: identity, tenancy, platform and audit reads. Gateway-only (NO_ACCESS). ----

# Identity sync / profile. $id is the Firebase UID from the VERIFIED token. Users are global, so this has no school.
query GetUser($id: String!) @auth(level: NO_ACCESS) {
  user(key: {id: $id}) { id email phoneNumber displayName language globalRole }
}

# The membership the TenantGuard checks on every request: ACTIVE, role, and the school's subscription status.
query GetMembership($schoolId: UUID!, $userId: String!) @auth(level: NO_ACCESS) {
  schoolMembers(where: {schoolId: {eq: $schoolId}, userId: {eq: $userId}}) {
    schoolRole
    status
    school { id name subscriptionStatus defaultLanguage }
  }
}

# All schools a user belongs to (for /me and the school picker). Keyed by the user, not by a school.
query ListMembershipsForUser($userId: String!) @auth(level: NO_ACCESS) {
  schoolMembers(where: {userId: {eq: $userId}}) {
    schoolRole
    status
    school { id name subDomain subscriptionStatus defaultLanguage }
  }
}

query GetSchool($schoolId: UUID!) @auth(level: NO_ACCESS) {
  school(id: $schoolId) { id name subDomain subscriptionStatus currency locale defaultLanguage createdAt administrators: schoolMembers_on_school(where: {schoolRole: {eq: SYSTEM_ADMIN}, status: {eq: ACTIVE}}) { userId } }
}

# Public school lookup for the web apps (minimal fields only; the gateway rate-limits it).
query GetSchoolBySubDomain($subDomain: String!) @auth(level: NO_ACCESS) {
  schools(where: {subDomain: {eq: $subDomain}}, limit: 1) { id name subDomain subscriptionStatus defaultLanguage }
}

# Platform (SUPER_ADMIN) only: every school.
query ListSchools($limit: Int!, $offset: Int!) @auth(level: NO_ACCESS) {
  schools(orderBy: [{createdAt: DESC}], limit: $limit, offset: $offset) { id name subDomain subscriptionStatus defaultLanguage createdAt administrators: schoolMembers_on_school(where: {schoolRole: {eq: SYSTEM_ADMIN}, status: {eq: ACTIVE}}) { userId } }
}

query ListMemberships($schoolId: UUID!) @auth(level: NO_ACCESS) {
  schoolMembers(where: {schoolId: {eq: $schoolId}}, orderBy: [{createdAt: ASC}]) {
    schoolRole
    status
    createdAt
    user { id email displayName phoneNumber }
  }
}

query ListInvitations($schoolId: UUID!) @auth(level: NO_ACCESS) {
  invitations(where: {schoolId: {eq: $schoolId}}, orderBy: [{createdAt: DESC}]) {
    id email phoneNumber schoolRole status expiresAt createdAt acceptedAt
    createdBy { id displayName }
  }
}

# Accept flow: the invitee does not know the school id, only the secret token. Lookup is by hash.
query GetInvitationByTokenHash($tokenHash: String!) @auth(level: NO_ACCESS) {
  invitations(where: {tokenHash: {eq: $tokenHash}}, limit: 1) {
    id schoolRole status expiresAt email school { id name subscriptionStatus }
  }
}

query ListAuditLog($schoolId: UUID!, $limit: Int!, $offset: Int!) @auth(level: NO_ACCESS) {
  auditLogs(where: {schoolId: {eq: $schoolId}}, orderBy: [{createdAt: DESC}], limit: $limit, offset: $offset) {
    id action entityType entityId details createdAt
    actor { id email displayName }
  }
}
