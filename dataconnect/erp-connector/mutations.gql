# Finance: Create an Invoice
# The student must belong to $schoolId or the whole mutation aborts (DB-enforced, audit F4).
mutation CreateInvoice($schoolId: UUID!, $studentId: UUID!, $amountMinor: Int64!, $dueDate: Date!) @auth(level: NO_ACCESS) @transaction {
  query {
    students(where: {id: {eq: $studentId}, schoolId: {eq: $schoolId}}) @check(expr: "this.size() == 1", message: "student not found in this school") { id }
  }
  invoice_insert(data: {
    schoolId: $schoolId,
    studentId: $studentId,
    amountMinor: $amountMinor,
    dueDate: $dueDate
  })
}

