  query {
    actor: schoolMembers(where: {schoolId: {eq: $schoolId}, userId: {eq: $actorId}, status: {eq: ACTIVE}}) @check(expr: "this.size() == 1", message: "actor is not an active member of this school") { userId }
    run: payrollRuns(where: {id: {eq: $runId}, schoolId: {eq: $schoolId}, status: {eq: DRAFT}}) @check(expr: "this.size() == 1", message: "payroll run not found in this school or no longer a draft") { id }
    payslip: payslips(where: {id: {eq: $payslipId}, runId: {eq: $runId}, schoolId: {eq: $schoolId}}) @check(expr: "this.size() == 1", message: "payslip not found in this run") { id }
  }
  payslipLine_insert(data: { id: $id, schoolId: $schoolId, runId: $runId, payslipId: $payslipId, kind: $kind, name: $name, amountMinor: $amountMinor, manual: $manual })
  auditLog_insert(data: { schoolId: $schoolId, actorId: $actorId, action: "payroll.payslipline.add", entityType: "PayslipLine", entityId_expr: "request.variables.id", details: $details })
}

