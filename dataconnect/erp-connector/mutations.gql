    actor: schoolMembers(where: {schoolId: {eq: $schoolId}, userId: {eq: $actorId}, status: {eq: ACTIVE}}) @check(expr: "this.size() == 1", message: "actor is not an active member of this school") { userId }
    student: students(where: {id: {eq: $studentId}, schoolId: {eq: $schoolId}}) @check(expr: "this.size() == 1", message: "student not found in this school") { id }
  }
  invoice_insert(data: { id: $id, schoolId: $schoolId, studentId: $studentId, title: $title, amountMinor: $amountMinor, dueDate: $dueDate })
  auditLog_insert(data: { schoolId: $schoolId, actorId: $actorId, action: "fees.invoice.create", entityType: "Invoice", entityId_expr: "request.variables.id", details: $details })
}

# The invoice for one student and one fee instalment. The unique (student, instalment) key refuses a second one (CONFLICT), which is how
# generating twice stays harmless.
mutation CreateInstalmentInvoice($schoolId: UUID!, $id: UUID!, $studentId: UUID!, $instalmentId: UUID!, $academicYearId: UUID!, $title: String!, $grossMinor: Int64!, $discountMinor: Int64!, $amountMinor: Int64!, $dueDate: Date!, $actorId: String!, $details: Any) @auth(level: NO_ACCESS) @transaction {
  query {
    actor: schoolMembers(where: {schoolId: {eq: $schoolId}, userId: {eq: $actorId}, status: {eq: ACTIVE}}) @check(expr: "this.size() == 1", message: "actor is not an active member of this school") { userId }
    student: students(where: {id: {eq: $studentId}, schoolId: {eq: $schoolId}}) @check(expr: "this.size() == 1", message: "student not found in this school") { id }
    inst: feeInstalments(where: {id: {eq: $instalmentId}, schoolId: {eq: $schoolId}}) @check(expr: "this.size() == 1", message: "instalment not found in this school") { id }
    year: academicYears(where: {id: {eq: $academicYearId}, schoolId: {eq: $schoolId}}) @check(expr: "this.size() == 1", message: "academic year not found in this school") { id }
  }
  invoice_insert(data: { id: $id, schoolId: $schoolId, studentId: $studentId, instalmentId: $instalmentId, academicYearId: $academicYearId, title: $title, grossMinor: $grossMinor, discountMinor: $discountMinor, amountMinor: $amountMinor, dueDate: $dueDate })
  auditLog_insert(data: { schoolId: $schoolId, actorId: $actorId, action: "fees.invoice.create", entityType: "Invoice", entityId_expr: "request.variables.id", details: $details })
}

# Records a payment AND its receipt in one transaction. $expectedPaidMinor is the paid total the caller saw, $expectedReceiptSeq the year's receipt
# counter the caller saw: if either changed meanwhile the check fails (ABORTED) or the unique serial refuses (CONFLICT) and nothing is written, so
# two cashiers can neither overpay an invoice nor share a receipt number. The gateway has already checked the new totals.
mutation RecordPayment($schoolId: UUID!, $id: UUID!, $receiptId: UUID!, $invoiceId: UUID!, $studentId: UUID!, $amountMinor: Int64!, $method: PaymentMethod!, $reference: String, $paidOn: Date!, $expectedPaidMinor: Int64!, $newPaidMinor: Int64!, $newStatus: InvoiceStatus!, $balanceAfterMinor: Int64!, $receiptYearId: UUID!, $expectedReceiptSeq: Int!, $receiptNumber: String!, $actorId: String!, $details: Any) @auth(level: NO_ACCESS) @transaction {
  query {
    actor: schoolMembers(where: {schoolId: {eq: $schoolId}, userId: {eq: $actorId}, status: {eq: ACTIVE}}) @check(expr: "this.size() == 1", message: "actor is not an active member of this school") { userId }
    invoice: invoices(where: {id: {eq: $invoiceId}, schoolId: {eq: $schoolId}, studentId: {eq: $studentId}, paidMinor: {eq: $expectedPaidMinor}}) @check(expr: "this.size() == 1", message: "invoice not found in this school or its paid total changed") { id }
    year: academicYears(where: {id: {eq: $receiptYearId}, schoolId: {eq: $schoolId}, receiptSeq: {eq: $expectedReceiptSeq}}) @check(expr: "this.size() == 1", message: "receipt number was taken, retry") { id }
  }
  academicYear_update(id: $receiptYearId, data: { receiptSeq_update: { inc: 1 } })
  invoice_update(id: $invoiceId, data: { paidMinor: $newPaidMinor, status: $newStatus })
  payment_insert(data: { id: $id, schoolId: $schoolId, invoiceId: $invoiceId, studentId: $studentId, amountMinor: $amountMinor, method: $method, reference: $reference, paidOn: $paidOn, recordedById: $actorId })
  receipt_insert(data: { id: $receiptId, schoolId: $schoolId, academicYearId: $receiptYearId, serial_expr: "request.variables.expectedReceiptSeq + 1", number: $receiptNumber, paymentId: $id, studentId: $studentId, invoiceId: $invoiceId, amountMinor: $amountMinor, balanceAfterMinor: $balanceAfterMinor })
  auditLog_insert(data: { schoolId: $schoolId, actorId: $actorId, action: "fees.payment.record", entityType: "Payment", entityId_expr: "request.variables.id", details: $details })
}

# Takes a payment back out: the payment is kept and marked, the invoice's paid total goes down. Only a payment not yet reversed.
mutation ReversePayment($schoolId: UUID!, $id: UUID!, $invoiceId: UUID!, $reason: String!, $expectedPaidMinor: Int64!, $newPaidMinor: Int64!, $newStatus: InvoiceStatus!, $actorId: String!, $details: Any) @auth(level: NO_ACCESS) @transaction {
  query {
    actor: schoolMembers(where: {schoolId: {eq: $schoolId}, userId: {eq: $actorId}, status: {eq: ACTIVE}}) @check(expr: "this.size() == 1", message: "actor is not an active member of this school") { userId }
    payment: payments(where: {id: {eq: $id}, schoolId: {eq: $schoolId}, invoiceId: {eq: $invoiceId}, reversedAt: {isNull: true}}) @check(expr: "this.size() == 1", message: "payment not found in this school or already reversed") { id }
    invoice: invoices(where: {id: {eq: $invoiceId}, schoolId: {eq: $schoolId}, paidMinor: {eq: $expectedPaidMinor}}) @check(expr: "this.size() == 1", message: "invoice not found in this school or its paid total changed") { id }
  }
  invoice_update(id: $invoiceId, data: { paidMinor: $newPaidMinor, status: $newStatus })
  payment_update(id: $id, data: { reversedAt_expr: "request.time", reversalReason: $reason })
  receipt_updateMany(where: {paymentId: {eq: $id}, schoolId: {eq: $schoolId}}, data: { cancelledAt_expr: "request.time", cancelReason: $reason })
  auditLog_insert(data: { schoolId: $schoolId, actorId: $actorId, action: "fees.payment.reverse", entityType: "Payment", entityId_expr: "request.variables.id", details: $details })
}

