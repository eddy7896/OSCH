    actor: schoolMembers(where: {schoolId: {eq: $schoolId}, userId: {eq: $actorId}, status: {eq: ACTIVE}}) @check(expr: "this.size() == 1", message: "actor is not an active member of this school") { userId }
    run: payrollRuns(where: {id: {eq: $runId}, schoolId: {eq: $schoolId}, status: {eq: DRAFT}}) @check(expr: "this.size() == 1", message: "payroll run not found in this school or no longer a draft") { id }
    line: payslipLines(where: {id: {eq: $id}, runId: {eq: $runId}, schoolId: {eq: $schoolId}}) @check(expr: "this.size() == 1", message: "line not found in this run") { id }
  }
  payslipLine_delete(id: $id)
  auditLog_insert(data: { schoolId: $schoolId, actorId: $actorId, action: "payroll.payslipline.remove", entityType: "PayslipLine", entityId_expr: "request.variables.id", details: $details })
}

mutation DeletePayrollRun($schoolId: UUID!, $id: UUID!, $actorId: String!, $details: Any) @auth(level: NO_ACCESS) @transaction {
  query {
    actor: schoolMembers(where: {schoolId: {eq: $schoolId}, userId: {eq: $actorId}, status: {eq: ACTIVE}}) @check(expr: "this.size() == 1", message: "actor is not an active member of this school") { userId }
    run: payrollRuns(where: {id: {eq: $id}, schoolId: {eq: $schoolId}, status: {eq: DRAFT}}) @check(expr: "this.size() == 1", message: "payroll run not found in this school or no longer a draft") { id }
  }
  payrollRun_delete(id: $id)
  auditLog_insert(data: { schoolId: $schoolId, actorId: $actorId, action: "payroll.run.delete", entityType: "PayrollRun", entityId_expr: "request.variables.id", details: $details })
}

# Approval is the Principal's alone, and the database itself checks it: the actor must be an ACTIVE PRINCIPAL of this school, so even a mistake
# in the gateway cannot let anyone else approve. A run can only be approved while it is a DRAFT.
mutation ApprovePayrollRun($schoolId: UUID!, $id: UUID!, $actorId: String!, $details: Any) @auth(level: NO_ACCESS) @transaction {
  query {
    actor: schoolMembers(where: {schoolId: {eq: $schoolId}, userId: {eq: $actorId}, schoolRole: {eq: PRINCIPAL}, status: {eq: ACTIVE}}) @check(expr: "this.size() == 1", message: "only the Principal of this school can approve payroll") { userId }
    run: payrollRuns(where: {id: {eq: $id}, schoolId: {eq: $schoolId}, status: {eq: DRAFT}}) @check(expr: "this.size() == 1", message: "payroll run not found in this school or no longer a draft") { id }
  }
  payrollRun_update(id: $id, data: { status: APPROVED, approvedById: $actorId, approvedAt_expr: "request.time" })
  auditLog_insert(data: { schoolId: $schoolId, actorId: $actorId, action: "payroll.run.approve", entityType: "PayrollRun", entityId_expr: "request.variables.id", details: $details })
}

# Paying is the Bursar's (the finance silo), also checked by the database. Only an APPROVED run.
mutation MarkPayrollRunPaid($schoolId: UUID!, $id: UUID!, $paidOn: Date!, $paymentReference: String, $actorId: String!, $details: Any) @auth(level: NO_ACCESS) @transaction {
  query {
    actor: schoolMembers(where: {schoolId: {eq: $schoolId}, userId: {eq: $actorId}, schoolRole: {eq: BURSAR}, status: {eq: ACTIVE}}) @check(expr: "this.size() == 1", message: "only the Bursar of this school can mark payroll paid") { userId }
    run: payrollRuns(where: {id: {eq: $id}, schoolId: {eq: $schoolId}, status: {eq: APPROVED}}) @check(expr: "this.size() == 1", message: "payroll run not found in this school or not approved") { id }
  }
  payrollRun_update(id: $id, data: { status: PAID, paidById: $actorId, paidAt_expr: "request.time", paidOn: $paidOn, paymentReference: $paymentReference })
  auditLog_insert(data: { schoolId: $schoolId, actorId: $actorId, action: "payroll.run.pay", entityType: "PayrollRun", entityId_expr: "request.variables.id", details: $details })
}

