}

# Audit: append one row per mutating gateway request (E-AUD-1). $schoolId is null only for platform-level actions.
mutation CreateAuditLog($schoolId: UUID, $actorId: String!, $action: String!, $entityType: String!, $entityId: String, $details: Any) @auth(level: NO_ACCESS) {
  auditLog_insert(data: {
    schoolId: $schoolId,
    actorId: $actorId,
    action: $action,
    entityType: $entityType,
    entityId: $entityId,
    details: $details
  })
}
