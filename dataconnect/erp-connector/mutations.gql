# The maximum cannot go below a mark already given.
mutation UpdateExam($schoolId: UUID!, $id: UUID!, $title: String!, $examDate: Date!, $maxTenths: Int!, $actorId: String!, $details: Any) @auth(level: NO_ACCESS) @transaction {
  query {
    actor: schoolMembers(where: {schoolId: {eq: $schoolId}, userId: {eq: $actorId}, status: {eq: ACTIVE}}) @check(expr: "this.size() == 1", message: "actor is not an active member of this school") { userId }
    exam: exams(where: {id: {eq: $id}, schoolId: {eq: $schoolId}}) @check(expr: "this.size() == 1", message: "exam not found in this school") { id }
    above: marks(where: {examId: {eq: $id}, schoolId: {eq: $schoolId}, tenths: {gt: $maxTenths}}) @check(expr: "this.size() == 0", message: "a mark is already above that maximum") { id }
  }
  exam_update(id: $id, data: { title: $title, examDate: $examDate, maxTenths: $maxTenths })
  auditLog_insert(data: { schoolId: $schoolId, actorId: $actorId, action: "grades.exam.update", entityType: "Exam", entityId_expr: "request.variables.id", details: $details })
}

mutation DeleteExam($schoolId: UUID!, $id: UUID!, $actorId: String!, $details: Any) @auth(level: NO_ACCESS) @transaction {
