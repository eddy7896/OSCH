# Exactly one active year: the school points at it, and the previous one is archived, in one transaction.
mutation ActivateAcademicYear($schoolId: UUID!, $id: UUID!, $actorId: String!, $details: Any) @auth(level: NO_ACCESS) @transaction {
  query {
    actor: schoolMembers(where: {schoolId: {eq: $schoolId}, userId: {eq: $actorId}, status: {eq: ACTIVE}}) @check(expr: "this.size() == 1", message: "actor is not an active member of this school") { userId }
    year: academicYears(where: {id: {eq: $id}, schoolId: {eq: $schoolId}}) @check(expr: "this.size() == 1", message: "academic year not found in this school") { id }
  }
  academicYear_updateMany(where: {schoolId: {eq: $schoolId}, status: {eq: ACTIVE}}, data: { status: ARCHIVED })
  academicYear_update(id: $id, data: { status: ACTIVE })
  school_update(id: $schoolId, data: { activeAcademicYearId: $id })
  auditLog_insert(data: { schoolId: $schoolId, actorId: $actorId, action: "academic.year.activate", entityType: "AcademicYear", entityId_expr: "request.variables.id", details: $details })
}

mutation DeleteAcademicYear($schoolId: UUID!, $id: UUID!, $actorId: String!, $details: Any) @auth(level: NO_ACCESS) @transaction {
  query {
    actor: schoolMembers(where: {schoolId: {eq: $schoolId}, userId: {eq: $actorId}, status: {eq: ACTIVE}}) @check(expr: "this.size() == 1", message: "actor is not an active member of this school") { userId }
    year: academicYears(where: {id: {eq: $id}, schoolId: {eq: $schoolId}}) @check(expr: "this.size() == 1", message: "academic year not found in this school") { id }
    notActive: academicYears(where: {id: {eq: $id}, schoolId: {eq: $schoolId}, status: {eq: ACTIVE}}) @check(expr: "this.size() == 0", message: "the active academic year cannot be deleted") { id }
  }
  academicYear_delete(id: $id)
  auditLog_insert(data: { schoolId: $schoolId, actorId: $actorId, action: "academic.year.delete", entityType: "AcademicYear", entityId_expr: "request.variables.id", details: $details })
}

# ---- Students (P2-2). The serial is handed out by comparing the school's counter with the value the gateway read: if another
# admission took that number first, the check fails (ABORTED) and the gateway reads again and retries. Nothing is written then.
mutation CreateStudent($schoolId: UUID!, $id: UUID!, $expectedSeq: Int!, $enrollmentId: String!, $firstName: String!, $lastName: String!, $dateOfBirth: Date, $gender: Gender, $admissionDate: Date, $address: String, $actorId: String!, $details: Any) @auth(level: NO_ACCESS) @transaction {
  query {
    actor: schoolMembers(where: {schoolId: {eq: $schoolId}, userId: {eq: $actorId}, status: {eq: ACTIVE}}) @check(expr: "this.size() == 1", message: "actor is not an active member of this school") { userId }
    counter: schools(where: {id: {eq: $schoolId}, studentSeq: {eq: $expectedSeq}}) @check(expr: "this.size() == 1", message: "student number was taken, retry") { id }
  }
  school_update(id: $schoolId, data: { studentSeq_update: { inc: 1 } })
  student_insert(data: { id: $id, schoolId: $schoolId, serial_expr: "request.variables.expectedSeq + 1", enrollmentId: $enrollmentId, firstName: $firstName, lastName: $lastName, dateOfBirth: $dateOfBirth, gender: $gender, admissionDate: $admissionDate, address: $address })
  auditLog_insert(data: { schoolId: $schoolId, actorId: $actorId, action: "student.create", entityType: "Student", entityId_expr: "request.variables.id", details: $details })
}

mutation UpdateStudent($schoolId: UUID!, $id: UUID!, $firstName: String, $lastName: String, $dateOfBirth: Date, $gender: Gender, $admissionDate: Date, $address: String, $status: StudentStatus, $actorId: String!, $details: Any) @auth(level: NO_ACCESS) @transaction {
