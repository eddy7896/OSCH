# Seed database
mutation CreateSchool($id: UUID!, $name: String!, $subDomain: String!) @auth(level: NO_ACCESS) {
  school_insert(data: { id: $id, name: $name, subDomain: $subDomain })
}

mutation CreateUser($id: String!, $email: String!, $globalRole: GlobalRole!) @auth(level: NO_ACCESS) {
  user_insert(data: { id: $id, email: $email, globalRole: $globalRole })
}

# System Admin: add a user to a school with a role. The gateway MUST require `memberships:create` (only SYSTEM_ADMIN holds it, ADR-0007); HR must not be able to call this.
mutation CreateSchoolMember($schoolId: UUID!, $userId: String!, $schoolRole: SchoolRole!) @auth(level: NO_ACCESS) {
  schoolMember_insert(data: {
    schoolId: $schoolId,
    userId: $userId,
    schoolRole: $schoolRole
  })
}

# Academic: Create a Class Schedule
# Classroom, subject and teacher must all belong to $schoolId (DB-enforced; otherwise the List joins would leak another tenant's names/emails).
mutation CreateSchedule($schoolId: UUID!, $classroomId: UUID!, $subjectId: UUID!, $teacherId: String!, $dayOfWeek: String!, $startTime: String!, $endTime: String!) @auth(level: NO_ACCESS) @transaction {
  query {
    classrooms(where: {id: {eq: $classroomId}, schoolId: {eq: $schoolId}}) @check(expr: "this.size() == 1", message: "classroom not found in this school") { id }
    subjects(where: {id: {eq: $subjectId}, schoolId: {eq: $schoolId}}) @check(expr: "this.size() == 1", message: "subject not found in this school") { id }
    schoolMembers(where: {schoolId: {eq: $schoolId}, userId: {eq: $teacherId}}) @check(expr: "this.size() == 1", message: "teacher is not a member of this school") { userId }
  }
  classSchedule_insert(data: {
    schoolId: $schoolId,
    classroomId: $classroomId,
    subjectId: $subjectId,
    teacherId: $teacherId,
    dayOfWeek: $dayOfWeek,
    startTime: $startTime,
    endTime: $endTime
  })
}

# Academic: Create a Leave Request
# The requester must be a member of $schoolId.
mutation CreateLeaveRequest($schoolId: UUID!, $userId: String!, $startDate: Date!, $endDate: Date!, $reason: String) @auth(level: NO_ACCESS) @transaction {
  query {
    schoolMembers(where: {schoolId: {eq: $schoolId}, userId: {eq: $userId}}) @check(expr: "this.size() == 1", message: "user is not a member of this school") { userId }
  }
  leaveRequest_insert(data: {
    schoolId: $schoolId,
    userId: $userId,
    startDate: $startDate,
    endDate: $endDate,
    reason: $reason
  })
}

# Academic: Update Leave Request (Approve/Reject & Substitute)
# Scoped to the school in the WHERE clause: a leave id from another tenant matches nothing (audit F4).
# If a substitute is given they must be a member of $schoolId; the leave row itself is scoped by the WHERE clause.
mutation UpdateLeaveRequest($schoolId: UUID!, $id: UUID!, $status: LeaveStatus!, $substituteId: String) @auth(level: NO_ACCESS) @transaction {
  query {
    schoolMembers(where: {schoolId: {eq: $schoolId}, userId: {eq: $substituteId}}) @check(expr: "vars.substituteId == null || this.size() == 1", message: "substitute is not a member of this school") { userId }
  }
  leaveRequest_updateMany(where: {id: {eq: $id}, schoolId: {eq: $schoolId}}, data: {
    status: $status,
    substituteId: $substituteId
  })
}

# Academic: Create an Exam
# Classroom and subject must belong to $schoolId (DB-enforced).
mutation CreateExam($schoolId: UUID!, $classroomId: UUID!, $subjectId: UUID!, $title: String!, $examDate: Date!, $maxScore: Int!) @auth(level: NO_ACCESS) @transaction {
  query {
    classrooms(where: {id: {eq: $classroomId}, schoolId: {eq: $schoolId}}) @check(expr: "this.size() == 1", message: "classroom not found in this school") { id }
    subjects(where: {id: {eq: $subjectId}, schoolId: {eq: $schoolId}}) @check(expr: "this.size() == 1", message: "subject not found in this school") { id }
  }
  exam_insert(data: {
    schoolId: $schoolId,
    classroomId: $classroomId,
    subjectId: $subjectId,
    title: $title,
    examDate: $examDate,
    maxScore: $maxScore
  })
}

# Audit: append one row per mutating gateway request (E-AUD-1). $schoolId is null only for platform-level actions.
mutation CreateAuditLog($schoolId: UUID, $actorId: String!, $action: String!, $entityType: String!, $entityId: String, $details: Any) @auth(level: NO_ACCESS) {
  auditLog_insert(data: {
    schoolId: $schoolId,
    actorId: $actorId,
    action: $action,
    entityType: $entityType,
    entityId: $entityId,
    details: $details
  })
}

# ---- Phase 1: identity, tenancy and platform writes (gateway-only). ----
# Rule (drift rule dc-audit): every state-changing mutation writes its audit row INSIDE its own @transaction, so there
# is no change without an audit row. Mutations that cannot (identity sync, Phase 0 seed operations) are listed with a
# reason in tools/checks/drift-config.json `auditExemptOperations`.

# Identity sync: create the global User row the first time a verified Firebase user is seen. The user row is the actor
# of every later audit entry, so it cannot be audited by itself; the gateway records the sign-in as a security event.
mutation UpsertUser($id: String!, $email: String!, $displayName: String, $phoneNumber: String) @auth(level: NO_ACCESS) {
  user_upsert(data: { id: $id, email: $email, displayName: $displayName, phoneNumber: $phoneNumber })
}

# The user's own explicit language choice (ADR-0006). Self-service on one's own row; no other user's data is touched.
mutation SetUserLanguage($userId: String!, $language: String) @auth(level: NO_ACCESS) {
  user_update(key: {id: $userId}, data: { language: $language })
}

# Platform (SUPER_ADMIN): create a school, with the default class levels (Nursery, LKG, UKG, 1 to 12; ADR-0012) in the same transaction.
mutation ProvisionSchool($id: UUID!, $name: String!, $subDomain: String!, $defaultLanguage: String!, $actorId: String!, $details: Any) @auth(level: NO_ACCESS) @transaction {
  school_insert(data: { id: $id, name: $name, subDomain: $subDomain, defaultLanguage: $defaultLanguage })
  level1: gradeLevel_insert(data: { schoolId: $id, name: "Nursery", position: 1 }) # default level 1
  level2: gradeLevel_insert(data: { schoolId: $id, name: "LKG", position: 2 }) # default level 2
  level3: gradeLevel_insert(data: { schoolId: $id, name: "UKG", position: 3 }) # default level 3
  level4: gradeLevel_insert(data: { schoolId: $id, name: "1", position: 4 }) # default level 4
  level5: gradeLevel_insert(data: { schoolId: $id, name: "2", position: 5 }) # default level 5
  level6: gradeLevel_insert(data: { schoolId: $id, name: "3", position: 6 }) # default level 6
  level7: gradeLevel_insert(data: { schoolId: $id, name: "4", position: 7 }) # default level 7
  level8: gradeLevel_insert(data: { schoolId: $id, name: "5", position: 8 }) # default level 8
  level9: gradeLevel_insert(data: { schoolId: $id, name: "6", position: 9 }) # default level 9
  level10: gradeLevel_insert(data: { schoolId: $id, name: "7", position: 10 }) # default level 10
  level11: gradeLevel_insert(data: { schoolId: $id, name: "8", position: 11 }) # default level 11
  level12: gradeLevel_insert(data: { schoolId: $id, name: "9", position: 12 }) # default level 12
  level13: gradeLevel_insert(data: { schoolId: $id, name: "10", position: 13 }) # default level 13
  level14: gradeLevel_insert(data: { schoolId: $id, name: "11", position: 14 }) # default level 14
  level15: gradeLevel_insert(data: { schoolId: $id, name: "12", position: 15 }) # default level 15
  auditLog_insert(data: { schoolId: $id, actorId: $actorId, action: "platform.school.create", entityType: "School", entityId_expr: "request.variables.id", details: $details })
}

# Platform (SUPER_ADMIN): give a school its FIRST System Admin, so someone can sign in to it. The platform owner is known only
# by the verified token claim (the User row keeps globalRole USER), so the gateway's @Platform() guard decides who may call this.
# The database guards what it can see: the school must exist and have no active System Admin yet (afterwards the school's own
# System Admin grants roles; the platform owner cannot add more). The role is fixed here, not a variable.
mutation ProvisionSchoolAdmin($schoolId: UUID!, $userId: String!, $actorId: String!, $details: Any) @auth(level: NO_ACCESS) @transaction {
  query {
    school: schools(where: {id: {eq: $schoolId}}) @check(expr: "this.size() == 1", message: "school not found") { id }
    admins: schoolMembers(where: {schoolId: {eq: $schoolId}, schoolRole: {eq: SYSTEM_ADMIN}, status: {eq: ACTIVE}}) @check(expr: "this.size() == 0", message: "this school already has an administrator") { userId }
  }
  schoolMember_insert(data: { schoolId: $schoolId, userId: $userId, schoolRole: SYSTEM_ADMIN })
  auditLog_insert(data: { schoolId: $schoolId, actorId: $actorId, action: "platform.school.admin.create", entityType: "SchoolMember", entityId_expr: "request.variables.userId", details: $details })
}

# School settings (System Admin via `settings`). The school row is addressed by id only, so it cannot touch another tenant.
mutation UpdateSchool($schoolId: UUID!, $name: String!, $defaultLanguage: String!, $actorId: String!, $details: Any) @auth(level: NO_ACCESS) @transaction {
  school_update(id: $schoolId, data: { name: $name, defaultLanguage: $defaultLanguage })
  auditLog_insert(data: { schoolId: $schoolId, actorId: $actorId, action: "school.update", entityType: "School", entityId_expr: "request.variables.schoolId", details: $details })
}

# Platform: suspend or reactivate a school. A suspended school is denied by the gateway on every tenant route.
mutation SetSubscriptionStatus($schoolId: UUID!, $status: SubscriptionStatus!, $actorId: String!, $details: Any) @auth(level: NO_ACCESS) @transaction {
  school_update(id: $schoolId, data: { subscriptionStatus: $status })
  auditLog_insert(data: { schoolId: $schoolId, actorId: $actorId, action: "platform.school.status", entityType: "School", entityId_expr: "request.variables.schoolId", details: $details })
}

# Memberships: only SYSTEM_ADMIN holds `memberships` (ADR-0007). The target user must exist (foreign key); a duplicate is a conflict.
mutation AddMembership($schoolId: UUID!, $userId: String!, $schoolRole: SchoolRole!, $actorId: String!, $details: Any) @auth(level: NO_ACCESS) @transaction {
  query {
    actor: schoolMembers(where: {schoolId: {eq: $schoolId}, userId: {eq: $actorId}, status: {eq: ACTIVE}}) @check(expr: "this.size() == 1", message: "actor is not an active member of this school") { userId }
  }
  schoolMember_insert(data: { schoolId: $schoolId, userId: $userId, schoolRole: $schoolRole })
  auditLog_insert(data: { schoolId: $schoolId, actorId: $actorId, action: "membership.add", entityType: "SchoolMember", entityId_expr: "request.variables.userId", details: $details })
}

mutation UpdateMembership($schoolId: UUID!, $userId: String!, $schoolRole: SchoolRole!, $status: MembershipStatus!, $actorId: String!, $details: Any) @auth(level: NO_ACCESS) @transaction {
  query {
    target: schoolMembers(where: {schoolId: {eq: $schoolId}, userId: {eq: $userId}}) @check(expr: "this.size() == 1", message: "membership not found in this school") { userId }
  }
  schoolMember_updateMany(where: {schoolId: {eq: $schoolId}, userId: {eq: $userId}}, data: { schoolRole: $schoolRole, status: $status })
  auditLog_insert(data: { schoolId: $schoolId, actorId: $actorId, action: "membership.update", entityType: "SchoolMember", entityId_expr: "request.variables.userId", details: $details })
}

mutation RemoveMembership($schoolId: UUID!, $userId: String!, $actorId: String!, $details: Any) @auth(level: NO_ACCESS) @transaction {
  query {
    target: schoolMembers(where: {schoolId: {eq: $schoolId}, userId: {eq: $userId}}) @check(expr: "this.size() == 1", message: "membership not found in this school") { userId }
  }
  schoolMember_deleteMany(where: {schoolId: {eq: $schoolId}, userId: {eq: $userId}})
  auditLog_insert(data: { schoolId: $schoolId, actorId: $actorId, action: "membership.remove", entityType: "SchoolMember", entityId_expr: "request.variables.userId", details: $details })
}

# Invitations. The creator must be an active member of the school; only the token HASH is stored.
mutation CreateInvitation($schoolId: UUID!, $email: String!, $phoneNumber: String, $schoolRole: SchoolRole!, $tokenHash: String!, $expiresAt: Timestamp!, $actorId: String!, $details: Any) @auth(level: NO_ACCESS) @transaction {
  query {
    actor: schoolMembers(where: {schoolId: {eq: $schoolId}, userId: {eq: $actorId}, status: {eq: ACTIVE}}) @check(expr: "this.size() == 1", message: "actor is not an active member of this school") { userId }
  }
  invitation_insert(data: { schoolId: $schoolId, email: $email, phoneNumber: $phoneNumber, schoolRole: $schoolRole, tokenHash: $tokenHash, expiresAt: $expiresAt, createdById: $actorId })
  auditLog_insert(data: { schoolId: $schoolId, actorId: $actorId, action: "invitation.create", entityType: "Invitation", details: $details })
}

mutation RevokeInvitation($schoolId: UUID!, $invitationId: UUID!, $actorId: String!, $details: Any) @auth(level: NO_ACCESS) @transaction {
  query {
    pending: invitations(where: {id: {eq: $invitationId}, schoolId: {eq: $schoolId}, status: {eq: PENDING}}) @check(expr: "this.size() == 1", message: "no pending invitation with this id in this school") { id }
  }
  invitation_updateMany(where: {id: {eq: $invitationId}, schoolId: {eq: $schoolId}}, data: { status: REVOKED })
  auditLog_insert(data: { schoolId: $schoolId, actorId: $actorId, action: "invitation.revoke", entityType: "Invitation", entityId_expr: "request.variables.invitationId", details: $details })
}

# Accepting joins the invitee to the school with the invited role. The invitation must still be PENDING and unexpired in
# THIS school; the accepting user is the actor of the audit row. The gateway has already matched the invitee's email.
mutation AcceptInvitation($schoolId: UUID!, $invitationId: UUID!, $userId: String!, $schoolRole: SchoolRole!, $now: Timestamp!, $details: Any) @auth(level: NO_ACCESS) @transaction {
  query {
    pending: invitations(where: {id: {eq: $invitationId}, schoolId: {eq: $schoolId}, status: {eq: PENDING}, expiresAt: {gt: $now}, schoolRole: {eq: $schoolRole}}) @check(expr: "this.size() == 1", message: "invitation is not pending, expired, or does not match") { id }
  }
  schoolMember_insert(data: { schoolId: $schoolId, userId: $userId, schoolRole: $schoolRole })
  invitation_updateMany(where: {id: {eq: $invitationId}, schoolId: {eq: $schoolId}}, data: { status: ACCEPTED, acceptedById: $userId, acceptedAt: $now })
  auditLog_insert(data: { schoolId: $schoolId, actorId: $userId, action: "invitation.accept", entityType: "Invitation", entityId_expr: "request.variables.invitationId", details: $details })
}

# ---- School setup (P2-1). Each mutation checks, inside the database, that the actor is an active member of $schoolId and
# that every row it touches belongs to $schoolId, and writes its audit row in the same transaction.

mutation UpdateSchoolProfile($schoolId: UUID!, $name: String, $address: String, $contactPhone: String, $contactEmail: String, $primaryColor: String, $defaultLanguage: String, $actorId: String!, $details: Any) @auth(level: NO_ACCESS) @transaction {
