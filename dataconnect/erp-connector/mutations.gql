}

# ---- Transport (P5-4a)
mutation CreateVehicle($schoolId: UUID!, $id: UUID!, $registration: String!, $label: String!, $capacity: Int!, $actorId: String!, $details: Any) @auth(level: NO_ACCESS) @transaction {
  query {
    actor: schoolMembers(where: {schoolId: {eq: $schoolId}, userId: {eq: $actorId}, status: {eq: ACTIVE}}) @check(expr: "this.size() == 1", message: "actor is not an active member of this school") { userId }
  }
  vehicle_insert(data: { id: $id, schoolId: $schoolId, registration: $registration, label: $label, capacity: $capacity })
  auditLog_insert(data: { schoolId: $schoolId, actorId: $actorId, action: "transport.vehicle.create", entityType: "Vehicle", entityId_expr: "request.variables.id", details: $details })
}

mutation UpdateVehicle($schoolId: UUID!, $id: UUID!, $registration: String, $label: String, $capacity: Int, $status: VehicleStatus, $actorId: String!, $details: Any) @auth(level: NO_ACCESS) @transaction {
  query {
    actor: schoolMembers(where: {schoolId: {eq: $schoolId}, userId: {eq: $actorId}, status: {eq: ACTIVE}}) @check(expr: "this.size() == 1", message: "actor is not an active member of this school") { userId }
    vehicle: vehicles(where: {id: {eq: $id}, schoolId: {eq: $schoolId}}) @check(expr: "this.size() == 1", message: "vehicle not found in this school") { id }
  }
  vehicle_update(id: $id, data: { registration: $registration, label: $label, capacity: $capacity, status: $status })
  auditLog_insert(data: { schoolId: $schoolId, actorId: $actorId, action: "transport.vehicle.update", entityType: "Vehicle", entityId_expr: "request.variables.id", details: $details })
}

# Refused while a route still uses the vehicle.
mutation DeleteVehicle($schoolId: UUID!, $id: UUID!, $actorId: String!, $details: Any) @auth(level: NO_ACCESS) @transaction {
  query {
    actor: schoolMembers(where: {schoolId: {eq: $schoolId}, userId: {eq: $actorId}, status: {eq: ACTIVE}}) @check(expr: "this.size() == 1", message: "actor is not an active member of this school") { userId }
    vehicle: vehicles(where: {id: {eq: $id}, schoolId: {eq: $schoolId}}) @check(expr: "this.size() == 1", message: "vehicle not found in this school") { id }
    inUse: transportRoutes(where: {vehicleId: {eq: $id}, schoolId: {eq: $schoolId}}) @check(expr: "this.size() == 0", message: "a route still uses this vehicle") { id }
  }
  vehicle_delete(id: $id)
  auditLog_insert(data: { schoolId: $schoolId, actorId: $actorId, action: "transport.vehicle.delete", entityType: "Vehicle", entityId_expr: "request.variables.id", details: $details })
}

