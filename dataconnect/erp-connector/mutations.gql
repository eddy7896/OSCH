}

# A route's stops are written one at a time by the gateway (as marks are): clear them, then add each in order. The (route, sequence) and (route, name)
# keys make a duplicate order or name impossible; the gateway checks the whole list first.
mutation ClearRouteStops($schoolId: UUID!, $routeId: UUID!, $actorId: String!, $details: Any) @auth(level: NO_ACCESS) @transaction {
  query {
    actor: schoolMembers(where: {schoolId: {eq: $schoolId}, userId: {eq: $actorId}, status: {eq: ACTIVE}}) @check(expr: "this.size() == 1", message: "actor is not an active member of this school") { userId }
    route: transportRoutes(where: {id: {eq: $routeId}, schoolId: {eq: $schoolId}}) @check(expr: "this.size() == 1", message: "route not found in this school") { id }
  }
  studentRoute_deleteMany(where: {routeId: {eq: $routeId}, schoolId: {eq: $schoolId}})
  routeStop_deleteMany(where: {routeId: {eq: $routeId}, schoolId: {eq: $schoolId}})
  auditLog_insert(data: { schoolId: $schoolId, actorId: $actorId, action: "transport.route.stops", entityType: "TransportRoute", entityId_expr: "request.variables.routeId", details: $details })
}

mutation AddRouteStop($schoolId: UUID!, $id: UUID!, $routeId: UUID!, $sequence: Int!, $name: String!, $latMicro: Int, $lngMicro: Int, $arrivalTime: String, $actorId: String!) @auth(level: NO_ACCESS) @transaction {
  query {
    actor: schoolMembers(where: {schoolId: {eq: $schoolId}, userId: {eq: $actorId}, status: {eq: ACTIVE}}) @check(expr: "this.size() == 1", message: "actor is not an active member of this school") { userId }
    route: transportRoutes(where: {id: {eq: $routeId}, schoolId: {eq: $schoolId}}) @check(expr: "this.size() == 1", message: "route not found in this school") { id }
  }
  routeStop_insert(data: { id: $id, schoolId: $schoolId, routeId: $routeId, sequence: $sequence, name: $name, latMicro: $latMicro, lngMicro: $lngMicro, arrivalTime: $arrivalTime })
}

# ---- Student assignment (P5-4b)
mutation SetStudentRoute($schoolId: UUID!, $id: UUID!, $studentId: UUID!, $routeId: UUID!, $stopId: UUID!, $direction: RouteDirection!, $actorId: String!, $details: Any) @auth(level: NO_ACCESS) @transaction {
  query {
    actor: schoolMembers(where: {schoolId: {eq: $schoolId}, userId: {eq: $actorId}, status: {eq: ACTIVE}}) @check(expr: "this.size() == 1", message: "actor is not an active member of this school") { userId }
    student: students(where: {id: {eq: $studentId}, schoolId: {eq: $schoolId}, status: {eq: ACTIVE}}) @check(expr: "this.size() == 1", message: "active student not found in this school") { id }
    route: transportRoutes(where: {id: {eq: $routeId}, schoolId: {eq: $schoolId}, direction: {eq: $direction}}) @check(expr: "this.size() == 1", message: "route of that direction not found in this school") { id }
    stop: routeStops(where: {id: {eq: $stopId}, routeId: {eq: $routeId}, schoolId: {eq: $schoolId}}) @check(expr: "this.size() == 1", message: "stop not found on that route") { id }
  }
  studentRoute_upsert(data: { id: $id, schoolId: $schoolId, studentId: $studentId, routeId: $routeId, stopId: $stopId, direction: $direction })
  auditLog_insert(data: { schoolId: $schoolId, actorId: $actorId, action: "transport.student.assign", entityType: "StudentRoute", entityId_expr: "request.variables.id", details: $details })
}

mutation RemoveStudentRoute($schoolId: UUID!, $id: UUID!, $actorId: String!, $details: Any) @auth(level: NO_ACCESS) @transaction {
  query {
    actor: schoolMembers(where: {schoolId: {eq: $schoolId}, userId: {eq: $actorId}, status: {eq: ACTIVE}}) @check(expr: "this.size() == 1", message: "actor is not an active member of this school") { userId }
    seat: studentRoutes(where: {id: {eq: $id}, schoolId: {eq: $schoolId}}) @check(expr: "this.size() == 1", message: "no such seat in this school") { id }
  }
  studentRoute_delete(id: $id)
  auditLog_insert(data: { schoolId: $schoolId, actorId: $actorId, action: "transport.student.unassign", entityType: "StudentRoute", entityId_expr: "request.variables.id", details: $details })
}

# ---- Student leave (P5-10, ADR-0016)

mutation CreateStudentLeave($schoolId: UUID!, $id: UUID!, $studentId: UUID!, $clientId: String!, $startDate: Date!, $endDate: Date!, $half: String, $reason: String!, $notice: Any, $actorId: String!, $details: Any) @auth(level: NO_ACCESS) @transaction {
  query {
    actor: schoolMembers(where: {schoolId: {eq: $schoolId}, userId: {eq: $actorId}, schoolRole: {eq: PARENT}, status: {eq: ACTIVE}}) @check(expr: "this.size() == 1", message: "only a parent of this school can ask leave for a child") { userId }
    link: parentLinks(where: {schoolId: {eq: $schoolId}, studentId: {eq: $studentId}, userId: {eq: $actorId}}) @check(expr: "this.size() == 1", message: "that child is not linked to this account") { id }
    student: students(where: {id: {eq: $studentId}, schoolId: {eq: $schoolId}, status: {eq: ACTIVE}}) @check(expr: "this.size() == 1", message: "active student not found in this school") { id }
    overlap: studentLeaves(where: {schoolId: {eq: $schoolId}, studentId: {eq: $studentId}, status: {in: [PENDING, APPROVED]}, startDate: {le: $endDate}, endDate: {ge: $startDate}}) @check(expr: "this.size() == 0", message: "that child already has leave on some of these days") { id }
  }
  studentLeave_insert(data: { id: $id, schoolId: $schoolId, studentId: $studentId, requestedById: $actorId, clientId: $clientId, startDate: $startDate, endDate: $endDate, half: $half, reason: $reason })
  auditLog_insert(data: { schoolId: $schoolId, actorId: $actorId, action: "studentleave.request", entityType: "StudentLeave", entityId_expr: "request.variables.id", details: $details })
}

mutation CreateStudentLeaveNotifyTeacher($schoolId: UUID!, $id: UUID!, $studentId: UUID!, $clientId: String!, $startDate: Date!, $endDate: Date!, $half: String, $reason: String!, $teacherStaffId: UUID!, $notice: Any, $actorId: String!, $details: Any) @auth(level: NO_ACCESS) @transaction {
  query {
    actor: schoolMembers(where: {schoolId: {eq: $schoolId}, userId: {eq: $actorId}, schoolRole: {eq: PARENT}, status: {eq: ACTIVE}}) @check(expr: "this.size() == 1", message: "only a parent of this school can ask leave for a child") { userId }
    link: parentLinks(where: {schoolId: {eq: $schoolId}, studentId: {eq: $studentId}, userId: {eq: $actorId}}) @check(expr: "this.size() == 1", message: "that child is not linked to this account") { id }
    student: students(where: {id: {eq: $studentId}, schoolId: {eq: $schoolId}, status: {eq: ACTIVE}}) @check(expr: "this.size() == 1", message: "active student not found in this school") { id }
    overlap: studentLeaves(where: {schoolId: {eq: $schoolId}, studentId: {eq: $studentId}, status: {in: [PENDING, APPROVED]}, startDate: {le: $endDate}, endDate: {ge: $startDate}}) @check(expr: "this.size() == 0", message: "that child already has leave on some of these days") { id }
  }
  studentLeave_insert(data: { id: $id, schoolId: $schoolId, studentId: $studentId, requestedById: $actorId, clientId: $clientId, startDate: $startDate, endDate: $endDate, half: $half, reason: $reason })
  n1: notification_insert(data: { schoolId: $schoolId, kind: "studentleave.requested", params: $notice, entityType: "StudentLeave", entityId_expr: "request.variables.id", recipientStaffId: $teacherStaffId })
  auditLog_insert(data: { schoolId: $schoolId, actorId: $actorId, action: "studentleave.request", entityType: "StudentLeave", entityId_expr: "request.variables.id", details: $details })
}

# The class teacher of the child's class (checked in the gateway) or the Academic admin decides; the first decision stands. The parent is told, in the same transaction.
mutation DecideStudentLeave($schoolId: UUID!, $id: UUID!, $status: StudentLeaveStatus!, $note: String, $kind: String!, $parentUserId: String!, $notice: Any, $actorId: String!, $details: Any) @auth(level: NO_ACCESS) @transaction {
  query {
    actor: schoolMembers(where: {schoolId: {eq: $schoolId}, userId: {eq: $actorId}, schoolRole: {in: [ACADEMIC_ADMIN, TEACHER]}, status: {eq: ACTIVE}}) @check(expr: "this.size() == 1", message: "only a teacher or the Academic admin of this school can decide student leave") { userId }
    request: studentLeaves(where: {id: {eq: $id}, schoolId: {eq: $schoolId}, status: {eq: PENDING}, requestedById: {eq: $parentUserId}}) @check(expr: "this.size() == 1", message: "request not found in this school or no longer waiting") { id }
  }
  studentLeave_update(id: $id, data: { status: $status, decidedById: $actorId, decidedAt_expr: "request.time", updatedAt_expr: "request.time", decisionNote: $note })
  n1: notification_insert(data: { schoolId: $schoolId, kind: $kind, params: $notice, entityType: "StudentLeave", entityId_expr: "request.variables.id", recipientUserId: $parentUserId })
  auditLog_insert(data: { schoolId: $schoolId, actorId: $actorId, action: "studentleave.decide", entityType: "StudentLeave", entityId_expr: "request.variables.id", details: $details })
}

# The parent withdraws a request that is still waiting.
mutation CancelStudentLeave($schoolId: UUID!, $id: UUID!, $actorId: String!, $details: Any) @auth(level: NO_ACCESS) @transaction {
  query {
    actor: schoolMembers(where: {schoolId: {eq: $schoolId}, userId: {eq: $actorId}, schoolRole: {eq: PARENT}, status: {eq: ACTIVE}}) @check(expr: "this.size() == 1", message: "only a parent of this school can cancel") { userId }
    request: studentLeaves(where: {id: {eq: $id}, schoolId: {eq: $schoolId}, status: {eq: PENDING}, requestedById: {eq: $actorId}}) @check(expr: "this.size() == 1", message: "no waiting request of yours with that id") { id }
  }
  studentLeave_update(id: $id, data: { status: CANCELLED, updatedAt_expr: "request.time" })
  auditLog_insert(data: { schoolId: $schoolId, actorId: $actorId, action: "studentleave.cancel", entityType: "StudentLeave", entityId_expr: "request.variables.id", details: $details })
}


# ---- Learning resources (P5-11a, ADR-0016). The gateway has checked that the teacher teaches this subject in this class; the database checks that the pieces exist in this school.
mutation AddLearningResource($schoolId: UUID!, $id: UUID!, $classroomId: UUID!, $academicYearId: UUID!, $subjectId: UUID!, $title: String!, $note: String, $fileKey: String!, $fileName: String!, $contentType: String!, $sizeBytes: Int!, $actorId: String!, $details: Any) @auth(level: NO_ACCESS) @transaction {
  query {
    actor: schoolMembers(where: {schoolId: {eq: $schoolId}, userId: {eq: $actorId}, schoolRole: {in: [ACADEMIC_ADMIN, TEACHER]}, status: {eq: ACTIVE}}) @check(expr: "this.size() == 1", message: "only a teacher or the Academic admin of this school can share a resource") { userId }
    classroom: classrooms(where: {id: {eq: $classroomId}, schoolId: {eq: $schoolId}}) @check(expr: "this.size() == 1", message: "class not found in this school") { id }
    year: academicYears(where: {id: {eq: $academicYearId}, schoolId: {eq: $schoolId}}) @check(expr: "this.size() == 1", message: "academic year not found in this school") { id }
    subject: subjects(where: {id: {eq: $subjectId}, schoolId: {eq: $schoolId}}) @check(expr: "this.size() == 1", message: "subject not found in this school") { id }
  }
  learningResource_insert(data: { id: $id, schoolId: $schoolId, classroomId: $classroomId, academicYearId: $academicYearId, subjectId: $subjectId, title: $title, note: $note, fileKey: $fileKey, fileName: $fileName, contentType: $contentType, sizeBytes: $sizeBytes, uploadedById: $actorId })
  auditLog_insert(data: { schoolId: $schoolId, actorId: $actorId, action: "resource.add", entityType: "LearningResource", entityId_expr: "request.variables.id", details: $details })
}

# Removal keeps the row (the audit trail points at it); the gateway then deletes the stored file.
mutation RemoveLearningResource($schoolId: UUID!, $id: UUID!, $actorId: String!, $details: Any) @auth(level: NO_ACCESS) @transaction {
  query {
    actor: schoolMembers(where: {schoolId: {eq: $schoolId}, userId: {eq: $actorId}, schoolRole: {in: [ACADEMIC_ADMIN, TEACHER]}, status: {eq: ACTIVE}}) @check(expr: "this.size() == 1", message: "only a teacher or the Academic admin of this school can remove a resource") { userId }
    resource: learningResources(where: {id: {eq: $id}, schoolId: {eq: $schoolId}, removedAt: {isNull: true}}) @check(expr: "this.size() == 1", message: "resource not found in this school or already removed") { id }
  }
  learningResource_update(id: $id, data: { removedAt_expr: "request.time", updatedAt_expr: "request.time" })
  auditLog_insert(data: { schoolId: $schoolId, actorId: $actorId, action: "resource.remove", entityType: "LearningResource", entityId_expr: "request.variables.id", details: $details })
}
