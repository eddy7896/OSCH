# Create a new Academic Year
mutation CreateAcademicYear($schoolId: UUID!, $name: String!, $startDate: Date!, $endDate: Date!) @auth(level: NO_ACCESS) {
  academicYear_insert(data: {
    schoolId: $schoolId,
    name: $name,
    startDate: $startDate,
    endDate: $endDate
  })
}

# Seed database
mutation CreateSchool($id: UUID!, $name: String!, $subDomain: String!) @auth(level: NO_ACCESS) {
  school_insert(data: { id: $id, name: $name, subDomain: $subDomain })
}

mutation CreateUser($id: String!, $email: String!, $globalRole: GlobalRole!) @auth(level: NO_ACCESS) {
