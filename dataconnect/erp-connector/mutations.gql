# A starting bell schedule in ONE transaction (all or nothing, one audit row), only for a school that has no periods yet.
mutation ApplyStandardSchedule($schoolId: UUID!, $actorId: String!, $details: Any) @auth(level: NO_ACCESS) @transaction {
  query {
    actor: schoolMembers(where: {schoolId: {eq: $schoolId}, userId: {eq: $actorId}, status: {eq: ACTIVE}}) @check(expr: "this.size() == 1", message: "actor is not an active member of this school") { userId }
    existing: periods(where: {schoolId: {eq: $schoolId}}) @check(expr: "this.size() == 0", message: "the school already has periods") { id }
  }
  p1: period_insert(data: { schoolId: $schoolId, label: "Period 1", startTime: "08:30", endTime: "09:10", isBreak: false })
  p2: period_insert(data: { schoolId: $schoolId, label: "Period 2", startTime: "09:10", endTime: "09:50", isBreak: false })
  p3: period_insert(data: { schoolId: $schoolId, label: "Short break", startTime: "09:50", endTime: "10:10", isBreak: true })
  p4: period_insert(data: { schoolId: $schoolId, label: "Period 3", startTime: "10:10", endTime: "10:50", isBreak: false })
  p5: period_insert(data: { schoolId: $schoolId, label: "Period 4", startTime: "10:50", endTime: "11:30", isBreak: false })
  p6: period_insert(data: { schoolId: $schoolId, label: "Period 5", startTime: "11:30", endTime: "12:10", isBreak: false })
  p7: period_insert(data: { schoolId: $schoolId, label: "Lunch", startTime: "12:10", endTime: "12:50", isBreak: true })
  p8: period_insert(data: { schoolId: $schoolId, label: "Period 6", startTime: "12:50", endTime: "13:30", isBreak: false })
  p9: period_insert(data: { schoolId: $schoolId, label: "Period 7", startTime: "13:30", endTime: "14:10", isBreak: false })
  p10: period_insert(data: { schoolId: $schoolId, label: "Period 8", startTime: "14:10", endTime: "14:50", isBreak: false })
  auditLog_insert(data: { schoolId: $schoolId, actorId: $actorId, action: "academic.schedule.template", entityType: "School", entityId_expr: "request.variables.schoolId", details: $details })
}

