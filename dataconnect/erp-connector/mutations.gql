  studentEnrollment_updateMany(where: {studentId: {eq: $studentId}, academicYearId: {eq: $academicYearId}, schoolId: {eq: $schoolId}}, data: { classroomId: $classroomId })
  auditLog_insert(data: { schoolId: $schoolId, actorId: $actorId, action: "student.move", entityType: "Student", entityId_expr: "request.variables.studentId", details: $details })
