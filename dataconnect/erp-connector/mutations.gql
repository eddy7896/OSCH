  }
  staffProfile_update(id: $id, data: { firstName: $firstName, lastName: $lastName, department: $department, designation: $designation, phone: $phone, email: $email, dateOfBirth: $dateOfBirth, gender: $gender, dateOfJoining: $dateOfJoining, address: $address, emergencyContactName: $emergencyContactName, emergencyContactPhone: $emergencyContactPhone, status: $status })
