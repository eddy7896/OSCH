    exam: exams(where: {id: {eq: $id}, schoolId: {eq: $schoolId}}) @check(expr: "this.size() == 1", message: "exam not found in this school") { id }
    marks: marks(where: {examId: {eq: $id}, schoolId: {eq: $schoolId}}) @check(expr: "this.size() == 0", message: "the exam already has marks") { id }
  }
  exam_delete(id: $id)
  auditLog_insert(data: { schoolId: $schoolId, actorId: $actorId, action: "grades.exam.delete", entityType: "Exam", entityId_expr: "request.variables.id", details: $details })
}

# Marks entry is: save each mark (no audit of its own), then FinishMarkEntry, the commit point with the one audit row. A mark above the exam's maximum
# is refused by the database. The student must be in the exam's class in the term's year.
mutation SaveMark($schoolId: UUID!, $id: UUID!, $examId: UUID!, $studentId: UUID!, $classroomId: UUID!, $academicYearId: UUID!, $tenths: Int!, $absent: Boolean!, $actorId: String!) @auth(level: NO_ACCESS) @transaction {
  query {
    actor: schoolMembers(where: {schoolId: {eq: $schoolId}, userId: {eq: $actorId}, status: {eq: ACTIVE}}) @check(expr: "this.size() == 1", message: "actor is not an active member of this school") { userId }
    exam: exams(where: {id: {eq: $examId}, schoolId: {eq: $schoolId}, classroomId: {eq: $classroomId}, term: {academicYearId: {eq: $academicYearId}}, maxTenths: {ge: $tenths}}) @check(expr: "this.size() == 1", message: "exam not found for this class, or the mark is above its maximum") { id }
    placed: studentEnrollments(where: {studentId: {eq: $studentId}, schoolId: {eq: $schoolId}, classroomId: {eq: $classroomId}, academicYearId: {eq: $academicYearId}}) @check(expr: "this.size() == 1", message: "student is not in this class") { id }
  }
  mark_upsert(data: { id: $id, schoolId: $schoolId, examId: $examId, studentId: $studentId, tenths: $tenths, absent: $absent, updatedAt_expr: "request.time" })
}

mutation RemoveMark($schoolId: UUID!, $id: UUID!, $examId: UUID!, $classroomId: UUID!, $actorId: String!) @auth(level: NO_ACCESS) @transaction {
  query {
    actor: schoolMembers(where: {schoolId: {eq: $schoolId}, userId: {eq: $actorId}, status: {eq: ACTIVE}}) @check(expr: "this.size() == 1", message: "actor is not an active member of this school") { userId }
    exam: exams(where: {id: {eq: $examId}, schoolId: {eq: $schoolId}, classroomId: {eq: $classroomId}}) @check(expr: "this.size() == 1", message: "exam not found for this class") { id }
    mark: marks(where: {id: {eq: $id}, schoolId: {eq: $schoolId}, examId: {eq: $examId}}) @check(expr: "this.size() == 1", message: "mark not found on this exam") { id }
  }
  mark_delete(id: $id)
  tombstone_insert(data: { schoolId: $schoolId, entityType: "Mark", entityId_expr: "request.variables.id", deletedById: $actorId, classroomId: $classroomId })
}

mutation FinishMarkEntry($schoolId: UUID!, $id: UUID!, $submissionId: String, $actorId: String!, $details: Any) @auth(level: NO_ACCESS) @transaction {
  query {
    actor: schoolMembers(where: {schoolId: {eq: $schoolId}, userId: {eq: $actorId}, status: {eq: ACTIVE}}) @check(expr: "this.size() == 1", message: "actor is not an active member of this school") { userId }
    exam: exams(where: {id: {eq: $id}, schoolId: {eq: $schoolId}}) @check(expr: "this.size() == 1", message: "exam not found in this school") { id }
  }
  exam_update(id: $id, data: { lastSubmissionId: $submissionId })
  auditLog_insert(data: { schoolId: $schoolId, actorId: $actorId, action: "grades.marks.save", entityType: "Exam", entityId_expr: "request.variables.id", details: $details })
}

# ---- Leave (P3-6, ADR-0013 decision 7). Only an active Principal can move a request to APPROVED or REJECTED, checked here in the transaction. Approving a PAID request also
# takes its half-days from the person's balance in the same transaction (the balance must still be what the caller saw). Unpaid leave takes nothing.
mutation CreateLeaveType($schoolId: UUID!, $id: UUID!, $name: String!, $paid: Boolean!, $quotaHalfDays: Int!, $actorId: String!, $details: Any) @auth(level: NO_ACCESS) @transaction {
  query {
    actor: schoolMembers(where: {schoolId: {eq: $schoolId}, userId: {eq: $actorId}, status: {eq: ACTIVE}}) @check(expr: "this.size() == 1", message: "actor is not an active member of this school") { userId }
  }
  leaveType_insert(data: { id: $id, schoolId: $schoolId, name: $name, paid: $paid, quotaHalfDays: $quotaHalfDays })
  auditLog_insert(data: { schoolId: $schoolId, actorId: $actorId, action: "leave.type.create", entityType: "LeaveType", entityId_expr: "request.variables.id", details: $details })
}

mutation UpdateLeaveType($schoolId: UUID!, $id: UUID!, $name: String!, $quotaHalfDays: Int!, $actorId: String!, $details: Any) @auth(level: NO_ACCESS) @transaction {
  query {
    actor: schoolMembers(where: {schoolId: {eq: $schoolId}, userId: {eq: $actorId}, status: {eq: ACTIVE}}) @check(expr: "this.size() == 1", message: "actor is not an active member of this school") { userId }
    type: leaveTypes(where: {id: {eq: $id}, schoolId: {eq: $schoolId}}) @check(expr: "this.size() == 1", message: "leave type not found in this school") { id }
  }
  leaveType_update(id: $id, data: { name: $name, quotaHalfDays: $quotaHalfDays })
  auditLog_insert(data: { schoolId: $schoolId, actorId: $actorId, action: "leave.type.update", entityType: "LeaveType", entityId_expr: "request.variables.id", details: $details })
}

mutation DeleteLeaveType($schoolId: UUID!, $id: UUID!, $actorId: String!, $details: Any) @auth(level: NO_ACCESS) @transaction {
  query {
    actor: schoolMembers(where: {schoolId: {eq: $schoolId}, userId: {eq: $actorId}, status: {eq: ACTIVE}}) @check(expr: "this.size() == 1", message: "actor is not an active member of this school") { userId }
    type: leaveTypes(where: {id: {eq: $id}, schoolId: {eq: $schoolId}}) @check(expr: "this.size() == 1", message: "leave type not found in this school") { id }
    used: leaveRequests(where: {leaveTypeId: {eq: $id}, schoolId: {eq: $schoolId}}) @check(expr: "this.size() == 0", message: "the leave type has requests") { id }
  }
  leaveBalance_deleteMany(where: {leaveTypeId: {eq: $id}, schoolId: {eq: $schoolId}})
  leaveType_delete(id: $id)
  auditLog_insert(data: { schoolId: $schoolId, actorId: $actorId, action: "leave.type.delete", entityType: "LeaveType", entityId_expr: "request.variables.id", details: $details })
}

# HR sets what one person may take of a paid type in a year. The balance is made if it is new; otherwise it must still be what HR saw.
mutation CreateLeaveBalance($schoolId: UUID!, $id: UUID!, $staffId: UUID!, $leaveTypeId: UUID!, $academicYearId: UUID!, $allowedHalfDays: Int!, $actorId: String!) @auth(level: NO_ACCESS) @transaction {
  query {
    actor: schoolMembers(where: {schoolId: {eq: $schoolId}, userId: {eq: $actorId}, status: {eq: ACTIVE}}) @check(expr: "this.size() == 1", message: "actor is not an active member of this school") { userId }
    staff: staffProfiles(where: {id: {eq: $staffId}, schoolId: {eq: $schoolId}}) @check(expr: "this.size() == 1", message: "staff member not found in this school") { id }
    type: leaveTypes(where: {id: {eq: $leaveTypeId}, schoolId: {eq: $schoolId}, paid: {eq: true}}) @check(expr: "this.size() == 1", message: "paid leave type not found in this school") { id }
    year: academicYears(where: {id: {eq: $academicYearId}, schoolId: {eq: $schoolId}}) @check(expr: "this.size() == 1", message: "academic year not found in this school") { id }
  }
  leaveBalance_insert(data: { id: $id, schoolId: $schoolId, staffId: $staffId, leaveTypeId: $leaveTypeId, academicYearId: $academicYearId, allowedHalfDays: $allowedHalfDays, remainingHalfDays: $allowedHalfDays })
}

mutation SetLeaveBalance($schoolId: UUID!, $id: UUID!, $expectedRemaining: Int!, $allowedHalfDays: Int!, $remainingHalfDays: Int!, $actorId: String!, $details: Any) @auth(level: NO_ACCESS) @transaction {
  query {
    actor: schoolMembers(where: {schoolId: {eq: $schoolId}, userId: {eq: $actorId}, status: {eq: ACTIVE}}) @check(expr: "this.size() == 1", message: "actor is not an active member of this school") { userId }
    balance: leaveBalances(where: {id: {eq: $id}, schoolId: {eq: $schoolId}, remainingHalfDays: {eq: $expectedRemaining}}) @check(expr: "this.size() == 1", message: "balance not found in this school, or it changed since it was read") { id }
  }
  leaveBalance_update(id: $id, data: { allowedHalfDays: $allowedHalfDays, remainingHalfDays: $remainingHalfDays })
  auditLog_insert(data: { schoolId: $schoolId, actorId: $actorId, action: "leave.balance.set", entityType: "LeaveBalance", entityId_expr: "request.variables.id", details: $details })
}

# A request is the requester's own: the staff record must be linked to the acting account.
mutation CreateLeaveRequest($schoolId: UUID!, $id: UUID!, $staffId: UUID!, $leaveTypeId: UUID!, $startDate: Date!, $endDate: Date!, $half: String, $halfDays: Int!, $reason: String, $clientId: String, $notice: Any, $actorId: String!, $details: Any) @auth(level: NO_ACCESS) @transaction {
  query {
    actor: schoolMembers(where: {schoolId: {eq: $schoolId}, userId: {eq: $actorId}, status: {eq: ACTIVE}}) @check(expr: "this.size() == 1", message: "actor is not an active member of this school") { userId }
    staff: staffProfiles(where: {id: {eq: $staffId}, schoolId: {eq: $schoolId}, userId: {eq: $actorId}, status: {eq: ACTIVE}}) @check(expr: "this.size() == 1", message: "you can only ask for leave for your own staff record") { id }
    type: leaveTypes(where: {id: {eq: $leaveTypeId}, schoolId: {eq: $schoolId}}) @check(expr: "this.size() == 1", message: "leave type not found in this school") { id }
  }
  leaveRequest_insert(data: { id: $id, schoolId: $schoolId, staffId: $staffId, leaveTypeId: $leaveTypeId, startDate: $startDate, endDate: $endDate, half: $half, halfDays: $halfDays, reason: $reason, clientId: $clientId })
  notification_insert(data: { schoolId: $schoolId, kind: "leave.requested", params: $notice, entityType: "LeaveRequest", entityId_expr: "request.variables.id", audienceRole: PRINCIPAL })
  auditLog_insert(data: { schoolId: $schoolId, actorId: $actorId, action: "leave.request.create", entityType: "LeaveRequest", entityId_expr: "request.variables.id", details: $details })
}

mutation CancelLeaveRequest($schoolId: UUID!, $id: UUID!, $staffId: UUID!, $actorId: String!, $details: Any) @auth(level: NO_ACCESS) @transaction {
  query {
    actor: schoolMembers(where: {schoolId: {eq: $schoolId}, userId: {eq: $actorId}, status: {eq: ACTIVE}}) @check(expr: "this.size() == 1", message: "actor is not an active member of this school") { userId }
    staff: staffProfiles(where: {id: {eq: $staffId}, schoolId: {eq: $schoolId}, userId: {eq: $actorId}}) @check(expr: "this.size() == 1", message: "only the person who asked can cancel") { id }
    request: leaveRequests(where: {id: {eq: $id}, schoolId: {eq: $schoolId}, staffId: {eq: $staffId}, status: {eq: PENDING}}) @check(expr: "this.size() == 1", message: "request not found or no longer pending") { id }
  }
  leaveRequest_update(id: $id, data: { status: CANCELLED, updatedAt_expr: "request.time" })
  auditLog_insert(data: { schoolId: $schoolId, actorId: $actorId, action: "leave.request.cancel", entityType: "LeaveRequest", entityId_expr: "request.variables.id", details: $details })
}

mutation ApproveLeaveRequest($schoolId: UUID!, $id: UUID!, $staffId: UUID!, $balanceId: UUID!, $halfDays: Int!, $expectedRemaining: Int!, $newRemaining: Int!, $notice: Any, $actorId: String!, $details: Any) @auth(level: NO_ACCESS) @transaction {
  query {
    actor: schoolMembers(where: {schoolId: {eq: $schoolId}, userId: {eq: $actorId}, schoolRole: {eq: PRINCIPAL}, status: {eq: ACTIVE}}) @check(expr: "this.size() == 1", message: "only the Principal of this school can decide leave") { userId }
    request: leaveRequests(where: {id: {eq: $id}, schoolId: {eq: $schoolId}, staffId: {eq: $staffId}, status: {eq: PENDING}, halfDays: {eq: $halfDays}, leaveType: {paid: {eq: true}}}) @check(expr: "this.size() == 1", message: "paid request not found in this school or no longer pending") { id }
    balance: leaveBalances(where: {id: {eq: $balanceId}, schoolId: {eq: $schoolId}, remainingHalfDays: {eq: $expectedRemaining}}) @check(expr: "this.size() == 1", message: "balance not found, or it changed since it was read") { id }
  }
  leaveBalance_update(id: $balanceId, data: { remainingHalfDays: $newRemaining })
  leaveRequest_update(id: $id, data: { status: APPROVED, decidedById: $actorId, decidedAt_expr: "request.time", updatedAt_expr: "request.time" })
  n1: notification_insert(data: { schoolId: $schoolId, kind: "leave.approved", params: $notice, entityType: "LeaveRequest", entityId_expr: "request.variables.id", recipientStaffId: $staffId })
  n2: notification_insert(data: { schoolId: $schoolId, kind: "leave.substitution", params: $notice, entityType: "LeaveRequest", entityId_expr: "request.variables.id", audienceRole: ACADEMIC_ADMIN })
  auditLog_insert(data: { schoolId: $schoolId, actorId: $actorId, action: "leave.request.approve", entityType: "LeaveRequest", entityId_expr: "request.variables.id", details: $details })
}

mutation ApproveUnpaidLeaveRequest($schoolId: UUID!, $id: UUID!, $staffId: UUID!, $notice: Any, $actorId: String!, $details: Any) @auth(level: NO_ACCESS) @transaction {
  query {
    actor: schoolMembers(where: {schoolId: {eq: $schoolId}, userId: {eq: $actorId}, schoolRole: {eq: PRINCIPAL}, status: {eq: ACTIVE}}) @check(expr: "this.size() == 1", message: "only the Principal of this school can decide leave") { userId }
    request: leaveRequests(where: {id: {eq: $id}, schoolId: {eq: $schoolId}, staffId: {eq: $staffId}, status: {eq: PENDING}, leaveType: {paid: {eq: false}}}) @check(expr: "this.size() == 1", message: "unpaid request not found in this school or no longer pending") { id }
  }
  leaveRequest_update(id: $id, data: { status: APPROVED, decidedById: $actorId, decidedAt_expr: "request.time", updatedAt_expr: "request.time" })
  n1: notification_insert(data: { schoolId: $schoolId, kind: "leave.approved", params: $notice, entityType: "LeaveRequest", entityId_expr: "request.variables.id", recipientStaffId: $staffId })
  n2: notification_insert(data: { schoolId: $schoolId, kind: "leave.substitution", params: $notice, entityType: "LeaveRequest", entityId_expr: "request.variables.id", audienceRole: ACADEMIC_ADMIN })
  n3: notification_insert(data: { schoolId: $schoolId, kind: "leave.payroll", params: $notice, entityType: "LeaveRequest", entityId_expr: "request.variables.id", audienceRole: HR_MANAGER })
  auditLog_insert(data: { schoolId: $schoolId, actorId: $actorId, action: "leave.request.approve", entityType: "LeaveRequest", entityId_expr: "request.variables.id", details: $details })
}

mutation RejectLeaveRequest($schoolId: UUID!, $id: UUID!, $staffId: UUID!, $note: String, $notice: Any, $actorId: String!, $details: Any) @auth(level: NO_ACCESS) @transaction {
  query {
    actor: schoolMembers(where: {schoolId: {eq: $schoolId}, userId: {eq: $actorId}, schoolRole: {eq: PRINCIPAL}, status: {eq: ACTIVE}}) @check(expr: "this.size() == 1", message: "only the Principal of this school can decide leave") { userId }
    request: leaveRequests(where: {id: {eq: $id}, schoolId: {eq: $schoolId}, staffId: {eq: $staffId}, status: {eq: PENDING}}) @check(expr: "this.size() == 1", message: "request not found in this school or no longer pending") { id }
  }
  leaveRequest_update(id: $id, data: { status: REJECTED, decidedById: $actorId, decidedAt_expr: "request.time", decisionNote: $note, updatedAt_expr: "request.time" })
  notification_insert(data: { schoolId: $schoolId, kind: "leave.rejected", params: $notice, entityType: "LeaveRequest", entityId_expr: "request.variables.id", recipientStaffId: $staffId })
  auditLog_insert(data: { schoolId: $schoolId, actorId: $actorId, action: "leave.request.reject", entityType: "LeaveRequest", entityId_expr: "request.variables.id", details: $details })
