mutation DeleteGradeLevel($schoolId: UUID!, $id: UUID!, $actorId: String!, $details: Any) @auth(level: NO_ACCESS) @transaction {
  query {
    actor: schoolMembers(where: {schoolId: {eq: $schoolId}, userId: {eq: $actorId}, status: {eq: ACTIVE}}) @check(expr: "this.size() == 1", message: "actor is not an active member of this school") { userId }
    level: gradeLevels(where: {id: {eq: $id}, schoolId: {eq: $schoolId}}) @check(expr: "this.size() == 1", message: "class level not found in this school") { id }
    classes: classrooms(where: {gradeLevelId: {eq: $id}, schoolId: {eq: $schoolId}}) @check(expr: "this.size() == 0", message: "this class level still has classes") { id }
  }
  gradeLevel_delete(id: $id)
  auditLog_insert(data: { schoolId: $schoolId, actorId: $actorId, action: "academic.gradelevel.delete", entityType: "GradeLevel", entityId_expr: "request.variables.id", details: $details })
}

