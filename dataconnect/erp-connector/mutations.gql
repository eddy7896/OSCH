    route: transportRoutes(where: {id: {eq: $id}, schoolId: {eq: $schoolId}}) @check(expr: "this.size() == 1", message: "route not found in this school") { id }
  }
  studentRoute_deleteMany(where: {routeId: {eq: $id}, schoolId: {eq: $schoolId}})
