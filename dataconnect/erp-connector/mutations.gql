# Links a parent's account (an ACTIVE member of this school with the PARENT role) to a student: this is what gives that parent the `linked` scope.
mutation LinkParentAccount($schoolId: UUID!, $id: UUID!, $studentId: UUID!, $userId: String!, $relationship: String!, $actorId: String!, $details: Any) @auth(level: NO_ACCESS) @transaction {
  query {
    actor: schoolMembers(where: {schoolId: {eq: $schoolId}, userId: {eq: $actorId}, status: {eq: ACTIVE}}) @check(expr: "this.size() == 1", message: "actor is not an active member of this school") { userId }
    student: students(where: {id: {eq: $studentId}, schoolId: {eq: $schoolId}}) @check(expr: "this.size() == 1", message: "student not found in this school") { id }
    parent: schoolMembers(where: {schoolId: {eq: $schoolId}, userId: {eq: $userId}, schoolRole: {eq: PARENT}, status: {eq: ACTIVE}}) @check(expr: "this.size() == 1", message: "that account is not an active parent of this school") { userId }
  }
  parentLink_insert(data: { id: $id, schoolId: $schoolId, studentId: $studentId, userId: $userId, relationship: $relationship })
  auditLog_insert(data: { schoolId: $schoolId, actorId: $actorId, action: "student.parent.link", entityType: "ParentLink", entityId_expr: "request.variables.id", details: $details })
}

mutation UnlinkParentAccount($schoolId: UUID!, $id: UUID!, $actorId: String!, $details: Any) @auth(level: NO_ACCESS) @transaction {
  query {
    actor: schoolMembers(where: {schoolId: {eq: $schoolId}, userId: {eq: $actorId}, status: {eq: ACTIVE}}) @check(expr: "this.size() == 1", message: "actor is not an active member of this school") { userId }
    link: parentLinks(where: {id: {eq: $id}, schoolId: {eq: $schoolId}}) @check(expr: "this.size() == 1", message: "parent link not found in this school") { id }
  }
  parentLink_delete(id: $id)
  auditLog_insert(data: { schoolId: $schoolId, actorId: $actorId, action: "student.parent.unlink", entityType: "ParentLink", entityId_expr: "request.variables.id", details: $details })
}

# ---- Timetable (P3-3). The teacher must be active and must teach the subject; the period must be a teaching period; the unique keys refuse a clash.
mutation CreateTimetableEntry($schoolId: UUID!, $id: UUID!, $academicYearId: UUID!, $classroomId: UUID!, $subjectId: UUID!, $staffId: UUID!, $day: String!, $periodId: UUID!, $actorId: String!, $details: Any) @auth(level: NO_ACCESS) @transaction {
  query {
    actor: schoolMembers(where: {schoolId: {eq: $schoolId}, userId: {eq: $actorId}, status: {eq: ACTIVE}}) @check(expr: "this.size() == 1", message: "actor is not an active member of this school") { userId }
    year: academicYears(where: {id: {eq: $academicYearId}, schoolId: {eq: $schoolId}}) @check(expr: "this.size() == 1", message: "academic year not found in this school") { id }
    classroom: classrooms(where: {id: {eq: $classroomId}, schoolId: {eq: $schoolId}}) @check(expr: "this.size() == 1", message: "class not found in this school") { id }
    staff: staffProfiles(where: {id: {eq: $staffId}, schoolId: {eq: $schoolId}, status: {eq: ACTIVE}}) @check(expr: "this.size() == 1", message: "active staff member not found in this school") { id }
    teaches: teacherSubjects(where: {staffId: {eq: $staffId}, subjectId: {eq: $subjectId}, schoolId: {eq: $schoolId}}) @check(expr: "this.size() == 1", message: "that staff member does not teach that subject") { id }
    period: periods(where: {id: {eq: $periodId}, schoolId: {eq: $schoolId}, isBreak: {eq: false}}) @check(expr: "this.size() == 1", message: "teaching period not found in this school") { id }
  }
  timetableEntry_insert(data: { id: $id, schoolId: $schoolId, academicYearId: $academicYearId, classroomId: $classroomId, subjectId: $subjectId, staffId: $staffId, day: $day, periodId: $periodId })
  auditLog_insert(data: { schoolId: $schoolId, actorId: $actorId, action: "academic.timetable.set", entityType: "TimetableEntry", entityId_expr: "request.variables.id", details: $details })
}

mutation UpdateTimetableEntry($schoolId: UUID!, $id: UUID!, $subjectId: UUID!, $staffId: UUID!, $actorId: String!, $details: Any) @auth(level: NO_ACCESS) @transaction {
  query {
    actor: schoolMembers(where: {schoolId: {eq: $schoolId}, userId: {eq: $actorId}, status: {eq: ACTIVE}}) @check(expr: "this.size() == 1", message: "actor is not an active member of this school") { userId }
    entry: timetableEntries(where: {id: {eq: $id}, schoolId: {eq: $schoolId}}) @check(expr: "this.size() == 1", message: "timetable entry not found in this school") { id }
    staff: staffProfiles(where: {id: {eq: $staffId}, schoolId: {eq: $schoolId}, status: {eq: ACTIVE}}) @check(expr: "this.size() == 1", message: "active staff member not found in this school") { id }
    teaches: teacherSubjects(where: {staffId: {eq: $staffId}, subjectId: {eq: $subjectId}, schoolId: {eq: $schoolId}}) @check(expr: "this.size() == 1", message: "that staff member does not teach that subject") { id }
  }
  substitution_deleteMany(where: {timetableEntryId: {eq: $id}, schoolId: {eq: $schoolId}})
  timetableEntry_update(id: $id, data: { subjectId: $subjectId, staffId: $staffId, updatedAt_expr: "request.time" })
  auditLog_insert(data: { schoolId: $schoolId, actorId: $actorId, action: "academic.timetable.set", entityType: "TimetableEntry", entityId_expr: "request.variables.id", details: $details })
}

mutation DeleteTimetableEntry($schoolId: UUID!, $id: UUID!, $classroomId: UUID!, $staffId: UUID!, $actorId: String!, $details: Any) @auth(level: NO_ACCESS) @transaction {
  query {
    actor: schoolMembers(where: {schoolId: {eq: $schoolId}, userId: {eq: $actorId}, status: {eq: ACTIVE}}) @check(expr: "this.size() == 1", message: "actor is not an active member of this school") { userId }
    entry: timetableEntries(where: {id: {eq: $id}, schoolId: {eq: $schoolId}, classroomId: {eq: $classroomId}, staffId: {eq: $staffId}}) @check(expr: "this.size() == 1", message: "timetable entry not found in this school") { id }
  }
  substitution_deleteMany(where: {timetableEntryId: {eq: $id}, schoolId: {eq: $schoolId}})
  timetableEntry_delete(id: $id)
  tombstone_insert(data: { schoolId: $schoolId, entityType: "TimetableEntry", entityId_expr: "request.variables.id", deletedById: $actorId, classroomId: $classroomId, staffId: $staffId })
  auditLog_insert(data: { schoolId: $schoolId, actorId: $actorId, action: "academic.timetable.clear", entityType: "TimetableEntry", entityId_expr: "request.variables.id", details: $details })
}

# ---- Attendance (P3-4). A submit is: make the day if it is new, write the marks, then FINISH it. The finishing operation is the commit point and carries
# the one audit row; replaying a submit repeats the same idempotent writes. $lockedOk is [false] for a teacher (a locked day refuses the write) and
# [false, true] for the Academic admin's correction.
mutation CreateAttendanceDay($schoolId: UUID!, $id: UUID!, $classroomId: UUID!, $date: Date!, $actorId: String!) @auth(level: NO_ACCESS) @transaction {
  query {
    actor: schoolMembers(where: {schoolId: {eq: $schoolId}, userId: {eq: $actorId}, status: {eq: ACTIVE}}) @check(expr: "this.size() == 1", message: "actor is not an active member of this school") { userId }
    classroom: classrooms(where: {id: {eq: $classroomId}, schoolId: {eq: $schoolId}}) @check(expr: "this.size() == 1", message: "class not found in this school") { id }
  }
  attendanceDay_insert(data: { id: $id, schoolId: $schoolId, classroomId: $classroomId, date: $date, submittedById: $actorId })
}

mutation SaveAttendanceMark($schoolId: UUID!, $id: UUID!, $dayId: UUID!, $studentId: UUID!, $classroomId: UUID!, $academicYearId: UUID!, $status: AttendanceStatus!, $note: String, $lockedOk: [Boolean!]!, $actorId: String!) @auth(level: NO_ACCESS) @transaction {
  query {
    actor: schoolMembers(where: {schoolId: {eq: $schoolId}, userId: {eq: $actorId}, status: {eq: ACTIVE}}) @check(expr: "this.size() == 1", message: "actor is not an active member of this school") { userId }
    day: attendanceDays(where: {id: {eq: $dayId}, schoolId: {eq: $schoolId}, classroomId: {eq: $classroomId}, locked: {in: $lockedOk}}) @check(expr: "this.size() == 1", message: "attendance day not found for this class, or it is locked") { id }
