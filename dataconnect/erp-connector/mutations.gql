  }
  gradeLevel_insert(data: { id: $id, schoolId: $schoolId, name: $name, position: $position })
  auditLog_insert(data: { schoolId: $schoolId, actorId: $actorId, action: "academic.gradelevel.create", entityType: "GradeLevel", entityId_expr: "request.variables.id", details: $details })
}

mutation UpdateGradeLevel($schoolId: UUID!, $id: UUID!, $name: String, $position: Int, $actorId: String!, $details: Any) @auth(level: NO_ACCESS) @transaction {
  query {
    actor: schoolMembers(where: {schoolId: {eq: $schoolId}, userId: {eq: $actorId}, status: {eq: ACTIVE}}) @check(expr: "this.size() == 1", message: "actor is not an active member of this school") { userId }
    level: gradeLevels(where: {id: {eq: $id}, schoolId: {eq: $schoolId}}) @check(expr: "this.size() == 1", message: "class level not found in this school") { id }
  }
  gradeLevel_update(id: $id, data: { name: $name, position: $position })
  auditLog_insert(data: { schoolId: $schoolId, actorId: $actorId, action: "academic.gradelevel.update", entityType: "GradeLevel", entityId_expr: "request.variables.id", details: $details })
