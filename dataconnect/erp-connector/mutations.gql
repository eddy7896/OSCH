    level: gradeLevels(where: {id: {eq: $gradeLevelId}, schoolId: {eq: $schoolId}}) @check(expr: "this.size() == 1", message: "class level not found in this school") { id }
  }
  feeStructure_insert(data: { id: $id, schoolId: $schoolId, academicYearId: $academicYearId, gradeLevelId: $gradeLevelId, name: $name })
