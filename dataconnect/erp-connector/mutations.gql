    actor: schoolMembers(where: {schoolId: {eq: $schoolId}, userId: {eq: $actorId}, status: {eq: ACTIVE}}) @check(expr: "this.size() == 1", message: "actor is not an active member of this school") { userId }
  }
  school_update(id: $schoolId, data: { name: $name, address: $address, contactPhone: $contactPhone, contactEmail: $contactEmail, primaryColor: $primaryColor, defaultLanguage: $defaultLanguage })
  auditLog_insert(data: { schoolId: $schoolId, actorId: $actorId, action: "school.profile.update", entityType: "School", entityId_expr: "request.variables.schoolId", details: $details })
}

