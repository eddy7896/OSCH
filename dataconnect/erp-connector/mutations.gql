    line: salaryLines(where: {id: {eq: $id}, schoolId: {eq: $schoolId}}) @check(expr: "this.size() == 1", message: "salary line not found in this school") { id }
  }
  salaryLine_delete(id: $id)
  auditLog_insert(data: { schoolId: $schoolId, actorId: $actorId, action: "payroll.salaryline.remove", entityType: "SalaryLine", entityId_expr: "request.variables.id", details: $details })
}

