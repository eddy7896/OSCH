  }
  payrollRun_insert(data: { id: $id, schoolId: $schoolId, year: $year, month: $month, preparedById: $actorId })
  auditLog_insert(data: { schoolId: $schoolId, actorId: $actorId, action: "payroll.run.create", entityType: "PayrollRun", entityId_expr: "request.variables.id", details: $details })
}

mutation CreatePayslip($schoolId: UUID!, $id: UUID!, $runId: UUID!, $staffId: UUID!, $actorId: String!, $details: Any) @auth(level: NO_ACCESS) @transaction {
  query {
    actor: schoolMembers(where: {schoolId: {eq: $schoolId}, userId: {eq: $actorId}, status: {eq: ACTIVE}}) @check(expr: "this.size() == 1", message: "actor is not an active member of this school") { userId }
