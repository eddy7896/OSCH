# ---- Staff (P2-4). Same number scheme as students: compare the counter with what the gateway read; a taken number aborts, nothing is written.
mutation CreateStaff($schoolId: UUID!, $id: UUID!, $expectedSeq: Int!, $employeeId: String!, $firstName: String!, $lastName: String!, $department: String, $designation: String, $phone: String, $email: String, $dateOfBirth: Date, $gender: Gender, $dateOfJoining: Date, $address: String, $emergencyContactName: String, $emergencyContactPhone: String, $actorId: String!, $details: Any) @auth(level: NO_ACCESS) @transaction {
  query {
    actor: schoolMembers(where: {schoolId: {eq: $schoolId}, userId: {eq: $actorId}, status: {eq: ACTIVE}}) @check(expr: "this.size() == 1", message: "actor is not an active member of this school") { userId }
    counter: schools(where: {id: {eq: $schoolId}, staffSeq: {eq: $expectedSeq}}) @check(expr: "this.size() == 1", message: "staff number was taken, retry") { id }
  }
  school_update(id: $schoolId, data: { staffSeq_update: { inc: 1 } })
  staffProfile_insert(data: { id: $id, schoolId: $schoolId, serial_expr: "request.variables.expectedSeq + 1", employeeId: $employeeId, firstName: $firstName, lastName: $lastName, department: $department, designation: $designation, phone: $phone, email: $email, dateOfBirth: $dateOfBirth, gender: $gender, dateOfJoining: $dateOfJoining, address: $address, emergencyContactName: $emergencyContactName, emergencyContactPhone: $emergencyContactPhone })
  auditLog_insert(data: { schoolId: $schoolId, actorId: $actorId, action: "staff.create", entityType: "StaffProfile", entityId_expr: "request.variables.id", details: $details })
}

mutation UpdateStaff($schoolId: UUID!, $id: UUID!, $firstName: String, $lastName: String, $department: String, $designation: String, $phone: String, $email: String, $dateOfBirth: Date, $gender: Gender, $dateOfJoining: Date, $address: String, $emergencyContactName: String, $emergencyContactPhone: String, $status: StaffStatus, $actorId: String!, $details: Any) @auth(level: NO_ACCESS) @transaction {
