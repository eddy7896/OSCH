# ---- Substitution (P3-7). Every rule the board applies is checked again here: the leave is APPROVED and covers the date for the absent teacher, the lesson is theirs on that
# weekday and period, and the substitute is an active member of staff, someone else, qualified for the subject, free in that period (no lesson of their own, not on approved leave
# that day). A second lesson in the same period on the same date is refused by the unique key.
mutation SetSubstitute($schoolId: UUID!, $id: UUID!, $timetableEntryId: UUID!, $date: Date!, $day: String!, $periodId: UUID!, $subjectId: UUID!, $absentStaffId: UUID!, $leaveRequestId: UUID!, $substituteId: UUID!, $notice: Any, $actorId: String!, $details: Any) @auth(level: NO_ACCESS) @transaction {
  query {
    actor: schoolMembers(where: {schoolId: {eq: $schoolId}, userId: {eq: $actorId}, status: {eq: ACTIVE}}) @check(expr: "this.size() == 1", message: "actor is not an active member of this school") { userId }
    leave: leaveRequests(where: {id: {eq: $leaveRequestId}, schoolId: {eq: $schoolId}, staffId: {eq: $absentStaffId}, status: {eq: APPROVED}, startDate: {le: $date}, endDate: {ge: $date}}) @check(expr: "this.size() == 1", message: "no approved leave covers that date for the absent teacher") { id }
    entry: timetableEntries(where: {id: {eq: $timetableEntryId}, schoolId: {eq: $schoolId}, staffId: {eq: $absentStaffId}, day: {eq: $day}, periodId: {eq: $periodId}, subjectId: {eq: $subjectId}, academicYear: {startDate: {le: $date}, endDate: {ge: $date}}}) @check(expr: "this.size() == 1", message: "that lesson is not the absent teacher's on that day") { id }
    substitute: staffProfiles(where: {_and: [{id: {eq: $substituteId}}, {id: {ne: $absentStaffId}}, {schoolId: {eq: $schoolId}}, {status: {eq: ACTIVE}}]}) @check(expr: "this.size() == 1", message: "the substitute must be another active member of staff of this school") { id }
    qualified: teacherSubjects(where: {staffId: {eq: $substituteId}, subjectId: {eq: $subjectId}, schoolId: {eq: $schoolId}}) @check(expr: "this.size() == 1", message: "the substitute does not teach that subject") { id }
    busy: timetableEntries(where: {staffId: {eq: $substituteId}, schoolId: {eq: $schoolId}, day: {eq: $day}, periodId: {eq: $periodId}, academicYear: {startDate: {le: $date}, endDate: {ge: $date}}}) @check(expr: "this.size() == 0", message: "the substitute has a lesson of their own then") { id }
    away: leaveRequests(where: {staffId: {eq: $substituteId}, schoolId: {eq: $schoolId}, status: {eq: APPROVED}, startDate: {le: $date}, endDate: {ge: $date}}) @check(expr: "this.size() == 0", message: "the substitute is on approved leave that day") { id }
  }
  substitution_upsert(data: { id: $id, schoolId: $schoolId, timetableEntryId: $timetableEntryId, date: $date, periodId: $periodId, substituteId: $substituteId, leaveRequestId: $leaveRequestId, assignedById: $actorId })
  notification_insert(data: { schoolId: $schoolId, kind: "substitution.assigned", params: $notice, entityType: "Substitution", entityId_expr: "request.variables.id", recipientStaffId: $substituteId })
  auditLog_insert(data: { schoolId: $schoolId, actorId: $actorId, action: "academic.substitution.set", entityType: "Substitution", entityId_expr: "request.variables.id", details: $details })
}

mutation ClearSubstitute($schoolId: UUID!, $id: UUID!, $substituteId: UUID!, $classroomId: UUID!, $notice: Any, $actorId: String!, $details: Any) @auth(level: NO_ACCESS) @transaction {
  query {
    actor: schoolMembers(where: {schoolId: {eq: $schoolId}, userId: {eq: $actorId}, status: {eq: ACTIVE}}) @check(expr: "this.size() == 1", message: "actor is not an active member of this school") { userId }
    row: substitutions(where: {id: {eq: $id}, schoolId: {eq: $schoolId}, substituteId: {eq: $substituteId}, timetableEntry: {classroomId: {eq: $classroomId}}}) @check(expr: "this.size() == 1", message: "substitution not found in this school") { id }
  }
  substitution_delete(id: $id)
  notification_insert(data: { schoolId: $schoolId, kind: "substitution.cleared", params: $notice, entityType: "Substitution", entityId_expr: "request.variables.id", recipientStaffId: $substituteId })
  tombstone_insert(data: { schoolId: $schoolId, entityType: "Substitution", entityId_expr: "request.variables.id", deletedById: $actorId, classroomId: $classroomId, staffId: $substituteId })
  auditLog_insert(data: { schoolId: $schoolId, actorId: $actorId, action: "academic.substitution.clear", entityType: "Substitution", entityId_expr: "request.variables.id", details: $details })
}

# ---- Notifications (P3-9): the reader's own marker and preferences. Marking read changes nothing but the reader's own view.
mutation MarkNotificationRead($schoolId: UUID!, $notificationId: UUID!, $role: SchoolRole!, $actorId: String!) @auth(level: NO_ACCESS) @transaction {
  query {
    actor: schoolMembers(where: {schoolId: {eq: $schoolId}, userId: {eq: $actorId}, schoolRole: {eq: $role}, status: {eq: ACTIVE}}) @check(expr: "this.size() == 1", message: "actor is not an active member of this school with that role") { userId }
    note: notifications(where: {_and: [{id: {eq: $notificationId}}, {schoolId: {eq: $schoolId}}, {_or: [{recipientStaff: {userId: {eq: $actorId}}}, {audienceRole: {eq: $role}}]}]}) @check(expr: "this.size() == 1", message: "that notification is not yours") { id }
  }
  notificationRead_upsert(data: { schoolId: $schoolId, notificationId: $notificationId, userId: $actorId })
}

mutation MuteNotificationCategory($schoolId: UUID!, $category: String!, $actorId: String!) @auth(level: NO_ACCESS) @transaction {
  query {
    actor: schoolMembers(where: {schoolId: {eq: $schoolId}, userId: {eq: $actorId}, status: {eq: ACTIVE}}) @check(expr: "this.size() == 1", message: "actor is not an active member of this school") { userId }
  }
  notificationMute_upsert(data: { schoolId: $schoolId, userId: $actorId, category: $category })
}

mutation UnmuteNotificationCategory($schoolId: UUID!, $category: String!, $actorId: String!) @auth(level: NO_ACCESS) @transaction {
  query {
    actor: schoolMembers(where: {schoolId: {eq: $schoolId}, userId: {eq: $actorId}, status: {eq: ACTIVE}}) @check(expr: "this.size() == 1", message: "actor is not an active member of this school") { userId }
  }
  notificationMute_delete(key: { schoolId: $schoolId, userId: $actorId, category: $category })
}

# ---- Devices and push (P4-S2)
mutation RegisterDevice($id: UUID!, $userId: String!, $token: String!, $platform: DevicePlatform!) @auth(level: NO_ACCESS) {
  deviceToken_upsert(data: { id: $id, userId: $userId, token: $token, platform: $platform, lastSeenAt_expr: "request.time" })
}

mutation RemoveDevice($id: UUID!, $userId: String!) @auth(level: NO_ACCESS) {
  deviceToken_deleteMany(where: {id: {eq: $id}, userId: {eq: $userId}})
}

mutation RemoveDevicesById($ids: [UUID!]!) @auth(level: NO_ACCESS) {
  deviceToken_deleteMany(where: {id: {in: $ids}})
}

# The one gateway instance that gets the count of 1 sends the push; a second one that asks finds nothing to claim.
mutation ClaimNotificationPush($schoolId: UUID!, $id: UUID!) @auth(level: NO_ACCESS) {
  notification_updateMany(where: {id: {eq: $id}, schoolId: {eq: $schoolId}, pushedAt: {isNull: true}}, data: { pushedAt_expr: "request.time" })
}

# ---- Announcements (P4-S4)
# One notice per staff role (not parents), in the same transaction as the announcement: all of it or none of it.
mutation PostAnnouncement($schoolId: UUID!, $id: UUID!, $title: String!, $body: String!, $notice: Any!, $actorId: String!, $details: Any) @auth(level: NO_ACCESS) @transaction {
  query {
    actor: schoolMembers(where: {schoolId: {eq: $schoolId}, userId: {eq: $actorId}, status: {eq: ACTIVE}}) @check(expr: "this.size() == 1", message: "actor is not an active member of this school") { userId }
  }
  announcement_insert(data: { id: $id, schoolId: $schoolId, title: $title, body: $body, authorId: $actorId })
  n0: notification_insert(data: { schoolId: $schoolId, kind: "announcement.posted", params: $notice, entityType: "Announcement", entityId_expr: "request.variables.id", audienceRole: PRINCIPAL })
  n1: notification_insert(data: { schoolId: $schoolId, kind: "announcement.posted", params: $notice, entityType: "Announcement", entityId_expr: "request.variables.id", audienceRole: MANAGEMENT })
  n2: notification_insert(data: { schoolId: $schoolId, kind: "announcement.posted", params: $notice, entityType: "Announcement", entityId_expr: "request.variables.id", audienceRole: BURSAR })
  n3: notification_insert(data: { schoolId: $schoolId, kind: "announcement.posted", params: $notice, entityType: "Announcement", entityId_expr: "request.variables.id", audienceRole: ACADEMIC_ADMIN })
  n4: notification_insert(data: { schoolId: $schoolId, kind: "announcement.posted", params: $notice, entityType: "Announcement", entityId_expr: "request.variables.id", audienceRole: SYSTEM_ADMIN })
  n5: notification_insert(data: { schoolId: $schoolId, kind: "announcement.posted", params: $notice, entityType: "Announcement", entityId_expr: "request.variables.id", audienceRole: HR_MANAGER })
  n6: notification_insert(data: { schoolId: $schoolId, kind: "announcement.posted", params: $notice, entityType: "Announcement", entityId_expr: "request.variables.id", audienceRole: ACCOUNTANT })
  n7: notification_insert(data: { schoolId: $schoolId, kind: "announcement.posted", params: $notice, entityType: "Announcement", entityId_expr: "request.variables.id", audienceRole: ADMISSIONS_OFFICER })
  n8: notification_insert(data: { schoolId: $schoolId, kind: "announcement.posted", params: $notice, entityType: "Announcement", entityId_expr: "request.variables.id", audienceRole: TRANSPORT_MANAGER })
  n9: notification_insert(data: { schoolId: $schoolId, kind: "announcement.posted", params: $notice, entityType: "Announcement", entityId_expr: "request.variables.id", audienceRole: OPERATIONS_MANAGER })
  n10: notification_insert(data: { schoolId: $schoolId, kind: "announcement.posted", params: $notice, entityType: "Announcement", entityId_expr: "request.variables.id", audienceRole: TEACHER })
  n11: notification_insert(data: { schoolId: $schoolId, kind: "announcement.posted", params: $notice, entityType: "Announcement", entityId_expr: "request.variables.id", audienceRole: STAFF })
  n12: notification_insert(data: { schoolId: $schoolId, kind: "announcement.posted", params: $notice, entityType: "Announcement", entityId_expr: "request.variables.id", audienceRole: DRIVER })
  auditLog_insert(data: { schoolId: $schoolId, actorId: $actorId, action: "announcement.post", entityType: "Announcement", entityId_expr: "request.variables.id", details: $details })
}

mutation EditAnnouncement($schoolId: UUID!, $id: UUID!, $title: String!, $body: String!, $actorId: String!, $details: Any) @auth(level: NO_ACCESS) @transaction {
  query {
    actor: schoolMembers(where: {schoolId: {eq: $schoolId}, userId: {eq: $actorId}, status: {eq: ACTIVE}}) @check(expr: "this.size() == 1", message: "actor is not an active member of this school") { userId }
    row: announcements(where: {id: {eq: $id}, schoolId: {eq: $schoolId}, withdrawnAt: {isNull: true}}) @check(expr: "this.size() == 1", message: "announcement not found in this school, or withdrawn") { id }
  }
  announcement_update(id: $id, data: { title: $title, body: $body, updatedAt_expr: "request.time" })
  auditLog_insert(data: { schoolId: $schoolId, actorId: $actorId, action: "announcement.edit", entityType: "Announcement", entityId_expr: "request.variables.id", details: $details })
}

mutation WithdrawAnnouncement($schoolId: UUID!, $id: UUID!, $actorId: String!, $details: Any) @auth(level: NO_ACCESS) @transaction {
  query {
    actor: schoolMembers(where: {schoolId: {eq: $schoolId}, userId: {eq: $actorId}, status: {eq: ACTIVE}}) @check(expr: "this.size() == 1", message: "actor is not an active member of this school") { userId }
    row: announcements(where: {id: {eq: $id}, schoolId: {eq: $schoolId}, withdrawnAt: {isNull: true}}) @check(expr: "this.size() == 1", message: "announcement not found in this school, or already withdrawn") { id }
  }
  announcement_update(id: $id, data: { withdrawnAt_expr: "request.time", updatedAt_expr: "request.time" })
