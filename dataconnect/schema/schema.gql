# OruSchools Multi-Tenant Data Connect Schema
#
# Tenancy model (ADR-0001): ONE schema, row-level tenancy. Every tenant table carries a DIRECT `school`
# reference and every operation filters on it. Operations are @auth(level: NO_ACCESS): only the API gateway
# (Admin SDK) may call them.
# Money (ADR-0004 / audit F5): integer MINOR units (paise) in Int64, never Float. Currency/locale live on School.

enum GlobalRole { SUPER_ADMIN USER }

# Must stay in sync with packages/rbac `ROLES` (enforced by evals/spec.test.mjs).
enum SchoolRole { PRINCIPAL MANAGEMENT BURSAR ACADEMIC_ADMIN SYSTEM_ADMIN HR_MANAGER ACCOUNTANT ADMISSIONS_OFFICER TRANSPORT_MANAGER OPERATIONS_MANAGER TEACHER STAFF DRIVER PARENT }

enum SubscriptionStatus { ACTIVE TRIAL SUSPENDED }
enum AcademicYearStatus { PLANNED ACTIVE ARCHIVED }
enum InvoiceStatus { PENDING PAID OVERDUE }
enum PayrollStatus { PENDING PAID }
enum LeaveStatus { PENDING APPROVED REJECTED }
enum MembershipStatus { ACTIVE SUSPENDED }
enum InvitationStatus { PENDING ACCEPTED REVOKED }

type School @table {
  id: UUID! @default(expr: "uuidV4()")
  name: String!
  subDomain: String! @unique
  subscriptionStatus: SubscriptionStatus! @default(value: ACTIVE)
  currency: String! @default(value: "INR") # ISO 4217; amounts are stored in minor units of this currency
  locale: String! @default(value: "en-IN") # drives number/date formatting (design system content rules)
  defaultLanguage: String! @default(value: "en") # a code from packages/i18n; users may choose their own (ADR-0006)
  # The ONE active academic year, by construction (a pointer cannot name two years). AcademicYear.status mirrors it.
  activeAcademicYear: AcademicYear
  enrollmentPrefix: String! @default(value: "S") # first letters of enrolment ids
  studentSeq: Int! @default(value: 0) # last student serial handed out
  staffSeq: Int! @default(value: 0) # last staff serial handed out
  applicationSeq: Int! @default(value: 0) # last admission application serial handed out
  # Profile and branding (P2-1). The colour is a validated #rrggbb (white text on it is at least 4.5:1); the logo key lives under schools/<id>/logo/.
  address: String
  contactPhone: String
  contactEmail: String
  primaryColor: String
  logoKey: String
  createdAt: Timestamp! @default(expr: "request.time")
}

# The global User table, keyed by Firebase Auth UID.
type User @table {
  id: String!
  email: String!
  phoneNumber: String
  displayName: String
  language: String # the user's explicit choice (ADR-0006); null means the school default
  globalRole: GlobalRole! @default(value: USER)
  createdAt: Timestamp! @default(expr: "request.time")
}

# A many-to-many mapping connecting a User to a specific School
# This also stores their role at that school.
type SchoolMember @table(key: ["school", "user"]) {
  school: School!
  user: User!
  schoolRole: SchoolRole!
  status: MembershipStatus! @default(value: ACTIVE) # SUSPENDED keeps the row but the gateway denies the user
  createdAt: Timestamp! @default(expr: "request.time")
}

# An offer to join a school with a role. Only the SHA-256 hash of the secret token is stored (never the token).
# Accepting creates the SchoolMember in the same transaction. Rows are never deleted: REVOKED/ACCEPTED are history.
type Invitation @table {
  id: UUID! @default(expr: "uuidV4()")
  school: School!
  email: String!
  phoneNumber: String
  schoolRole: SchoolRole!
  tokenHash: String! @unique
  status: InvitationStatus! @default(value: PENDING)
  expiresAt: Timestamp!
  createdBy: User!
  acceptedBy: User
  acceptedAt: Timestamp
  createdAt: Timestamp! @default(expr: "request.time")
}

# Student Profile, belonging to a School
enum StudentStatus { ACTIVE INACTIVE LEFT }
enum Gender { FEMALE MALE OTHER }
enum PaymentMethod { CASH CHEQUE BANK_TRANSFER UPI OTHER }
enum ConcessionKind { PERCENT FIXED }
enum ImportStatus { STARTED COMPLETED PARTIAL }
enum ApplicationStatus { SUBMITTED UNDER_REVIEW ACCEPTED REJECTED WITHDRAWN ADMITTED }
enum StaffStatus { ACTIVE INACTIVE LEFT }
enum StaffDocumentKind { APPOINTMENT_LETTER ID_PROOF QUALIFICATION EXPERIENCE MEDICAL OTHER }
enum StudentDocumentKind { BIRTH_CERTIFICATE TRANSFER_CERTIFICATE REPORT_CARD ID_PROOF MEDICAL OTHER }

# ERP: Student. `serial` is the school's running student number (1, 2, 3 ...); the gateway builds `enrollmentId` from the school
# prefix and the serial. Both are unique per school, so two admissions racing for the same number cannot both succeed.
type Student @table @unique(fields: ["school", "enrollmentId"]) @unique(fields: ["school", "serial"]) {
  id: UUID! @default(expr: "uuidV4()")
  school: School!
  firstName: String!
  lastName: String!
  enrollmentId: String!
  serial: Int!
  dateOfBirth: Date
  gender: Gender
  status: StudentStatus! @default(value: ACTIVE)
  admissionDate: Date
  address: String
  photoKey: String # private bucket key (P2-2b)
  createdAt: Timestamp! @default(expr: "request.time")
}

# A student's place in a class for one academic year. One placement per student per year.
type StudentEnrollment @table @unique(fields: ["student", "academicYear"]) {
  id: UUID! @default(expr: "uuidV4()")
  school: School!
  student: Student!
  academicYear: AcademicYear!
  classroom: Classroom!
  createdAt: Timestamp! @default(expr: "request.time")
}

# A file kept for a student (private bucket, key under schools/<school>/students/<student>/documents/). Only the metadata lives here.
type StudentDocument @table @unique(fields: ["school", "fileKey"]) {
  id: UUID! @default(expr: "uuidV4()")
  school: School!
  student: Student!
  kind: StudentDocumentKind!
  fileKey: String!
  fileName: String!
  contentType: String!
  sizeBytes: Int!
  createdAt: Timestamp! @default(expr: "request.time")
}

# ERP: an admission application. Moves SUBMITTED -> UNDER_REVIEW -> ACCEPTED/REJECTED (or WITHDRAWN); an ACCEPTED one is ADMITTED,
# which creates the student in the same transaction (`student` then points at it). The guardian is a CONTACT, not an account.
type Application @table @unique(fields: ["school", "applicationNo"]) @unique(fields: ["school", "serial"]) {
  id: UUID! @default(expr: "uuidV4()")
  school: School!
  applicationNo: String!
  serial: Int!
  status: ApplicationStatus! @default(value: SUBMITTED)
  firstName: String!
  lastName: String!
  dateOfBirth: Date
  gender: Gender
  address: String
  gradeLevel: GradeLevel! # the class level applied for
  academicYear: AcademicYear! # the year applied for
  guardianName: String!
  guardianRelationship: String!
  guardianPhone: String
  guardianEmail: String
  previousSchool: String
  notes: String # internal remarks
  decisionNote: String
  student: Student # set when admitted
  createdAt: Timestamp! @default(expr: "request.time")
}

# A bulk import of one CSV file (students, staff or guardians). The SHA-256 of the file is unique per school and kind, so the same file
# cannot be imported twice. STARTED until the run ends; then COMPLETED or PARTIAL (some rows failed after the checks passed).
type ImportBatch @table @unique(fields: ["school", "kind", "fileHash"]) {
  id: UUID! @default(expr: "uuidV4()")
  school: School!
  kind: String! # students, staff, guardians
  fileHash: String!
  rowCount: Int!
  createdCount: Int! @default(value: 0)
  failedCount: Int! @default(value: 0)
  status: ImportStatus! @default(value: STARTED)
  createdAt: Timestamp! @default(expr: "request.time")
}

# ERP: a member of staff (HR record). Not every member of staff signs in, so the sign-in account is an optional link: `user` is set
# only for someone who is already a member of this school. `serial` and `employeeId` work like the student numbers (unique per school).
type StaffProfile @table @unique(fields: ["school", "employeeId"]) @unique(fields: ["school", "serial"]) @unique(fields: ["school", "user"]) {
  id: UUID! @default(expr: "uuidV4()")
  school: School!
  user: User
  employeeId: String!
  serial: Int!
  firstName: String!
  lastName: String!
  department: String
  designation: String
  phone: String
  email: String
  dateOfBirth: Date
  gender: Gender
  dateOfJoining: Date
  address: String
  emergencyContactName: String
  emergencyContactPhone: String
  status: StaffStatus! @default(value: ACTIVE)
  photoKey: String # private bucket key
  createdAt: Timestamp! @default(expr: "request.time")
}

# A file kept for a member of staff (private bucket, key under schools/<school>/staff/<staff>/documents/).
type StaffDocument @table @unique(fields: ["school", "fileKey"]) {
  id: UUID! @default(expr: "uuidV4()")
  school: School!
  staff: StaffProfile!
  kind: StaffDocumentKind!
  fileKey: String!
  fileName: String!
  contentType: String!
  sizeBytes: Int!
  createdAt: Timestamp! @default(expr: "request.time")
}

# A parent or guardian CONTACT recorded against a student. It is not an account: the person is invited separately (a guardian is
# never auto-created with a password) and ParentGuardian links the account once they accept.
type Guardian @table {
  id: UUID! @default(expr: "uuidV4()")
  school: School!
  student: Student!
  name: String!
  relationship: String! # MOTHER, FATHER, GUARDIAN, OTHER
  phone: String
  email: String
  isPrimary: Boolean! @default(value: false)
  createdAt: Timestamp! @default(expr: "request.time")
}

# A join table mapping a User (Parent) to a Student
type ParentGuardian @table(key: ["student", "user"]) {
  student: Student!
  user: User!
  relationship: String! # "MOTHER", "FATHER", "GUARDIAN"
  createdAt: Timestamp! @default(expr: "request.time")
}

# ERP: Academic Year
type AcademicYear @table {
  id: UUID! @default(expr: "uuidV4()")
  school: School!
  name: String! # e.g. "2026-2027"
  startDate: Date!
  endDate: Date!
  status: AcademicYearStatus! @default(value: PLANNED)
  receiptSeq: Int! @default(value: 0) # last receipt serial handed out for this year (P2-7c)
  createdAt: Timestamp! @default(expr: "request.time")
}

# A class level a school teaches (Nursery, LKG, UKG, 1 to 12 by default; ADR-0012). Ordinary rows: rename, reorder, delete.
type GradeLevel @table @unique(fields: ["school", "name"]) {
  id: UUID! @default(expr: "uuidV4()")
  school: School!
  name: String!
  position: Int! # order in lists
  createdAt: Timestamp! @default(expr: "request.time")
}

# ERP: Classroom = a class group, one section of a grade level ("5 B"). `name` is the display name the gateway builds.
type Classroom @table @unique(fields: ["gradeLevel", "section"]) {
  id: UUID! @default(expr: "uuidV4()")
  school: School!
  gradeLevel: GradeLevel!
  section: String! # "B"
  name: String! # "5 B"
  capacity: Int!
  createdAt: Timestamp! @default(expr: "request.time")
}

# ERP: fees (P2-7a). A fee STRUCTURE is the set of fees one class level pays in one academic year (one structure per year and level).
# It has ITEMS (Tuition, Transport ...), each with one or more INSTALMENTS (an amount due on a date). Money is in minor units (paise).
type FeeStructure @table @unique(fields: ["academicYear", "gradeLevel"]) {
  id: UUID! @default(expr: "uuidV4()")
  school: School!
  academicYear: AcademicYear!
  gradeLevel: GradeLevel!
  name: String!
  createdAt: Timestamp! @default(expr: "request.time")
}

type FeeItem @table @unique(fields: ["structure", "name"]) {
  id: UUID! @default(expr: "uuidV4()")
  school: School!
  structure: FeeStructure!
  name: String!
  createdAt: Timestamp! @default(expr: "request.time")
}

type FeeInstalment @table @unique(fields: ["item", "sequence"]) {
  id: UUID! @default(expr: "uuidV4()")
  school: School!
  item: FeeItem!
  sequence: Int! # 1, 2, 3 ... the order within the item
  label: String # "April", "Term 1"
  amountMinor: Int64!
  dueDate: Date!
  createdAt: Timestamp! @default(expr: "request.time")
}

# A discount for one student in one academic year. PERCENT takes basisPoints (100 = 1%) off every targeted instalment; FIXED takes
# amountMinor off each targeted instalment (never below zero). With no item it applies to every item of the student's structure.
type Concession @table {
  id: UUID! @default(expr: "uuidV4()")
  school: School!
  student: Student!
  academicYear: AcademicYear!
  targetItem: FeeItem
  name: String!
  kind: ConcessionKind!
  basisPoints: Int
  amountMinor: Int64
  createdAt: Timestamp! @default(expr: "request.time")
}

# ERP: Invoice (P2-7b). One invoice per student per fee instalment (unique key: generating twice creates nothing). `amountMinor` is what
# is due (after concessions), `paidMinor` what has been paid so far, both integer paise. A part-paid invoice is still PENDING; PAID means
# paidMinor equals amountMinor. OVERDUE is never stored: it is worked out from the due date when the invoice is read.
type Invoice @table @unique(fields: ["student", "instalment"]) {
  id: UUID! @default(expr: "uuidV4()")
  school: School! # direct tenant reference (was only reachable via Student: audit F4)
  student: Student!
  instalment: FeeInstalment # null for a manual invoice
  academicYear: AcademicYear
  title: String! @default(value: "Fee") # what it is for, copied when the invoice is made ("Tuition - April")
  grossMinor: Int64 # before concessions (null for a manual invoice)
  discountMinor: Int64 # taken off by concessions (null for a manual invoice)
  amountMinor: Int64! # due, in minor units (paise)
  paidMinor: Int64! @default(value: "0")
  dueDate: Date!
  status: InvoiceStatus! @default(value: PENDING)
  createdAt: Timestamp! @default(expr: "request.time")
}

# A fee receipt (P2-7c): one per payment, made in the same transaction as the payment. The number is `R-<year>-<serial>`; the serial comes
# from the academic year's counter and is unique per year, so two receipts can never share a number, and a payment that fails leaves no gap.
# A receipt is never deleted; reversing the payment CANCELS it (it stays, marked).
type Receipt @table @unique(fields: ["academicYear", "serial"]) @unique(fields: ["school", "number"]) @unique(fields: ["payment"]) {
  id: UUID! @default(expr: "uuidV4()")
  school: School!
  academicYear: AcademicYear!
  serial: Int!
  number: String!
  payment: Payment!
  student: Student!
  invoice: Invoice!
  amountMinor: Int64!
  balanceAfterMinor: Int64! # what is still owed on the invoice after this payment
  cancelledAt: Timestamp
  cancelReason: String
  createdAt: Timestamp! @default(expr: "request.time")
}

# A payment against one invoice. Several payments make a part-payment. A payment is never edited or deleted: a mistake is REVERSED
# (kept, marked, and taken back out of the invoice), so the books show both.
type Payment @table {
  id: UUID! @default(expr: "uuidV4()")
  school: School!
  invoice: Invoice!
  student: Student!
  amountMinor: Int64!
  method: PaymentMethod!
  reference: String # cheque number, bank or UPI reference
  paidOn: Date!
  recordedBy: User!
  reversedAt: Timestamp
  reversalReason: String
  createdAt: Timestamp! @default(expr: "request.time")
}

# ERP: Payroll
type Payroll @table {
  id: UUID! @default(expr: "uuidV4()")
  school: School!
  user: User!
  amountMinor: Int64! # minor units (paise)
  payDate: Date!
  status: PayrollStatus! @default(value: PENDING)
  createdAt: Timestamp! @default(expr: "request.time")
}

# Academic: Subject
type Subject @table @unique(fields: ["school", "code"]) {
  id: UUID! @default(expr: "uuidV4()")
  school: School!
  name: String!
  code: String!
  createdAt: Timestamp! @default(expr: "request.time")
}

# Academic: Class Schedule (Timetable Entry)
type ClassSchedule @table {
  id: UUID! @default(expr: "uuidV4()")
  school: School!
  classroom: Classroom!
  subject: Subject!
  teacher: User!
  dayOfWeek: String! # e.g. "MONDAY"
  startTime: String! # e.g. "09:00"
  endTime: String! # e.g. "10:00"
  createdAt: Timestamp! @default(expr: "request.time")
}

# HR/Academic: Leave Request
type LeaveRequest @table {
  id: UUID! @default(expr: "uuidV4()")
  school: School!
  user: User! # The person taking leave
  startDate: Date!
  endDate: Date!
  reason: String
  status: LeaveStatus! @default(value: PENDING)
  substitute: User # Nullable, assigned if approved
  createdAt: Timestamp! @default(expr: "request.time")
}

# Academic: Exam
type Exam @table {
  id: UUID! @default(expr: "uuidV4()")
  school: School!
  classroom: Classroom!
  subject: Subject!
  title: String!
  examDate: Date!
  maxScore: Int!
  createdAt: Timestamp! @default(expr: "request.time")
}

# Append-only audit trail (E-AUD-1): the gateway writes one row per mutating request.
# `school` is null only for platform-level (SUPER_ADMIN) actions. Rows are never updated or deleted by any operation.
type AuditLog @table {
  id: UUID! @default(expr: "uuidV4()")
  school: School
  actor: User!
  action: String! # e.g. "invoice.create"
  entityType: String!
  entityId: String
  details: Any # request metadata; never secrets or full payloads
  createdAt: Timestamp! @default(expr: "request.time")
}
