# OruSchools Multi-Tenant Data Connect Schema
#
# Tenancy model (ADR-0001): ONE schema, row-level tenancy. Every tenant table carries a DIRECT `school`
# reference and every operation filters on it. Operations are @auth(level: NO_ACCESS): only the API gateway
# (Admin SDK) may call them.
# Money (ADR-0004 / audit F5): integer MINOR units (paise) in Int64, never Float. Currency/locale live on School.

enum GlobalRole { SUPER_ADMIN USER }

# Must stay in sync with packages/rbac `ROLES` (enforced by evals/spec.test.mjs).
enum SchoolRole { PRINCIPAL MANAGEMENT BURSAR ACADEMIC_ADMIN SYSTEM_ADMIN HR_MANAGER ACCOUNTANT ADMISSIONS_OFFICER TRANSPORT_MANAGER OPERATIONS_MANAGER TEACHER STAFF DRIVER PARENT }

enum SubscriptionStatus { ACTIVE TRIAL SUSPENDED }
enum AcademicYearStatus { PLANNED ACTIVE ARCHIVED }
enum InvoiceStatus { PENDING PAID OVERDUE }
enum PayrollStatus { PENDING PAID }
enum LeaveStatus { PENDING APPROVED REJECTED }
enum MembershipStatus { ACTIVE SUSPENDED }
enum InvitationStatus { PENDING ACCEPTED REVOKED }

type School @table {
  id: UUID! @default(expr: "uuidV4()")
  name: String!
  subDomain: String! @unique
  subscriptionStatus: SubscriptionStatus! @default(value: ACTIVE)
  currency: String! @default(value: "INR") # ISO 4217; amounts are stored in minor units of this currency
  locale: String! @default(value: "en-IN") # drives number/date formatting (design system content rules)
  defaultLanguage: String! @default(value: "en") # a code from packages/i18n; users may choose their own (ADR-0006)
  # The ONE active academic year, by construction (a pointer cannot name two years). AcademicYear.status mirrors it.
  activeAcademicYear: AcademicYear
  enrollmentPrefix: String! @default(value: "S") # first letters of enrolment ids
  studentSeq: Int! @default(value: 0) # last student serial handed out
  # Profile and branding (P2-1). The colour is a validated #rrggbb (white text on it is at least 4.5:1); the logo key lives under schools/<id>/logo/.
  address: String
  contactPhone: String
  contactEmail: String
  primaryColor: String
  logoKey: String
  createdAt: Timestamp! @default(expr: "request.time")
}

# The global User table, keyed by Firebase Auth UID.
type User @table {
  id: String!
  email: String!
  phoneNumber: String
  displayName: String
  language: String # the user's explicit choice (ADR-0006); null means the school default
  globalRole: GlobalRole! @default(value: USER)
  createdAt: Timestamp! @default(expr: "request.time")
}

# A many-to-many mapping connecting a User to a specific School
# This also stores their role at that school.
type SchoolMember @table(key: ["school", "user"]) {
  school: School!
  user: User!
  schoolRole: SchoolRole!
  status: MembershipStatus! @default(value: ACTIVE) # SUSPENDED keeps the row but the gateway denies the user
  createdAt: Timestamp! @default(expr: "request.time")
}

# An offer to join a school with a role. Only the SHA-256 hash of the secret token is stored (never the token).
# Accepting creates the SchoolMember in the same transaction. Rows are never deleted: REVOKED/ACCEPTED are history.
type Invitation @table {
  id: UUID! @default(expr: "uuidV4()")
  school: School!
  email: String!
  phoneNumber: String
  schoolRole: SchoolRole!
  tokenHash: String! @unique
  status: InvitationStatus! @default(value: PENDING)
  expiresAt: Timestamp!
  createdBy: User!
  acceptedBy: User
  acceptedAt: Timestamp
  createdAt: Timestamp! @default(expr: "request.time")
}

# Student Profile, belonging to a School
enum StudentStatus { ACTIVE INACTIVE LEFT }
enum Gender { FEMALE MALE OTHER }
enum StudentDocumentKind { BIRTH_CERTIFICATE TRANSFER_CERTIFICATE REPORT_CARD ID_PROOF MEDICAL OTHER }

# ERP: Student. `serial` is the school's running student number (1, 2, 3 ...); the gateway builds `enrollmentId` from the school
# prefix and the serial. Both are unique per school, so two admissions racing for the same number cannot both succeed.
type Student @table @unique(fields: ["school", "enrollmentId"]) @unique(fields: ["school", "serial"]) {
  id: UUID! @default(expr: "uuidV4()")
  school: School!
  firstName: String!
  lastName: String!
  enrollmentId: String!
  serial: Int!
  dateOfBirth: Date
  gender: Gender
  status: StudentStatus! @default(value: ACTIVE)
  admissionDate: Date
  address: String
  photoKey: String # private bucket key (P2-2b)
  createdAt: Timestamp! @default(expr: "request.time")
}

# A student's place in a class for one academic year. One placement per student per year.
type StudentEnrollment @table @unique(fields: ["student", "academicYear"]) {
  id: UUID! @default(expr: "uuidV4()")
  school: School!
  student: Student!
  academicYear: AcademicYear!
  classroom: Classroom!
  createdAt: Timestamp! @default(expr: "request.time")
}

# A file kept for a student (private bucket, key under schools/<school>/students/<student>/documents/). Only the metadata lives here.
type StudentDocument @table @unique(fields: ["school", "fileKey"]) {
  id: UUID! @default(expr: "uuidV4()")
  school: School!
  student: Student!
  kind: StudentDocumentKind!
  fileKey: String!
  fileName: String!
  contentType: String!
  sizeBytes: Int!
  createdAt: Timestamp! @default(expr: "request.time")
}

# A parent or guardian CONTACT recorded against a student. It is not an account: the person is invited separately (a guardian is
# never auto-created with a password) and ParentGuardian links the account once they accept.
type Guardian @table {
  id: UUID! @default(expr: "uuidV4()")
  school: School!
  student: Student!
  name: String!
  relationship: String! # MOTHER, FATHER, GUARDIAN, OTHER
  phone: String
  email: String
  isPrimary: Boolean! @default(value: false)
  createdAt: Timestamp! @default(expr: "request.time")
}

# A join table mapping a User (Parent) to a Student
type ParentGuardian @table(key: ["student", "user"]) {
  student: Student!
  user: User!
  relationship: String! # "MOTHER", "FATHER", "GUARDIAN"
  createdAt: Timestamp! @default(expr: "request.time")
}

# ERP: Academic Year
type AcademicYear @table {
  id: UUID! @default(expr: "uuidV4()")
  school: School!
  name: String! # e.g. "2026-2027"
  startDate: Date!
  endDate: Date!
  status: AcademicYearStatus! @default(value: PLANNED)
  createdAt: Timestamp! @default(expr: "request.time")
}

# A class level a school teaches (Nursery, LKG, UKG, 1 to 12 by default; ADR-0012). Ordinary rows: rename, reorder, delete.
type GradeLevel @table @unique(fields: ["school", "name"]) {
  id: UUID! @default(expr: "uuidV4()")
  school: School!
  name: String!
  position: Int! # order in lists
  createdAt: Timestamp! @default(expr: "request.time")
}

# ERP: Classroom = a class group, one section of a grade level ("5 B"). `name` is the display name the gateway builds.
type Classroom @table @unique(fields: ["gradeLevel", "section"]) {
  id: UUID! @default(expr: "uuidV4()")
  school: School!
  gradeLevel: GradeLevel!
  section: String! # "B"
  name: String! # "5 B"
  capacity: Int!
  createdAt: Timestamp! @default(expr: "request.time")
}

# ERP: Invoice
type Invoice @table {
  id: UUID! @default(expr: "uuidV4()")
  school: School! # direct tenant reference (was only reachable via Student: audit F4)
  student: Student!
  amountMinor: Int64! # minor units (paise)
  dueDate: Date!
  status: InvoiceStatus! @default(value: PENDING)
  createdAt: Timestamp! @default(expr: "request.time")
}

# ERP: Payroll
type Payroll @table {
  id: UUID! @default(expr: "uuidV4()")
  school: School!
  user: User!
  amountMinor: Int64! # minor units (paise)
  payDate: Date!
  status: PayrollStatus! @default(value: PENDING)
  createdAt: Timestamp! @default(expr: "request.time")
}

# Academic: Subject
type Subject @table @unique(fields: ["school", "code"]) {
  id: UUID! @default(expr: "uuidV4()")
  school: School!
  name: String!
  code: String!
  createdAt: Timestamp! @default(expr: "request.time")
}

# Academic: Class Schedule (Timetable Entry)
type ClassSchedule @table {
  id: UUID! @default(expr: "uuidV4()")
  school: School!
  classroom: Classroom!
  subject: Subject!
  teacher: User!
  dayOfWeek: String! # e.g. "MONDAY"
  startTime: String! # e.g. "09:00"
  endTime: String! # e.g. "10:00"
  createdAt: Timestamp! @default(expr: "request.time")
}

# HR/Academic: Leave Request
type LeaveRequest @table {
  id: UUID! @default(expr: "uuidV4()")
  school: School!
  user: User! # The person taking leave
  startDate: Date!
  endDate: Date!
  reason: String
  status: LeaveStatus! @default(value: PENDING)
  substitute: User # Nullable, assigned if approved
  createdAt: Timestamp! @default(expr: "request.time")
}

# Academic: Exam
type Exam @table {
  id: UUID! @default(expr: "uuidV4()")
  school: School!
  classroom: Classroom!
  subject: Subject!
  title: String!
  examDate: Date!
  maxScore: Int!
  createdAt: Timestamp! @default(expr: "request.time")
}

# Append-only audit trail (E-AUD-1): the gateway writes one row per mutating request.
# `school` is null only for platform-level (SUPER_ADMIN) actions. Rows are never updated or deleted by any operation.
type AuditLog @table {
  id: UUID! @default(expr: "uuidV4()")
  school: School
  actor: User!
  action: String! # e.g. "invoice.create"
  entityType: String!
  entityId: String
  details: Any # request metadata; never secrets or full payloads
  createdAt: Timestamp! @default(expr: "request.time")
}
