# OruSchools Multi-Tenant Data Connect Schema
#
# Tenancy model (ADR-0001): ONE schema, row-level tenancy. Every tenant table carries a DIRECT `school`
# reference and every operation filters on it. Operations are @auth(level: NO_ACCESS): only the API gateway
# (Admin SDK) may call them.
# Money (ADR-0004 / audit F5): integer MINOR units (paise) in Int64, never Float. Currency/locale live on School.

enum GlobalRole { SUPER_ADMIN USER }

# Must stay in sync with packages/rbac `ROLES` (enforced by evals/spec.test.mjs).
enum SchoolRole { PRINCIPAL MANAGEMENT BURSAR ACADEMIC_ADMIN SYSTEM_ADMIN HR_MANAGER ACCOUNTANT ADMISSIONS_OFFICER TRANSPORT_MANAGER OPERATIONS_MANAGER TEACHER STAFF DRIVER PARENT }

enum SubscriptionStatus { ACTIVE TRIAL SUSPENDED }
enum AcademicYearStatus { PLANNED ACTIVE ARCHIVED }
enum InvoiceStatus { PENDING PAID OVERDUE }
enum LeaveStatus { PENDING APPROVED REJECTED }
enum LeaveRequestStatus { PENDING APPROVED REJECTED CANCELLED } # a new enum, not LeaveStatus + CANCELLED: Postgres refuses to use an enum value added in the same deploy
enum MembershipStatus { ACTIVE SUSPENDED }
enum InvitationStatus { PENDING ACCEPTED REVOKED }

type School @table {
  id: UUID! @default(expr: "uuidV4()")
  name: String!
  subDomain: String! @unique
  subscriptionStatus: SubscriptionStatus! @default(value: ACTIVE)
  currency: String! @default(value: "INR") # ISO 4217; amounts are stored in minor units of this currency
  locale: String! @default(value: "en-IN") # drives number/date formatting (design system content rules)
  defaultLanguage: String! @default(value: "en") # a code from packages/i18n; users may choose their own (ADR-0006)
  # The ONE active academic year, by construction (a pointer cannot name two years). AcademicYear.status mirrors it.
  activeAcademicYear: AcademicYear
  enrollmentPrefix: String! @default(value: "S") # first letters of enrolment ids
  studentSeq: Int! @default(value: 0) # last student serial handed out
  staffSeq: Int! @default(value: 0) # last staff serial handed out
  applicationSeq: Int! @default(value: 0) # last admission application serial handed out
  # The days the school works (P3-1, ADR-0013): comma-separated MON..SUN in week order, never empty (checked in the gateway).
  workingDays: String! @default(value: "MON,TUE,WED,THU,FRI,SAT")
  gradeBands: String! @default(value: "") # the school's own grade bands as JSON text (empty: none set); validated by the gateway (no gaps, no overlap)
  # Profile and branding (P2-1). The colour is a validated #rrggbb (white text on it is at least 4.5:1); the logo key lives under schools/<id>/logo/.
  address: String
  contactPhone: String
  contactEmail: String
  primaryColor: String
  logoKey: String
  # Where the school is (P4-S3, ADR-0014 decision 9): a point, the grounds' radius in metres and a feathered margin around it (the soft ring). All null until the System Admin sets them.
  # Millionths of a degree (about 0.1 m): whole numbers, so the schema holds no floating point at all (evals E-FIN-S1).
  geoLatMicro: Int
  geoLngMicro: Int
  geoRadiusM: Int
  geoMarginM: Int @default(value: 50)
  createdAt: Timestamp! @default(expr: "request.time")
}

# The global User table, keyed by Firebase Auth UID.
type User @table {
  id: String!
  email: String!
  phoneNumber: String
  displayName: String
  language: String # the user's explicit choice (ADR-0006); null means the school default
  globalRole: GlobalRole! @default(value: USER)
  createdAt: Timestamp! @default(expr: "request.time")
}

# A many-to-many mapping connecting a User to a specific School
# This also stores their role at that school.
type SchoolMember @table(key: ["school", "user"]) {
  school: School!
  user: User!
  schoolRole: SchoolRole!
  status: MembershipStatus! @default(value: ACTIVE) # SUSPENDED keeps the row but the gateway denies the user
  createdAt: Timestamp! @default(expr: "request.time")
}

# An offer to join a school with a role. Only the SHA-256 hash of the secret token is stored (never the token).
# Accepting creates the SchoolMember in the same transaction. Rows are never deleted: REVOKED/ACCEPTED are history.
type Invitation @table {
  id: UUID! @default(expr: "uuidV4()")
  school: School!
  email: String!
  phoneNumber: String
  schoolRole: SchoolRole!
  tokenHash: String! @unique
  status: InvitationStatus! @default(value: PENDING)
  expiresAt: Timestamp!
  createdBy: User!
  acceptedBy: User
  acceptedAt: Timestamp
  createdAt: Timestamp! @default(expr: "request.time")
}

# Student Profile, belonging to a School
enum StudentStatus { ACTIVE INACTIVE LEFT }
enum Gender { FEMALE MALE OTHER }
enum SalaryLineKind { EARNING DEDUCTION }
enum PayrollRunStatus { DRAFT APPROVED PAID }
enum PaymentMethod { CASH CHEQUE BANK_TRANSFER UPI OTHER }
enum ConcessionKind { PERCENT FIXED }
enum ImportStatus { STARTED COMPLETED PARTIAL }
enum ApplicationStatus { SUBMITTED UNDER_REVIEW ACCEPTED REJECTED WITHDRAWN ADMITTED }
enum AttendanceStatus { PRESENT ABSENT LATE LEAVE MEDICAL HALF_DAY EXCUSED } # the seven fixed meanings (ADR-0013 decision 2); a school may relabel them, never add or remove one
enum StaffStatus { ACTIVE INACTIVE LEFT }
enum VehicleStatus { ACTIVE OUT_OF_SERVICE }
enum RouteDirection { MORNING AFTERNOON }
enum StaffDocumentKind { APPOINTMENT_LETTER ID_PROOF QUALIFICATION EXPERIENCE MEDICAL OTHER }
enum StudentDocumentKind { BIRTH_CERTIFICATE TRANSFER_CERTIFICATE REPORT_CARD ID_PROOF MEDICAL OTHER }

# ERP: Student. `serial` is the school's running student number (1, 2, 3 ...); the gateway builds `enrollmentId` from the school
# prefix and the serial. Both are unique per school, so two admissions racing for the same number cannot both succeed.
type Student @table @unique(fields: ["school", "enrollmentId"]) @unique(fields: ["school", "serial"]) {
  id: UUID! @default(expr: "uuidV4()")
  school: School!
  firstName: String!
  lastName: String!
  enrollmentId: String!
  serial: Int!
  dateOfBirth: Date
  gender: Gender
  status: StudentStatus! @default(value: ACTIVE)
  admissionDate: Date
  address: String
  photoKey: String # private bucket key (P2-2b)
  createdAt: Timestamp! @default(expr: "request.time")
}

# A student's place in a class for one academic year. One placement per student per year.
type StudentEnrollment @table @unique(fields: ["student", "academicYear"]) {
  id: UUID! @default(expr: "uuidV4()")
  school: School!
  student: Student!
  academicYear: AcademicYear!
  classroom: Classroom!
  createdAt: Timestamp! @default(expr: "request.time")
}

# A file kept for a student (private bucket, key under schools/<school>/students/<student>/documents/). Only the metadata lives here.
type StudentDocument @table @unique(fields: ["school", "fileKey"]) {
  id: UUID! @default(expr: "uuidV4()")
  school: School!
  student: Student!
  kind: StudentDocumentKind!
  fileKey: String!
  fileName: String!
  contentType: String!
  sizeBytes: Int!
  createdAt: Timestamp! @default(expr: "request.time")
}

# ERP: an admission application. Moves SUBMITTED -> UNDER_REVIEW -> ACCEPTED/REJECTED (or WITHDRAWN); an ACCEPTED one is ADMITTED,
# which creates the student in the same transaction (`student` then points at it). The guardian is a CONTACT, not an account.
type Application @table @unique(fields: ["school", "applicationNo"]) @unique(fields: ["school", "serial"]) {
  id: UUID! @default(expr: "uuidV4()")
  school: School!
  applicationNo: String!
  serial: Int!
  status: ApplicationStatus! @default(value: SUBMITTED)
  firstName: String!
  lastName: String!
  dateOfBirth: Date
  gender: Gender
  address: String
  gradeLevel: GradeLevel! # the class level applied for
  academicYear: AcademicYear! # the year applied for
  guardianName: String!
  guardianRelationship: String!
  guardianPhone: String
  guardianEmail: String
  previousSchool: String
  notes: String # internal remarks
  decisionNote: String
  student: Student # set when admitted
  createdAt: Timestamp! @default(expr: "request.time")
}

# A bulk import of one CSV file (students, staff or guardians). The SHA-256 of the file is unique per school and kind, so the same file
# cannot be imported twice. STARTED until the run ends; then COMPLETED or PARTIAL (some rows failed after the checks passed).
type ImportBatch @table @unique(fields: ["school", "kind", "fileHash"]) {
  id: UUID! @default(expr: "uuidV4()")
  school: School!
  kind: String! # students, staff, guardians
  fileHash: String!
  rowCount: Int!
  createdCount: Int! @default(value: 0)
  failedCount: Int! @default(value: 0)
  status: ImportStatus! @default(value: STARTED)
  createdAt: Timestamp! @default(expr: "request.time")
}

# ERP: a member of staff (HR record). Not every member of staff signs in, so the sign-in account is an optional link: `user` is set
# only for someone who is already a member of this school. `serial` and `employeeId` work like the student numbers (unique per school).
type StaffProfile @table @unique(fields: ["school", "employeeId"]) @unique(fields: ["school", "serial"]) @unique(fields: ["school", "user"]) {
  id: UUID! @default(expr: "uuidV4()")
  school: School!
  user: User
  employeeId: String!
  serial: Int!
  firstName: String!
  lastName: String!
  department: String
  designation: String
  phone: String
  email: String
  dateOfBirth: Date
  gender: Gender
  dateOfJoining: Date
  address: String
  emergencyContactName: String
  emergencyContactPhone: String
  status: StaffStatus! @default(value: ACTIVE)
  photoKey: String # private bucket key
  createdAt: Timestamp! @default(expr: "request.time")
}

# A file kept for a member of staff (private bucket, key under schools/<school>/staff/<staff>/documents/).
type StaffDocument @table @unique(fields: ["school", "fileKey"]) {
  id: UUID! @default(expr: "uuidV4()")
  school: School!
  staff: StaffProfile!
  kind: StaffDocumentKind!
  fileKey: String!
  fileName: String!
  contentType: String!
  sizeBytes: Int!
  createdAt: Timestamp! @default(expr: "request.time")
}

# A parent or guardian CONTACT recorded against a student. It is not an account: the person is invited separately (a guardian is
# never auto-created with a password) and ParentGuardian links the account once they accept.
type Guardian @table {
  id: UUID! @default(expr: "uuidV4()")
  school: School!
  student: Student!
  name: String!
  relationship: String! # MOTHER, FATHER, GUARDIAN, OTHER
  phone: String
  email: String
  isPrimary: Boolean! @default(value: false)
  createdAt: Timestamp! @default(expr: "request.time")
}

# Links a parent's sign-in account (a member of the school with the PARENT role) to a student (P3-2). It resolves the parent's `linked` scope:
# which children, and so which classes, they may see. Not the same as `Guardian`, which is only a contact recorded against a student.
type ParentLink @table @unique(fields: ["student", "user"]) {
  id: UUID! @default(expr: "uuidV4()")
  school: School!
  student: Student!
  user: User!
  relationship: String! # MOTHER, FATHER, GUARDIAN, OTHER
  createdAt: Timestamp! @default(expr: "request.time")
}

# ERP: Academic Year
type AcademicYear @table {
  id: UUID! @default(expr: "uuidV4()")
  school: School!
  name: String! # e.g. "2026-2027"
  startDate: Date!
  endDate: Date!
  status: AcademicYearStatus! @default(value: PLANNED)
  receiptSeq: Int! @default(value: 0) # last receipt serial handed out for this year (P2-7c)
  createdAt: Timestamp! @default(expr: "request.time")
}

# A class level a school teaches (Nursery, LKG, UKG, 1 to 12 by default; ADR-0012). Ordinary rows: rename, reorder, delete.
type GradeLevel @table @unique(fields: ["school", "name"]) {
  id: UUID! @default(expr: "uuidV4()")
  school: School!
  name: String!
  position: Int! # order in lists
  createdAt: Timestamp! @default(expr: "request.time")
}

# ERP: Classroom = a class group, one section of a grade level ("5 B"). `name` is the display name the gateway builds.
type Classroom @table @unique(fields: ["gradeLevel", "section"]) {
  id: UUID! @default(expr: "uuidV4()")
  school: School!
  gradeLevel: GradeLevel!
  section: String! # "B"
  name: String! # "5 B"
  capacity: Int!
  createdAt: Timestamp! @default(expr: "request.time")
}

# ERP: fees (P2-7a). A fee STRUCTURE is the set of fees one class level pays in one academic year (one structure per year and level).
# It has ITEMS (Tuition, Transport ...), each with one or more INSTALMENTS (an amount due on a date). Money is in minor units (paise).
type FeeStructure @table @unique(fields: ["academicYear", "gradeLevel"]) {
  id: UUID! @default(expr: "uuidV4()")
  school: School!
  academicYear: AcademicYear!
  gradeLevel: GradeLevel!
  name: String!
  createdAt: Timestamp! @default(expr: "request.time")
}

type FeeItem @table @unique(fields: ["structure", "name"]) {
  id: UUID! @default(expr: "uuidV4()")
  school: School!
  structure: FeeStructure!
  name: String!
  createdAt: Timestamp! @default(expr: "request.time")
}

type FeeInstalment @table @unique(fields: ["item", "sequence"]) {
  id: UUID! @default(expr: "uuidV4()")
  school: School!
  item: FeeItem!
  sequence: Int! # 1, 2, 3 ... the order within the item
  label: String # "April", "Term 1"
  amountMinor: Int64!
  dueDate: Date!
  createdAt: Timestamp! @default(expr: "request.time")
}

# A discount for one student in one academic year. PERCENT takes basisPoints (100 = 1%) off every targeted instalment; FIXED takes
# amountMinor off each targeted instalment (never below zero). With no item it applies to every item of the student's structure.
type Concession @table {
  id: UUID! @default(expr: "uuidV4()")
  school: School!
  student: Student!
  academicYear: AcademicYear!
  targetItem: FeeItem
  name: String!
  kind: ConcessionKind!
  basisPoints: Int
  amountMinor: Int64
  createdAt: Timestamp! @default(expr: "request.time")
}

# ERP: Invoice (P2-7b). One invoice per student per fee instalment (unique key: generating twice creates nothing). `amountMinor` is what
# is due (after concessions), `paidMinor` what has been paid so far, both integer paise. A part-paid invoice is still PENDING; PAID means
# paidMinor equals amountMinor. OVERDUE is never stored: it is worked out from the due date when the invoice is read.
type Invoice @table @unique(fields: ["student", "instalment"]) {
  id: UUID! @default(expr: "uuidV4()")
  school: School! # direct tenant reference (was only reachable via Student: audit F4)
  student: Student!
  instalment: FeeInstalment # null for a manual invoice
  academicYear: AcademicYear
  title: String! @default(value: "Fee") # what it is for, copied when the invoice is made ("Tuition - April")
  grossMinor: Int64 # before concessions (null for a manual invoice)
  discountMinor: Int64 # taken off by concessions (null for a manual invoice)
  amountMinor: Int64! # due, in minor units (paise)
  paidMinor: Int64! @default(value: "0")
  dueDate: Date!
  status: InvoiceStatus! @default(value: PENDING)
  createdAt: Timestamp! @default(expr: "request.time")
}

# A fee receipt (P2-7c): one per payment, made in the same transaction as the payment. The number is `R-<year>-<serial>`; the serial comes
# from the academic year's counter and is unique per year, so two receipts can never share a number, and a payment that fails leaves no gap.
# A receipt is never deleted; reversing the payment CANCELS it (it stays, marked).
type Receipt @table @unique(fields: ["academicYear", "serial"]) @unique(fields: ["school", "number"]) @unique(fields: ["payment"]) {
  id: UUID! @default(expr: "uuidV4()")
  school: School!
  academicYear: AcademicYear!
  serial: Int!
  number: String!
  payment: Payment!
  student: Student!
  invoice: Invoice!
  amountMinor: Int64!
  balanceAfterMinor: Int64! # what is still owed on the invoice after this payment
  cancelledAt: Timestamp
  cancelReason: String
  createdAt: Timestamp! @default(expr: "request.time")
}

# A payment against one invoice. Several payments make a part-payment. A payment is never edited or deleted: a mistake is REVERSED
# (kept, marked, and taken back out of the invoice), so the books show both.
type Payment @table {
  id: UUID! @default(expr: "uuidV4()")
  school: School!
  invoice: Invoice!
  student: Student!
  amountMinor: Int64!
  method: PaymentMethod!
  reference: String # cheque number, bank or UPI reference
  paidOn: Date!
  recordedBy: User!
  reversedAt: Timestamp
  reversalReason: String
  createdAt: Timestamp! @default(expr: "request.time")
}

# ---- Payroll (P2-8, ADR-0012). No statutory calculation (provident fund, ESI, professional tax, income tax): a salary is a list of EARNING
# components (basic pay, allowances) and DEDUCTION lines per person, all typed in; a monthly run goes DRAFT -> APPROVED (Principal only) -> PAID
# (Bursar only). Amounts are integer paise. Totals are never stored: they are summed from the lines, so they cannot disagree with them.
type SalaryLine @table @unique(fields: ["staff", "name"]) {
  id: UUID! @default(expr: "uuidV4()")
  school: School!
  staff: StaffProfile!
  kind: SalaryLineKind!
  name: String! # Basic pay, House rent allowance, Advance recovery ...
  amountMinor: Int64! # per month
  createdAt: Timestamp! @default(expr: "request.time")
}

type PayrollRun @table @unique(fields: ["school", "year", "month"]) {
  id: UUID! @default(expr: "uuidV4()")
  school: School!
  year: Int!
  month: Int! # 1 to 12
  status: PayrollRunStatus! @default(value: DRAFT)
  preparedBy: User!
  approvedBy: User
  approvedAt: Timestamp
  paidBy: User
  paidAt: Timestamp
  paidOn: Date # the day the salaries were paid
  paymentReference: String
  createdAt: Timestamp! @default(expr: "request.time")
}

# One person's payslip in one run. Its lines are COPIED from the salary lines when the draft run is made (so later changes to a salary do not
# alter a draft until it is made again), plus any manual lines added to the draft. Once the run is approved nothing in it can change.
type Payslip @table @unique(fields: ["run", "staff"]) {
  id: UUID! @default(expr: "uuidV4()")
  school: School!
  run: PayrollRun!
  staff: StaffProfile!
  createdAt: Timestamp! @default(expr: "request.time")
}

type PayslipLine @table {
  id: UUID! @default(expr: "uuidV4()")
  school: School!
  run: PayrollRun! # the same run as the payslip's, kept here so a run's totals are one sum
  payslip: Payslip!
  kind: SalaryLineKind!
  name: String!
  amountMinor: Int64!
  manual: Boolean! @default(value: false) # added by hand to this run, not copied from the salary lines
  createdAt: Timestamp! @default(expr: "request.time")
}

# Academic: Subject
type Subject @table @unique(fields: ["school", "code"]) {
  id: UUID! @default(expr: "uuidV4()")
  school: School!
  name: String!
  code: String!
  createdAt: Timestamp! @default(expr: "request.time")
}

# The school's ONE bell schedule (P3-1, ADR-0013): periods are defined once and every class uses them. Times are "HH:MM" (24 hour, zero padded, so
# text order is time order). No two periods start at the same minute or share a label; that they do not overlap is checked in the gateway.
type Period @table @unique(fields: ["school", "label"]) @unique(fields: ["school", "startTime"]) {
  id: UUID! @default(expr: "uuidV4()")
  school: School!
  label: String!
  startTime: String!
  endTime: String!
  isBreak: Boolean! @default(value: false) # a break or lunch: nothing is taught in it
  createdAt: Timestamp! @default(expr: "request.time")
}

# Which subjects a member of staff teaches (P3-2). Qualification for a timetable slot and for a substitute (ADR-0013).
type TeacherSubject @table @unique(fields: ["staff", "subject"]) {
  id: UUID! @default(expr: "uuidV4()")
  school: School!
  staff: StaffProfile!
  subject: Subject!
  createdAt: Timestamp! @default(expr: "request.time")
}

# The class teacher of a class for an academic year (P3-2): at most one per class per year, by key.
type ClassTeacher @table @unique(fields: ["classroom", "academicYear"]) {
  id: UUID! @default(expr: "uuidV4()")
  school: School!
  classroom: Classroom!
  academicYear: AcademicYear!
  staff: StaffProfile!
  createdAt: Timestamp! @default(expr: "request.time")
}

# One slot of the timetable (P3-3, ADR-0013): a class has this subject, taught by this member of staff, on this day in this period of the bell schedule,
# in this academic year. The two unique keys ARE the clash rules (decision 6): a class cannot be in two lessons and a teacher cannot teach two
# classes in the same slot, however many requests arrive at once. Replaces the Phase 0 stub `ClassSchedule`.
type TimetableEntry @table @unique(fields: ["academicYear", "classroom", "day", "period"]) @unique(fields: ["academicYear", "staff", "day", "period"]) {
  id: UUID! @default(expr: "uuidV4()")
  school: School!
  academicYear: AcademicYear!
  classroom: Classroom!
  subject: Subject!
  staff: StaffProfile!
  day: String! # MON .. SUN
  period: Period!
  createdAt: Timestamp! @default(expr: "request.time")
  updatedAt: Timestamp! @default(expr: "request.time") # set again by every change: devices ask for what changed since (updatedSince, P4-S1)
}

# Leave (P3-6, ADR-0013). Days are counted in HALF-DAYS (a whole day is 2), so a half day of leave needs no fractions. Replaces the Phase 0 stub `LeaveRequest`.
type LeaveType @table @unique(fields: ["school", "name"]) {
  id: UUID! @default(expr: "uuidV4()")
  school: School!
  name: String!
  paid: Boolean! # unpaid leave takes nothing from a balance and raises a payroll deduction proposal (P3-8)
  quotaHalfDays: Int! # yearly allowance of a paid type, in half-days; ignored for an unpaid type
  createdAt: Timestamp! @default(expr: "request.time")
}

# What a member of staff may still take of a paid type in one academic year. Made from the type's quota at the first request; HR can change the allowance.
type LeaveBalance @table @unique(fields: ["staff", "leaveType", "academicYear"]) {
  id: UUID! # derived from staff, type and year
  school: School!
  staff: StaffProfile!
  leaveType: LeaveType!
  academicYear: AcademicYear!
  allowedHalfDays: Int!
  remainingHalfDays: Int!
}

type LeaveRequest @table @unique(fields: ["staff", "clientId"]) {
  id: UUID! @default(expr: "uuidV4()")
  school: School!
  staff: StaffProfile!
  leaveType: LeaveType!
  startDate: Date!
  endDate: Date!
  half: String # MORNING or AFTERNOON for a half day (then start and end are the same day); null otherwise
  halfDays: Int! # how much leave this is, in half-days, counting only the school's working days
  reason: String
  clientId: String # the client's own id for this request: asking again with the same one returns the first (offline retries, P3-10)
  status: LeaveRequestStatus! @default(value: PENDING)
  decidedBy: User # the Principal who approved or rejected
  decidedAt: Timestamp
  decisionNote: String
  createdAt: Timestamp! @default(expr: "request.time")
  updatedAt: Timestamp! @default(expr: "request.time") # set again by every change: devices ask for what changed since (updatedSince, P4-S1)
}

# Exams and marks (P3-5, ADR-0013). Marks are whole TENTHS of a mark (one decimal place at most): no floating point anywhere. Replaces the Phase 0 stub `Exam`.
type AssessmentTerm @table @unique(fields: ["academicYear", "name"]) {
  id: UUID! @default(expr: "uuidV4()")
  school: School!
  academicYear: AcademicYear!
  name: String!
  createdAt: Timestamp! @default(expr: "request.time")
}

type Exam @table @unique(fields: ["term", "classroom", "subject", "title"]) {
  id: UUID! @default(expr: "uuidV4()")
  school: School!
  term: AssessmentTerm!
  classroom: Classroom!
  subject: Subject!
  title: String!
  examDate: Date!
  maxTenths: Int! # the exam's maximum, in tenths of a mark: 1000 is 100
  lastSubmissionId: String # the client's own id for the last marks submit: a replay of it changes nothing
  createdAt: Timestamp! @default(expr: "request.time")
}

# One student's mark in one exam. An absent student has absent = true and tenths = 0.
type Mark @table @unique(fields: ["exam", "student"]) {
  id: UUID! # derived from exam and student, so saving the same mark twice is one row
  school: School!
  exam: Exam!
  student: Student!
  tenths: Int!
  absent: Boolean!
  updatedAt: Timestamp! @default(expr: "request.time") # set again by every change: devices ask for what changed since (updatedSince, P4-S1)
}

# Append-only audit trail (E-AUD-1): the gateway writes one row per mutating request.
# `school` is null only for platform-level (SUPER_ADMIN) actions. Rows are never updated or deleted by any operation.
type AuditLog @table {
  id: UUID! @default(expr: "uuidV4()")
  school: School
  actor: User!
  action: String! # e.g. "invoice.create"
  entityType: String!
  entityId: String
  details: Any # request metadata; never secrets or full payloads
  createdAt: Timestamp! @default(expr: "request.time")
}

# ---- Attendance (P3-4, ADR-0013). Taken once a day per class. Only the exceptions are stored: a student with no mark on a submitted day is present.
type AttendanceDay @table @unique(fields: ["classroom", "date"]) {
  id: UUID! @default(expr: "uuidV4()")
  school: School!
  classroom: Classroom!
  date: Date!
  submittedBy: User!
  submittedAt: Timestamp! @default(expr: "request.time")
  submissionId: String # the client's own id for the last submit: a replay of it changes nothing
  locked: Boolean! @default(value: false) # a locked day refuses a teacher's edit; only the Academic admin corrects it, audited
  updatedAt: Timestamp! @default(expr: "request.time") # set again by every change: devices ask for what changed since (updatedSince, P4-S1)
}

type AttendanceMark @table @unique(fields: ["day", "student"]) {
  id: UUID! # derived from day and student, so saving the same mark twice is one row
  school: School!
  day: AttendanceDay!
  student: Student!
  status: AttendanceStatus!
  note: String
}

# A school's own wording for one of the seven statuses. Only the label is editable.
type AttendanceStatusLabel @table @unique(fields: ["school", "status"]) {
  id: UUID!
  school: School!
  status: AttendanceStatus!
  label: String!
}

# A member of staff's day: when they checked in and out (server time).
type StaffAttendance @table @unique(fields: ["staff", "date"]) {
  id: UUID! @default(expr: "uuidV4()")
  school: School!
  staff: StaffProfile!
  date: Date!
  checkIn: Timestamp
  checkOut: Timestamp
  correctedBy: User
  # Evidence for HR, not proof (a phone can fake its position): INSIDE, OUTSIDE or UNKNOWN, the distance from the school point, the reason the person gave, and the phone's own time as a note (decisions 9 and 10).
  # The position itself is never kept. A check-in beyond the hard ring waits for HR to confirm it.
  checkInStamp: String
  checkInDistanceM: Int
  checkInReason: String
  checkInDeviceTime: Timestamp
  needsConfirm: Boolean! @default(value: false)
  confirmedBy: User
  confirmedAt: Timestamp
  checkOutStamp: String
  checkOutDistanceM: Int
  checkOutReason: String
  checkOutDeviceTime: Timestamp
}

# ---- Substitution (P3-7, ADR-0013 decisions 4 and 6). The need for a substitute is DERIVED (an approved leave over a teacher's timetable); only the decision is stored.
# One substitute per lesson per date, and a substitute cannot be in two places in one period on a date: both are unique keys.
type Substitution @table @unique(fields: ["timetableEntry", "date"]) @unique(fields: ["substitute", "date", "period"]) {
  id: UUID! # derived from the lesson and the date, so changing the substitute is one row
  school: School!
  timetableEntry: TimetableEntry!
  date: Date!
  period: Period!
  substitute: StaffProfile!
  leaveRequest: LeaveRequest!
  assignedBy: User!
  createdAt: Timestamp! @default(expr: "request.time")
}

# ---- Notifications (P3-9, ADR-0013 decision 9). An in-app inbox. A row is written in the SAME transaction as its cause. It is addressed to one member of staff (seen through the
# account linked to that record, now or later) or to a ROLE (every active member with that role sees it). Reading is per user. Push (FCM) and SMS are Phase 4.
type Notification @table {
  id: UUID! @default(expr: "uuidV4()")
  school: School!
  recipientStaff: StaffProfile
  audienceRole: SchoolRole
  kind: String! # for example leave.approved; the words come from packages/i18n, in the reader's language
  params: Any # the values the words need: names, dates, a class
  entityType: String
  entityId: String
  createdAt: Timestamp! @default(expr: "request.time")
  pushedAt: Timestamp # set once, by whichever gateway instance claims the notice to push it (best effort, at most once)
}

type NotificationRead @table(key: ["notification", "user"]) {
  school: School!
  notification: Notification!
  user: User!
  readAt: Timestamp! @default(expr: "request.time")
}

# An announcement from the school to its staff (P4-S4): written by the Principal or the Academic admin on the web, read by every staff role, delivered as a notice per role in the
# same transaction. Withdrawing keeps the row (a phone that has it must hear that it is gone) and clears nothing: the gateway shows a withdrawn one without its words.
type Announcement @table {
  id: UUID! @default(expr: "uuidV4()")
  school: School!
  title: String!
  body: String!
  author: User!
  withdrawnAt: Timestamp
  createdAt: Timestamp! @default(expr: "request.time")
  updatedAt: Timestamp! @default(expr: "request.time")
}

enum DevicePlatform {
  IOS
  ANDROID
}

# A phone's push address (P4-S2, ADR-0014 decision 7). One row per token; the id is derived from the token, so registering the same token twice is one row, and a phone
# that changes hands moves to the new account. Removed when the person signs out, and when the push provider says the token is dead. The push carries only a notice id.
type DeviceToken @table @unique(fields: ["token"]) {
  id: UUID!
  user: User!
  token: String!
  platform: DevicePlatform!
  createdAt: Timestamp! @default(expr: "request.time")
  lastSeenAt: Timestamp! @default(expr: "request.time")
}

# A category a person has switched off: those notifications are kept but not shown (the inbox filters them).
type NotificationMute @table(key: ["school", "user", "category"]) {
  school: School!
  user: User!
  category: String!
}

# ---- Sync groundwork (P3-10). A removed record leaves a tombstone so a device that was offline can learn it is gone. classroomId and staffId say whose it was, so a teacher's
# device only hears about their own. Written in the same transaction as the removal.
type Tombstone @table {
  id: UUID! @default(expr: "uuidV4()")
  school: School!
  entityType: String!
  entityId: String!
  classroomId: UUID
  staffId: UUID
  deletedBy: User!
  deletedAt: Timestamp! @default(expr: "request.time")
}

# ---- Transport (P5-4a, ADR-0015). A vehicle, a route (one direction of a run, with its vehicle and its driver) and the route's ordered stops.
# Coordinates are micro-degrees in Int (never a floating point). A route's driver is a member of staff; that the person holds the DRIVER role is checked in the gateway.
type Vehicle @table @unique(fields: ["school", "registration"]) {
  id: UUID! @default(expr: "uuidV4()")
  school: School!
  registration: String!
  label: String!
  capacity: Int!
  status: VehicleStatus! @default(value: ACTIVE)
  createdAt: Timestamp! @default(expr: "request.time")
}

type TransportRoute @table @unique(fields: ["school", "name"]) {
  id: UUID! @default(expr: "uuidV4()")
  school: School!
  name: String!
  direction: RouteDirection!
  startTime: String # "HH:MM"
  vehicle: Vehicle
  driver: StaffProfile
  createdAt: Timestamp! @default(expr: "request.time")
}

type RouteStop @table @unique(fields: ["route", "sequence"]) @unique(fields: ["route", "name"]) {
  id: UUID! @default(expr: "uuidV4()")
  school: School!
  route: TransportRoute!
  sequence: Int! # 1, 2, 3 ... in the order the bus calls
  name: String!
  latMicro: Int
  lngMicro: Int
  arrivalTime: String # "HH:MM", the planned time
}
