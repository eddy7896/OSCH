name: flutter_sync
description: "OruSchools offline sync, the device side: the local database (Drift), the outbox, the local copy of what screens show, drafts and pull cursors. Pure Dart code (no Flutter UI); its tests run under flutter_test like the rest of the workspace."
version: 0.0.1
publish_to: none

resolution: workspace

environment:
  sdk: ^3.13.4

dependencies:
  drift: ^2.35.3

dev_dependencies:
  build_runner: ^2.17.1
  drift_dev: ^2.35.2
  lints: ^6.0.0
  flutter_test:
    sdk: flutter
