name: flutter_app
description: "OruSchools staff-app shell shared by the Teacher and Staff apps: configuration, the platform pieces (secure storage, screen lock, connectivity, the local database file), and the signed-in home."
version: 0.0.1
publish_to: none

resolution: workspace

environment:
  sdk: ^3.13.4
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_core: ^0.0.1
  flutter_auth: ^0.0.1
  flutter_sync: ^0.0.1
  flutter_secure_storage: ^11.2.0
  local_auth: ^3.0.2
  connectivity_plus: ^7.3.2
  drift_flutter: ^0.3.1
  drift: ^2.35.3
  http: ^1.6.0
  intl: ^0.20.3
  geolocator: ^14.0.1
  file_picker: ^13.3.0
  path_provider: ^2.1.6
  open_filex: ^5.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
