name: mobile_teacher
description: "OruSchools Teacher: offline-first Flutter app for teachers. Scaffold only; features arrive in Phase 4-5."
publish_to: 'none'
version: 0.1.0+1

resolution: workspace

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  flutter_core: ^0.0.1
  flutter_app: ^0.0.1

dev_dependencies:
  flutter_sync: ^0.0.1 # the integration tests read the phone's local database and the sync engine
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
