name: ci

on:
  push:
    branches: [main, staging, "app/**"]
  pull_request:
    branches: [main, staging, "app/**"]
  schedule:
    - cron: "0 3 * * 1" # weekly, Monday 03:00 UTC: strict drift check catches slow documentation rot
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # How many parallel jobs run the gateway integration suite. The `shard` list in the `gateway` job below must be 1..GATEWAY_SHARDS;
  # the `gateway-complete` job fails the build if any shard is missing, if any test file ran twice or not at all, or if a test failed.
  GATEWAY_SHARDS: 4

jobs:
  js:
    name: JS/TS (build, lint, typecheck, test, drift, evals)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Design tokens are up to date
        run: npm run tokens:check
      - name: "Languages: sources valid and generated files current"
        run: npm run i18n:check
      - name: Drift check (hallucination / doc-vs-code)
        run: node tools/checks/drift-check.mjs ${{ github.event_name == 'schedule' && '--strict' || '' }}
      - name: Spec evals
        run: node --test evals/*.test.mjs
      - name: Build, lint, typecheck, test (Turborepo)
        run: npx turbo run build lint typecheck test
      - name: Drift report artifact
        if: always()
        run: node tools/checks/drift-check.mjs --json > drift-report.json || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: drift-report
          path: drift-report.json

  flutter:
    name: Flutter (analyze, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Generated localization code is current
        run: |
          (cd packages/flutter-core && flutter gen-l10n)
          git diff --exit-code -- packages/flutter-core/lib/src/l10n
      - run: dart pub global activate melos
      - run: dart pub global run melos run analyze
      - run: dart pub global run melos run test

  dataconnect:
    name: Data Connect (compile, SDK fresh, tenant isolation on emulator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The Data Connect and Auth emulators are downloaded by the Firebase CLI on first use (minutes); keep them between runs.
      - name: Cache the Firebase emulators
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: firebase-emulators-${{ runner.os }}-
      - name: Schema + connector compile, SDK regenerated
        run: npx firebase dataconnect:compile
      - name: Generated SDK is committed and current
        run: git diff --exit-code -- packages/database/generated
      - name: Cross-tenant isolation tests (PGlite emulator, no Java needed)
        run: npm run test:dataconnect
      - name: Admin SDK data layer against the emulator
        run: npm run test:database

  # The gateway integration suite (about 3,000 tests against the real Auth and Data Connect emulators) is the slow part of CI, so it is split
  # over parallel jobs, each with its own emulators. tools/tests/gateway-shards.mjs plans which files each shard runs.
  gateway:
    name: Gateway integration (shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Cache the Firebase emulators
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: firebase-emulators-${{ runner.os }}-
      - name: This shard's part of the gateway suite
        run: npm run test:gateway
        env:
          ORU_SHARD: ${{ matrix.shard }}/${{ env.GATEWAY_SHARDS }}
      - name: Keep this shard's report for the completeness check
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gateway-shard-${{ matrix.shard }}
          path: apps/api-gateway/test-results/*.json
          if-no-files-found: warn

  gateway-complete:
    name: Gateway integration (all shards ran, none missing)
    needs: gateway
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Every shard job finished successfully
        run: |
          echo "gateway shard jobs: ${{ needs.gateway.result }}"
          test "${{ needs.gateway.result }}" = "success"
      - uses: actions/download-artifact@v4
        with:
          pattern: gateway-shard-*
          path: shard-reports
          merge-multiple: true
      - name: Every test file ran exactly once, nothing failed, nothing was skipped
        run: node tools/tests/gateway-shards.mjs verify shard-reports ${{ env.GATEWAY_SHARDS }}
