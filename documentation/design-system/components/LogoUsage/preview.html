<!doctype html>
<html>
<head><meta charset="utf-8"><title>Logo usage</title>
<style>
  body { margin:0; padding:24px; font-family:var(--font-sans); color:var(--text); background:var(--bg); }
  h2 { font-size:18px; line-height:26px; font-weight:600; margin:0 0 4px; }
  p.lead { margin:0 0 16px; font-size:14px; line-height:22px; color:var(--text-muted); max-width:640px; }
  section { margin-bottom:32px; }
  .panel { background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:24px; }
  .row { display:flex; flex-wrap:wrap; gap:24px; align-items:flex-end; }
  .cap { font-size:13px; line-height:18px; color:var(--text-muted); margin-top:8px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:16px; }
  .tile { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:16px; display:flex; flex-direction:column; gap:12px; }
  .stage { height:72px; display:grid; place-items:center; border-radius:8px; background:var(--surface-muted); overflow:hidden; }
  .no { display:flex; gap:6px; align-items:flex-start; font-size:13px; line-height:18px; color:var(--danger-fg); font-weight:600; }
  .ok { color:var(--success-fg); }
  .clear { position:relative; display:inline-block; padding:22px; outline:1px dashed var(--border-strong); background:repeating-linear-gradient(45deg, var(--primary-soft) 0 6px, transparent 6px 12px); }
  .clear > .inner { background:var(--surface); display:inline-flex; }
  .icons { display:flex; flex-wrap:wrap; gap:20px; }
  .icons figure { margin:0; display:flex; flex-direction:column; align-items:center; gap:8px; font-size:13px; color:var(--text-muted); }
  .icons img { width:88px; height:88px; border-radius:20px; display:block; }
  .anat { display:flex; gap:32px; align-items:center; flex-wrap:wrap; }
  .anat ul { margin:0; padding-left:18px; font-size:14px; line-height:24px; }
</style>
</head>
