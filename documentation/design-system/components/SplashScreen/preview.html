<!-- @dsCard group="Brand" height=640 page subtitle="Launch screens and the 1.3 s mark animation" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>Splash screens</title>
<style>
  body { margin:0; padding:24px; font-family:var(--font-sans); color:var(--text); background:var(--bg); }
  .bar { display:flex; align-items:center; gap:16px; margin-bottom:20px; flex-wrap:wrap; }
  .bar p { margin:0; font-size:14px; line-height:22px; color:var(--text-muted); max-width:560px; }
  .phones { display:flex; gap:20px; flex-wrap:wrap; }
  figure { margin:0; display:flex; flex-direction:column; align-items:center; gap:8px; font-size:13px; color:var(--text-muted); }
  .phone { position:relative; width:180px; height:390px; border-radius:28px; overflow:hidden; box-shadow:var(--shadow-raised); border:6px solid var(--text); }
  .mark { position:absolute; left:50%; top:50%; width:95px; height:95px; margin:-47.5px 0 0 -47.5px; }
  .foot { position:absolute; left:0; right:0; bottom:20px; display:flex; justify-content:center; }
  .run .spin { animation:oru-splash-spin 800ms cubic-bezier(.65,0,.35,1) 100ms both; transform-origin:32px 32px; }
  .run .dot { animation:oru-splash-dot 1270ms linear both; transform-box:fill-box; transform-origin:center; }
  @keyframes oru-splash-spin { from { transform:rotate(0deg); } to { transform:rotate(360deg); } }
  @keyframes oru-splash-dot {
    0% { transform:scale(1); animation-timing-function:cubic-bezier(.65,0,.35,1); }
    13.4% { transform:scale(.8); }
    70.9% { transform:scale(.8); animation-timing-function:cubic-bezier(.65,0,.35,1); }
    84.3% { transform:scale(1.3); animation-timing-function:cubic-bezier(.65,0,.35,1); }
    100% { transform:scale(1); }
  }
  @media (prefers-reduced-motion: reduce) { .run .spin, .run .dot { animation:none; } }
</style>
</head>
<body>
<div id="root"></div>
<script>
  var O = window.Oru, h = React.createElement;
  var APPS = [['ERP','#312e81','#ffffff'],['Teacher','#4f46e5','#ffffff'],['Staff','#0e7490','#ffffff'],['Parent','#c8462f','#ffffff'],['Driver','#f5b400','#151838']];
  function Mark(p) {
    return h('svg', { className:'mark', viewBox:'0 0 64 64', 'aria-hidden':true },
      h('g', { className:'spin' },
        h('path', { d:'M52 32A20 20 0 1 1 32 12', fill:'none', stroke:p.ink, strokeWidth:10, strokeLinecap:'round' }),
        h('circle', { className:'dot', cx:46.142, cy:17.858, r:6, fill:p.ink })));
  }
  function App() {
    var st = React.useState(0), n = st[0];
    React.useEffect(function () { var t = setInterval(function () { st[1](function (x) { return x + 1; }); }, 2600); return function () { clearInterval(t); }; }, []);
    return h(React.Fragment, null,
      h('div', { className:'bar' },
        h(O.Button, { variant:'secondary', size:'comfortable', icon:'refresh', onClick:function () { st[1](n + 1); } }, 'Replay'),
        h('p', null, 'Frame 0 is the native launch screen. The mark turns once (100–900 ms) while the dot tucks in, then the dot pops (900–1270 ms) and the app opens. The footer never moves. With reduced motion, the screen stays still.')),
      h('div', { className:'phones run', key:n },
        APPS.map(function (a) {
          return h('figure', { key:a[0] },
            h('div', { className:'phone', style:{ background:a[1] } }, h(Mark, { ink:a[2] }),
              h('div', { className:'foot' }, h(O.Logo, { size:20, app:a[0], tone:a[2] === '#ffffff' ? 'white' : 'ink' }))),
            a[0]);
        })));
  }
  ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
</body>
</html>
